wnload this HTML file and open it directly in your browser.\u003c/p>\u003cdiv id=\"slides\">\u003csection class=\"slide active\" id=\"p0\" data-scene=\"map\" aria-label=\"See the mechanism. Then use the equation.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 1 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Start here · 01\u003c/div>\u003ch2>See the mechanism. Then use the equation.\u003c/h2>\u003cp class=\"lead\">A visual workbook built around your Electrical Energy Systems audit.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"See the mechanism. Then use the equation.\">\u003ctitle>See the mechanism. Then use the equation.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"32\" y=\"44\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107\" y=\"75\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Turbine\u003c/text>\u003ctext x=\"107\" y=\"98\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">mechanical input\u003c/text>\u003crect x=\"32\" y=\"230\" width=\"150\" height=\"75\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107\" y=\"263.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Generator\u003c/text>\u003ctext x=\"107\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">rotation ↔ electricity\u003c/text>\u003crect x=\"225\" y=\"45\" width=\"155\" height=\"70\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"76\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">Transformer\u003c/text>\u003ctext x=\"302.5\" y=\"99\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">changing linked flux\u003c/text>\u003crect x=\"420\" y=\"45\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#2974c412\" stroke=\"#2974c4\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"495\" y=\"76\" font-size=\"16\" style=\"fill:#2974c4\" text-anchor=\"middle\" font-weight=\"600\">Transmission\u003c/text>\u003ctext x=\"495\" y=\"99\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">phase + current\u003c/text>\u003crect x=\"420\" y=\"230\" width=\"150\" height=\"75\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"495\" y=\"263.5\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Workshop\u003c/text>\u003ctext x=\"495\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">motor + heater\u003c/text>\u003crect x=\"225\" y=\"230\" width=\"155\" height=\"75\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"263.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Energy stores\u003c/text>\u003ctext x=\"302.5\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">rotation + fields\u003c/text>\u003cline x1=\"108\" y1=\"116\" x2=\"108\" y2=\"225\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M104.2481627781371,216.81930825292602 L108,225 L111.7518372218629,216.81930825292602\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"182\" y1=\"258\" x2=\"235\" y2=\"120\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M235.56942595777704,128.981968274193 L235,120 L228.56459697344044,126.29170786716519\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"382\" y1=\"80\" x2=\"415\" y2=\"80\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M406.819308252926,83.7518372218629 L415,80 L406.819308252926,76.2481627781371\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"495\" y1=\"117\" x2=\"495\" y2=\"225\" stroke=\"#2974c4\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M491.2481627781371,216.81930825292602 L495,225 L498.7518372218629,216.81930825292602\" fill=\"none\" stroke=\"#2974c4\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"188\" y1=\"267\" x2=\"220\" y2=\"267\" stroke=\"#087f8c\" stroke-width=\"2\" stroke-dasharray=\"5 4\">\u003c/line>\u003ctext x=\"300\" y=\"178\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"700\">ENERGY IS ACCOUNTED FOR\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>6 stages\u003c/b>\u003cspan>one physical story\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>10/30\u003c/b>\u003cspan>baseline; final test at the end\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"analogy\">\u003cb>Picture it.\u003c/b> Minecraft comparisons are memory aids. Each one has a stated limit so it does not replace the physics.\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Your goal is to explain how electromagnetic fields and AC behaviour govern energy storage, transfer and conversion in coils, transformers, machines and transmission lines.\u003c/p>\n  \u003cp>Work through six stages. On each page: \u003cb>predict a change, move a control, explain the result\u003c/b>. The pictures and numbers describe the same mechanism.\u003c/p>\n  \u003col>\u003cli>Current, voltage and energy\u003c/li>\u003cli>Magnetic fields and flux\u003c/li>\u003cli>Induction, stored energy and AC\u003c/li>\u003cli>Transformers\u003c/li>\u003cli>Motors and generators\u003c/li>\u003cli>The whole power system\u003c/li>\u003c/ol>\n  \u003cp>Allow several short study sessions. The final assessment takes about 20 minutes. Use the chapter menu to revisit a gap.\u003c/p>\u003cdiv class=\"analogy pdfonly\">\u003cb>Picture it.\u003c/b> Minecraft comparisons are memory aids. Each one has a stated limit so it does not replace the physics.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Before starting: what would you most like to be able to picture clearly?\u003c/p>\u003ctextarea data-note=\"0\" aria-label=\"Your explanation for lesson 1\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Keep this as a personal target. Revisit it after the final assessment.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"0\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p1\" data-scene=\"score\" aria-label=\"Your starting point: 10 / 30\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 2 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Start here · 02\u003c/div>\u003ch2>Your starting point: 10 / 30\u003c/h2>\u003cp class=\"lead\">Correct numerical results are useful; the next step is explaining their physical cause.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Your starting point: 10 / 30\">\u003ctitle>Your starting point: 10 / 30\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ctext x=\"27\" y=\"70\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Basics\u003c/text>\u003crect x=\"165\" y=\"56\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"56\" width=\"210\" height=\"22\" rx=\"5\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"535\" y=\"72\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">3/5\u003c/text>\u003ctext x=\"27\" y=\"116\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Flux\u003c/text>\u003crect x=\"165\" y=\"102\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"102\" width=\"70\" height=\"22\" rx=\"5\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"535\" y=\"118\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">1/5\u003c/text>\u003ctext x=\"27\" y=\"162\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Inductors\u003c/text>\u003crect x=\"165\" y=\"148\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"148\" width=\"0\" height=\"22\" rx=\"5\" fill=\"#d8692d\">\u003c/rect>\u003ctext x=\"535\" y=\"164\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">0/5\u003c/text>\u003ctext x=\"27\" y=\"208\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Transformers\u003c/text>\u003crect x=\"165\" y=\"194\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"194\" width=\"210\" height=\"22\" rx=\"5\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"535\" y=\"210\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">3/5\u003c/text>\u003ctext x=\"27\" y=\"254\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Machines\u003c/text>\u003crect x=\"165\" y=\"240\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"240\" width=\"70\" height=\"22\" rx=\"5\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"535\" y=\"256\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">1/5\u003c/text>\u003ctext x=\"27\" y=\"300\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"400\">Network\u003c/text>\u003crect x=\"165\" y=\"286\" width=\"350\" height=\"22\" rx=\"5\" fill=\"#e9eef1\">\u003c/rect>\u003crect x=\"165\" y=\"286\" width=\"140\" height=\"22\" rx=\"5\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"535\" y=\"302\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">2/5\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>10 / 30\u003c/b>\u003cspan>diagnostic score\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>33%\u003c/b>\u003cspan>not a module grade\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003ctable>\u003ctbody>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Mark\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\n  \u003ctr>\u003ctd>Electrical relationships\u003c/td>\u003ctd>3/5\u003c/td>\u003ctd>Correct fixed-resistor result; fixed-power assumptions mixed up.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>Magnetic fields\u003c/td>\u003ctd>1/5\u003c/td>\u003ctd>Flux unfamiliar; recognised eventual flattening without a cause.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>Inductors and energy\u003c/td>\u003ctd>0/5\u003c/td>\u003ctd>Both mechanisms unknown.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>Transformers\u003c/td>\u003ctd>3/5\u003c/td>\u003ctd>23 V and turns ratio correct; input current unknown.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>Machines\u003c/td>\u003ctd>1/5\u003c/td>\u003ctd>Recognised a connection between current, field and force.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>Power network\u003c/td>\u003ctd>2/5\u003c/td>\u003ctd>Stored rotation identified; phase-flow answer was a guess.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n  \u003cp>Your DC answer said both “no” and “the coil only works in DC”. Those conflict. You receive the decision mark, with no mechanism mark; this does not establish which wording you intended.\u003c/p>\n  \u003cp>This is a diagnostic of the sampled concepts, not a university module grade. Previous prompted answers are not being treated as independent mastery.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Which result came from reasoning, and which came from remembering an equation?\u003c/p>\u003ctextarea data-note=\"1\" aria-label=\"Your explanation for lesson 2\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Track that distinction as you study. A confident prediction plus a correct mechanism is stronger evidence than a remembered result alone.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"1\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p2\" data-scene=\"circuit\" aria-label=\"Charge moves around. Energy changes form.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 3 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">1 · Electrical basics · 03\u003c/div>\u003ch2>Charge moves around. Energy changes form.\u003c/h2>\u003cp class=\"lead\">A heater does not use up the charge that passes through it.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Charge moves around. Energy changes form.\">\u003ctitle>Charge moves around. Energy changes form.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cpath d=\"M90 110 H250 M350 110 H510 V285 H90 V110\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003crect x=\"250\" y=\"80\" width=\"100\" height=\"60\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"300\" y=\"115\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Heater\u003c/text>\u003ccircle cx=\"90\" cy=\"205\" r=\"31\" fill=\"white\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ctext x=\"90\" y=\"211\" font-size=\"22\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"700\">V\u003c/text>\u003ccircle cx=\"159.3\" cy=\"110\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"264.29999999999995\" cy=\"110\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"369.3\" cy=\"110\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"474.29999999999995\" cy=\"110\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"510\" cy=\"187\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"493.2\" cy=\"285\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"388.20000000000016\" cy=\"285\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"283.20000000000005\" cy=\"285\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"178.19999999999993\" cy=\"285\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003ccircle cx=\"90\" cy=\"228.99999999999994\" r=\"5\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003cline x1=\"305\" y1=\"78\" x2=\"305\" y2=\"30\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M308.7518372218629,38.180691747073965 L305,30 L301.2481627781371,38.180691747073965\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"333\" y=\"39\" font-size=\"14\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">thermal energy\u003c/text>\u003cline x1=\"440\" y1=\"285\" x2=\"365\" y2=\"285\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M373.180691747074,281.2481627781371 L365,285 L373.180691747074,288.7518372218629\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"300\" y=\"332\" font-size=\"15\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">same steady current around the loop\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Charge conserved\u003c/b>\u003cspan>same input and return current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Energy transferred\u003c/b>\u003cspan>electrical → thermal\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">I = charge / time &nbsp;&nbsp; V = energy / charge &nbsp;&nbsp; P = VI &nbsp;&nbsp; E = Pt\u003c/div>\u003cdiv class=\"analogy\">\u003cb>Picture it.\u003c/b> Think of a loop of minecarts carrying deliveries. The carts circulate while cargo is delivered. Limit: real electrons are not little fuel containers, and electrical energy transfer is described by fields.\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Current\u003c/b> is charge passing a point each second. In a steady circuit, the same current enters and leaves the heater: charge is not steadily piling up inside it.\u003c/p>\n  \u003cp>\u003cb>Voltage\u003c/b> describes energy transferred per unit charge between two points. A heater transfers electrical energy into thermal energy. The charges continue around the circuit.\u003c/p>\n  \u003cp>\u003cb>Energy\u003c/b> is an amount, measured in joules. \u003cb>Power\u003c/b> is the rate of energy transfer, measured in watts: one watt means one joule per second.\u003c/p>\n  \u003cp>The moving dots show \u003cb>conventional current\u003c/b>. Electron drift in a metal is opposite to that direction. The diagram is a circuit model, not a picture of the detailed electromagnetic energy flow around a wire.\u003c/p>\u003cdiv class=\"analogy pdfonly\">\u003cb>Picture it.\u003c/b> Think of a loop of minecarts carrying deliveries. The carts circulate while cargo is delivered. Limit: real electrons are not little fuel containers, and electrical energy transfer is described by fields.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>A 100 W heater runs for 10 seconds. How much energy is transferred? Does the return current become smaller?\u003c/p>\u003ctextarea data-note=\"2\" aria-label=\"Your explanation for lesson 3\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>1,000 J. The steady return current is equal to the outgoing current. Energy changes form; charge is conserved.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"2\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p3\" data-scene=\"fixed\" aria-label=\"Ask what stays fixed first.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 4 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">1 · Electrical basics · 04\u003c/div>\u003ch2>Ask what stays fixed first.\u003c/h2>\u003cp class=\"lead\">The same voltage change can produce opposite current trends in different arrangements.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Ask what stays fixed first.\">\u003ctitle>Ask what stays fixed first.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"25\" y=\"42\" width=\"255\" height=\"78\" rx=\"12\" fill=\"#2974c412\" stroke=\"#2974c4\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"152.5\" y=\"86\" font-size=\"16\" style=\"fill:#2974c4\" text-anchor=\"middle\" font-weight=\"600\">FIXED R = 10 Ω\u003c/text>\u003crect x=\"320\" y=\"42\" width=\"255\" height=\"78\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"447.5\" y=\"86\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">FIXED P = 100 W\u003c/text>\u003ctext x=\"150\" y=\"168\" font-size=\"23\" style=\"fill:#2974c4\" text-anchor=\"middle\" font-weight=\"600\">10 V → 1 A\u003c/text>\u003ctext x=\"450\" y=\"168\" font-size=\"23\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">10 V → 10 A\u003c/text>\u003ctext x=\"150\" y=\"211\" font-size=\"31\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"700\">10 W\u003c/text>\u003ctext x=\"450\" y=\"211\" font-size=\"31\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"700\">100 W\u003c/text>\u003cline x1=\"300\" y1=\"45\" x2=\"300\" y2=\"300\" stroke=\"#dbe2e6\" stroke-width=\"2\">\u003c/line>\u003ctext x=\"150\" y=\"274\" font-size=\"15\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Same resistor\u003c/text>\u003ctext x=\"450\" y=\"274\" font-size=\"15\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Different effective load\u003c/text>\u003ctext x=\"300\" y=\"332\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Name the fixed quantity before predicting current.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>1 A\u003c/b>\u003cspan>fixed-resistor current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>10 A\u003c/b>\u003cspan>constant-power current\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c3-v\">Voltage\u003coutput>10 V\u003c/output>\u003c/label>\u003cinput id=\"c3-v\" type=\"range\" min=\"5\" max=\"30\" step=\"1\" value=\"10\" data-page=\"3\" data-key=\"v\" aria-label=\"Voltage\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Fixed R: I = V/R, P = V²/R &nbsp;&nbsp; Fixed P: I = P/V\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Left: fixed resistance.\u003c/b> Increase the voltage across the same resistor. The larger electrical push produces more current. With both voltage and current larger, heating rises rapidly.\u003c/p>\n  \u003cp>\u003cb>Right: fixed useful power.\u003c/b> A supply arrangement delivers the same 100 W at a different load voltage. At a higher voltage, fewer coulombs per second are needed to deliver that power.\u003c/p>\n  \u003cp>Your 1b answer made cable resistance increase. \u003cb>The same cables retain the same resistance in this model.\u003c/b> Also, voltage is the quantity being changed; it cannot simultaneously be held constant.\u003c/p>\n  \u003cp>A load's effective input resistance can change with a transformer or controlled supply. That is separate from the cable resistance. Never combine quantities from different parts of the circuit without saying where they apply.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Before moving the slider: if V doubles, predict I and P in the left model, and I in the right model.\u003c/p>\u003ctextarea data-note=\"3\" aria-label=\"Your explanation for lesson 4\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Fixed R: current doubles and power quadruples. Fixed P: current halves. The right model changes its effective load resistance as needed; it is not the same unchanged resistor.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"3\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p4\" data-scene=\"transmission\" aria-label=\"Why a high transmission voltage helps.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 5 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">1 · Electrical basics · 05\u003c/div>\u003ch2>Why a high transmission voltage helps.\u003c/h2>\u003cp class=\"lead\">Deliver the same useful power using less cable current.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Why a high transmission voltage helps.\">\u003ctitle>Why a high transmission voltage helps.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"30\" y=\"115\" width=\"145\" height=\"100\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"102.5\" y=\"161\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Source\u003c/text>\u003ctext x=\"102.5\" y=\"184\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">load power + cable loss\u003c/text>\u003crect x=\"425\" y=\"115\" width=\"145\" height=\"100\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"497.5\" y=\"161\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">Load\u003c/text>\u003ctext x=\"497.5\" y=\"184\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">100 kW useful\u003c/text>\u003cline x1=\"178\" y1=\"145\" x2=\"420\" y2=\"145\" stroke=\"#13263a\" stroke-width=\"5\">\u003c/line>\u003cline x1=\"178\" y1=\"185\" x2=\"420\" y2=\"185\" stroke=\"#13263a\" stroke-width=\"5\">\u003c/line>\u003cline x1=\"225\" y1=\"145\" x2=\"350\" y2=\"145\" stroke=\"#087f8c\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M341.819308252926,148.7518372218629 L350,145 L341.819308252926,141.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"300\" y=\"115\" font-size=\"23\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"700\">10 A\u003c/text>\u003ctext x=\"300\" y=\"220\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">R cable = 2 Ω total\u003c/text>\u003cline x1=\"300\" y1=\"235\" x2=\"300\" y2=\"280\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M296.2481627781371,271.819308252926 L300,280 L303.7518372218629,271.819308252926\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"300\" y=\"310\" font-size=\"25\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"700\">200 W cable heat\u003c/text>\u003ctext x=\"300\" y=\"40\" font-size=\"17\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Vload = 10 kV\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>10 A\u003c/b>\u003cspan>cable current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>200 W\u003c/b>\u003cspan>cable loss\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>20 V\u003c/b>\u003cspan>cable voltage drop\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c4-v\">Load voltage\u003coutput>10 kV\u003c/output>\u003c/label>\u003cinput id=\"c4-v\" type=\"range\" min=\"5\" max=\"25\" step=\"1\" value=\"10\" data-page=\"4\" data-key=\"v\" aria-label=\"Load voltage\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">I = P\u003csub>load\u003c/sub>/V\u003csub>load\u003c/sub> &nbsp;&nbsp; P\u003csub>loss\u003c/sub> = I²R\u003csub>cable\u003c/sub>\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>This example delivers \u003cb>100 kW at the load terminals\u003c/b>, at unity power factor. The outgoing and returning cables together have 2 Ω resistance.\u003c/p>\n  \u003cp>At 10 kV, current is 10 A and cable heating is 200 W. At 20 kV, current is 5 A and cable heating is 50 W. Halving current quarters its square.\u003c/p>\n  \u003cp>There are two different voltages: the \u003cb>load voltage\u003c/b> used in P = VI, and the smaller \u003cb>cable voltage drop\u003c/b> used in V\u003csub>drop\u003c/sub> = IR\u003csub>cable\u003c/sub>. The source must provide the load voltage plus the cable drop in this resistive equivalent.\u003c/p>\n  \u003cp>For general single-phase AC, useful power is VI cos φ. Here cos φ = 1. A three-phase calculation uses the appropriate phase or line quantities.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>If cable resistance stays fixed, why can cable heating change?\u003c/p>\u003ctextarea data-note=\"4\" aria-label=\"Your explanation for lesson 5\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Heating also depends on current squared. A fixed resistance does not imply fixed power dissipation.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"4\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p5\" data-scene=\"coil\" aria-label=\"A current creates a magnetic field.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 6 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">2 · Fields and flux · 06\u003c/div>\u003ch2>A current creates a magnetic field.\u003c/h2>\u003cp class=\"lead\">A field describes magnetic influence throughout space.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A current creates a magnetic field.\">\u003ctitle>A current creates a magnetic field.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cpath d=\"M45 270 H125 V180\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M475 180 V270 H555\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cellipse cx=\"125\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"168.75\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"212.5\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"256.25\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"300\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"343.75\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"387.5\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cellipse cx=\"431.25\" cy=\"180\" rx=\"19\" ry=\"72\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/ellipse>\u003cline x1=\"125\" y1=\"142\" x2=\"475\" y2=\"142\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M466.819308252926,145.7518372218629 L475,142 L466.819308252926,138.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"125\" y1=\"161\" x2=\"475\" y2=\"161\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M466.819308252926,164.7518372218629 L475,161 L466.819308252926,157.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"125\" y1=\"180\" x2=\"475\" y2=\"180\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M466.819308252926,183.7518372218629 L475,180 L466.819308252926,176.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"125\" y1=\"199\" x2=\"475\" y2=\"199\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M466.819308252926,202.7518372218629 L475,199 L466.819308252926,195.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"125\" y1=\"218\" x2=\"475\" y2=\"218\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M466.819308252926,221.7518372218629 L475,218 L466.819308252926,214.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003ctext x=\"300\" y=\"44\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">More ampere-turns → stronger field in a linear model\u003c/text>\u003ctext x=\"300\" y=\"320\" font-size=\"17\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">Field reverses when current reverses\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>200 At\u003c/b>\u003cspan>magnetising drive NI\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>→\u003c/b>\u003cspan>illustrated axial field direction\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c5-i\">Coil current\u003coutput>2 A\u003c/output>\u003c/label>\u003cinput id=\"c5-i\" type=\"range\" min=\"-4\" max=\"4\" step=\"0.5\" value=\"2\" data-page=\"5\" data-key=\"i\" aria-label=\"Coil current\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c5-n\">Turns\u003coutput>100 \u003c/output>\u003c/label>\u003cinput id=\"c5-n\" type=\"range\" min=\"50\" max=\"200\" step=\"25\" value=\"100\" data-page=\"5\" data-key=\"n\" aria-label=\"Turns\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Magnetising drive = NI &nbsp; (ampere-turns)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A current-carrying wire produces a magnetic field around it. Wrap the wire into a coil and the contributions from its turns reinforce one another through the middle.\u003c/p>\n  \u003cp>\u003cb>Flux density B\u003c/b> describes the local magnetic field strength and direction, in teslas. A compass or another magnetic object responds to the field at its location.\u003c/p>\n  \u003cp>More turns and more current usually produce a stronger field, provided the geometry stays fixed and the core has not entered saturation. Reversing current reverses the field direction.\u003c/p>\n  \u003cp>An iron core responds to the applied field through magnetisation. It can guide a much larger flux than air for the same ampere-turns. This is not electrical current flowing around the iron ring.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>If current reverses but its magnitude stays the same, what happens to the field?\u003c/p>\u003ctextarea data-note=\"5\" aria-label=\"Your explanation for lesson 6\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Its direction reverses. In a linear model the field magnitude is unchanged. Real ferromagnets can retain magnetisation; hysteresis is omitted here.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"5\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p6\" data-scene=\"flux\" aria-label=\"Flux: how much field passes through an area.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 7 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">2 · Fields and flux · 07\u003c/div>\u003ch2>Flux: how much field passes through an area.\u003c/h2>\u003cp class=\"lead\">Flux is not a substance travelling inside the core.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Flux: how much field passes through an area.\">\u003ctitle>Flux: how much field passes through an area.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"45\" y1=\"70\" x2=\"550\" y2=\"70\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,73.7518372218629 L550,70 L541.819308252926,66.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"45\" y1=\"110\" x2=\"550\" y2=\"110\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,113.7518372218629 L550,110 L541.819308252926,106.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"45\" y1=\"150\" x2=\"550\" y2=\"150\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,153.7518372218629 L550,150 L541.819308252926,146.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"45\" y1=\"190\" x2=\"550\" y2=\"190\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,193.7518372218629 L550,190 L541.819308252926,186.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"45\" y1=\"230\" x2=\"550\" y2=\"230\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,233.7518372218629 L550,230 L541.819308252926,226.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"45\" y1=\"270\" x2=\"550\" y2=\"270\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M541.819308252926,273.7518372218629 L550,270 L541.819308252926,266.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cellipse cx=\"300\" cy=\"177\" rx=\"24\" ry=\"105\" transform=\"rotate(0 300 177)\" fill=\"#6952b825\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/ellipse>\u003cline x1=\"300\" y1=\"177\" x2=\"425\" y2=\"177\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M416.819308252926,180.7518372218629 L425,177 L416.819308252926,173.2481627781371\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/path>\u003ctext x=\"433\" y=\"167\" font-size=\"13\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">normal\u003c/text>\u003ctext x=\"41\" y=\"36\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">Uniform B →\u003c/text>\u003ctext x=\"300\" y=\"336\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">θ = 0° between B and the surface normal\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>10 mWb\u003c/b>\u003cspan>flux through the surface\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0°\u003c/b>\u003cspan>normal-to-field angle\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c6-b\">Field strength B\u003coutput>0.5 T\u003c/output>\u003c/label>\u003cinput id=\"c6-b\" type=\"range\" min=\"0.1\" max=\"1\" step=\"0.1\" value=\"0.5\" data-page=\"6\" data-key=\"b\" aria-label=\"Field strength B\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c6-a\">Surface area\u003coutput>0.02 m²\u003c/output>\u003c/label>\u003cinput id=\"c6-a\" type=\"range\" min=\"0.01\" max=\"0.05\" step=\"0.01\" value=\"0.02\" data-page=\"6\" data-key=\"a\" aria-label=\"Surface area\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c6-angle\">Normal-to-field angle\u003coutput>0 °\u003c/output>\u003c/label>\u003cinput id=\"c6-angle\" type=\"range\" min=\"0\" max=\"90\" step=\"5\" value=\"0\" data-page=\"6\" data-key=\"angle\" aria-label=\"Normal-to-field angle\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Uniform field: Φ = BA cos θ &nbsp;&nbsp; General form: Φ = ∫ B · dA\u003c/div>\u003cdiv class=\"analogy\">\u003cb>Picture it.\u003c/b> Imagine rain passing through a Minecraft frame. More rain, a larger opening or a different tilt changes how much passes through. Limit: magnetic field lines form closed loops; flux is not a flow of water.\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Magnetic flux Φ\u003c/b> measures the magnetic field passing through a chosen surface. It depends on field strength, surface area and orientation.\u003c/p>\n  \u003cp>A larger surface intercepts more of a uniform perpendicular field. Turn the surface edge-on to the field and less passes through it.\u003c/p>\n  \u003cp>The angle θ is measured between the field and the \u003cb>surface normal\u003c/b>: an imaginary arrow sticking straight out of the surface. It is not measured from the flat surface itself.\u003c/p>\n  \u003cp>The arrow lines are a drawing convention. They help show direction and relative density; there are no literal magnetic strings. Flux is measured in webers (Wb), while B is measured in teslas (T).\u003c/p>\u003cdiv class=\"analogy pdfonly\">\u003cb>Picture it.\u003c/b> Imagine rain passing through a Minecraft frame. More rain, a larger opening or a different tilt changes how much passes through. Limit: magnetic field lines form closed loops; flux is not a flow of water.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Could a strong field produce zero flux through one particular surface?\u003c/p>\u003ctextarea data-note=\"6\" aria-label=\"Your explanation for lesson 7\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Yes. If the field is parallel to that surface, it has no component through it, so the flux through that surface is zero.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"6\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p7\" data-scene=\"gap\" aria-label=\"An air gap makes the magnetic path harder.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 8 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">2 · Fields and flux · 08\u003c/div>\u003ch2>An air gap makes the magnetic path harder.\u003c/h2>\u003cp class=\"lead\">At fixed coil current, adding a gap reduces the flux.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"An air gap makes the magnetic path harder.\">\u003ctitle>An air gap makes the magnetic path harder.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"145\" y=\"55\" width=\"310\" height=\"250\" rx=\"38\" fill=\"none\" stroke=\"#cbd5dc\" stroke-width=\"51\">\u003c/rect>\u003cpath d=\"M115 102 Q180 85 176 110\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 124 Q180 107 176 132\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 146 Q180 129 176 154\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 168 Q180 151 176 176\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 190 Q180 173 176 198\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 212 Q180 195 176 220\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 234 Q180 217 176 242\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M176 87 H418 V273 H176 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.9946620022792336\" opacity=\"0.848265150740751\">\u003c/path>\u003cpath d=\"M187 98 H407 V262 H187 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.9946620022792336\" opacity=\"0.848265150740751\">\u003c/path>\u003cpath d=\"M198 109 H396 V251 H198 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.9946620022792336\" opacity=\"0.848265150740751\">\u003c/path>\u003cline x1=\"280\" y1=\"87\" x2=\"345\" y2=\"87\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M336.819308252926,90.7518372218629 L345,87 L336.819308252926,83.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"300\" y=\"181\" font-size=\"18\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">shared flux Φ\u003c/text>\u003ctext x=\"300\" y=\"31\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">N = 100 turns · fixed-current model\u003c/text>\u003ctext x=\"487\" y=\"181\" font-size=\"14\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">no gap\u003c/text>\u003ctext x=\"300\" y=\"344\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">air adds reluctance; the coil current is held fixed\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>0.628 mWb\u003c/b>\u003cspan>core flux\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0.628 T\u003c/b>\u003cspan>flux density\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>159.15 kAt/Wb\u003c/b>\u003cspan>total reluctance\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c7-gap\">Air gap\u003coutput>0 mm\u003c/output>\u003c/label>\u003cinput id=\"c7-gap\" type=\"range\" min=\"0\" max=\"2\" step=\"0.1\" value=\"0\" data-page=\"7\" data-key=\"gap\" aria-label=\"Air gap\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c7-i\">Current\u003coutput>1 A\u003c/output>\u003c/label>\u003cinput id=\"c7-i\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.2\" value=\"1\" data-page=\"7\" data-key=\"i\" aria-label=\"Current\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Φ ≈ NI / ℜ\u003csub>total\u003c/sub> &nbsp;&nbsp; ℜ = length / (μ × area)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Permeability μ\u003c/b> describes how a material responds magnetically. Iron has much higher permeability than air over its useful operating range.\u003c/p>\n  \u003cp>\u003cb>Reluctance ℜ\u003c/b> describes how difficult a magnetic path is to establish flux through. A longer path or lower permeability increases reluctance; a wider cross-section reduces it.\u003c/p>\n  \u003cp>The coil supplies magnetising drive NI. With the same drive, a larger total reluctance produces less flux. Even a short air gap can dominate the total reluctance because air has low permeability.\u003c/p>\n  \u003cp>This is a linear, constant-current model. It neglects leakage, fringing and saturation. If voltage rather than current is constrained, you must reconsider the assumptions.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Why does “an empty gap leaves more space for field” give the wrong prediction here?\u003c/p>\u003ctextarea data-note=\"7\" aria-label=\"Your explanation for lesson 8\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Flux depends on the magnetic response of the path, not on available empty space. Replacing high-permeability iron with air increases reluctance and lowers flux at fixed NI.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"7\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p8\" data-scene=\"saturation\" aria-label=\"Saturation: iron loses its extra advantage.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 9 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">2 · Fields and flux · 09\u003c/div>\u003ch2>Saturation: iron loses its extra advantage.\u003c/h2>\u003cp class=\"lead\">Increasing current eventually gives a smaller extra increase in B.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Saturation: iron loses its extra advantage.\">\u003ctitle>Saturation: iron loses its extra advantage.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"65\" x2=\"55\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"305\" x2=\"550\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"55\" y=\"51\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">B (illustrative units)\u003c/text>\u003ctext x=\"550\" y=\"329\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">magnetising drive →\u003c/text>\u003cpath d=\"M55.00,305.00L58.09,299.76L61.19,294.52L64.28,289.30L67.38,284.11L70.47,278.95L73.56,273.82L76.66,268.75L79.75,263.73L82.84,258.77L85.94,253.88L89.03,249.07L92.13,244.33L95.22,239.68L98.31,235.12L101.41,230.66L104.50,226.29L107.59,222.02L110.69,217.86L113.78,213.80L116.88,209.85L119.97,206.01L123.06,202.28L126.16,198.67L129.25,195.16L132.34,191.77L135.44,188.49L138.53,185.32L141.63,182.26L144.72,179.30L147.81,176.46L150.91,173.71L154.00,171.07L157.09,168.54L160.19,166.10L163.28,163.75L166.38,161.50L169.47,159.34L172.56,157.27L175.66,155.28L178.75,153.38L181.84,151.55L184.94,149.81L188.03,148.13L191.13,146.53L194.22,145.00L197.31,143.54L200.41,142.14L203.50,140.80L206.59,139.52L209.69,138.29L212.78,137.12L215.88,136.00L218.97,134.93L222.06,133.91L225.16,132.93L228.25,132.00L231.34,131.10L234.44,130.25L237.53,129.43L240.63,128.65L243.72,127.90L246.81,127.18L249.91,126.50L253.00,125.84L256.09,125.21L259.19,124.61L262.28,124.03L265.38,123.48L268.47,122.94L271.56,122.43L274.66,121.94L277.75,121.47L280.84,121.02L283.94,120.58L287.03,120.16L290.13,119.76L293.22,119.37L296.31,118.99L299.41,118.63L302.50,118.28L305.59,117.94L308.69,117.62L311.78,117.30L314.88,116.99L317.97,116.70L321.06,116.41L324.16,116.13L327.25,115.86L330.34,115.60L333.44,115.34L336.53,115.09L339.63,114.85L342.72,114.61L345.81,114.38L348.91,114.15L352.00,113.93L355.09,113.72L358.19,113.51L361.28,113.30L364.38,113.10L367.47,112.90L370.56,112.70L373.66,112.51L376.75,112.32L379.84,112.14L382.94,111.96L386.03,111.78L389.13,111.60L392.22,111.43L395.31,111.26L398.41,111.09L401.50,110.92L404.59,110.75L407.69,110.59L410.78,110.43L413.88,110.27L416.97,110.11L420.06,109.95L423.16,109.80L426.25,109.64L429.34,109.49L432.44,109.34L435.53,109.19L438.63,109.04L441.72,108.89L444.81,108.74L447.91,108.60L451.00,108.45L454.09,108.30L457.19,108.16L460.28,108.02L463.38,107.87L466.47,107.73L469.56,107.59L472.66,107.45L475.75,107.31L478.84,107.17L481.94,107.03L485.03,106.89L488.13,106.75L491.22,106.61L494.31,106.48L497.41,106.34L500.50,106.20L503.59,106.06L506.69,105.93L509.78,105.79L512.88,105.66L515.97,105.52L519.06,105.38L522.16,105.25L525.25,105.11L528.34,104.98L531.44,104.84L534.53,104.71L537.63,104.58L540.72,104.44L543.81,104.31L546.91,104.17L550.00,104.04\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ccircle cx=\"154\" cy=\"171.07478603003364\" r=\"7\" fill=\"#d8692d\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/circle>\u003ctext x=\"300\" y=\"35\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">The slope falls; the field is not strictly capped.\u003c/text>\u003cline x1=\"55\" y1=\"305\" x2=\"440\" y2=\"65\" stroke=\"#dbe2e6\" stroke-width=\"2\" stroke-dasharray=\"6 6\">\u003c/line>\u003ctext x=\"405\" y=\"98\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">linear extrapolation\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>1.12\u003c/b>\u003cspan>illustrative B\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Larger\u003c/b>\u003cspan>incremental response\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c8-i\">Magnetising drive\u003coutput>1 relative\u003c/output>\u003c/label>\u003cinput id=\"c8-i\" type=\"range\" min=\"0\" max=\"5\" step=\"0.1\" value=\"1\" data-page=\"8\" data-key=\"i\" aria-label=\"Magnetising drive\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Before saturation: roughly proportional &nbsp;&nbsp; Near saturation: reduced incremental permeability\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Inside a ferromagnet, magnetic regions called \u003cb>domains\u003c/b> can change their orientation and extent. This creates a large magnetisation in response to an applied field.\u003c/p>\n  \u003cp>When most of the available magnetisation is aligned, further increases in magnetising drive cannot produce the same extra contribution. The B-versus-current curve bends: its slope falls.\u003c/p>\n  \u003cp>Your answer recognised flattening. The missing part was the mechanism. It does not necessarily plateau “very fast”: the knee depends on material, geometry, turns and current.\u003c/p>\n  \u003cp>B does not become mathematically capped. Even beyond saturation it still rises with applied field, but with a much smaller incremental slope. This graph is illustrative, not a measured material curve.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Why can a saturated coil draw much more current without obtaining a proportionally larger flux?\u003c/p>\u003ctextarea data-note=\"8\" aria-label=\"Your explanation for lesson 9\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The core no longer adds much extra magnetisation. Its incremental permeability and inductance fall, so the former linear relationship no longer applies.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"8\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p9\" data-scene=\"faraday\" aria-label=\"Changing flux induces a voltage.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 10 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 10\u003c/div>\u003ch2>Changing flux induces a voltage.\u003c/h2>\u003cp class=\"lead\">A field can exist without inducing a voltage. Change is the key.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Changing flux induces a voltage.\">\u003ctitle>Changing flux induces a voltage.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"75\" x2=\"55\" y2=\"310\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"310\" x2=\"550\" y2=\"310\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"192.5\" x2=\"550\" y2=\"192.5\" stroke=\"#dbe2e6\" stroke-width=\"1\">\u003c/line>\u003ctext x=\"55\" y=\"61\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">normalised flux and emf\u003c/text>\u003ctext x=\"550\" y=\"334\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">time (relative)\u003c/text>\u003cpath d=\"M55.00,155.78L
