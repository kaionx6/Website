 font-weight=\"400\">Direction, energy and units\u003c/text>\u003cline x1=\"280\" y1=\"105\" x2=\"320\" y2=\"105\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M311.819308252926,108.7518372218629 L320,105 L311.819308252926,101.2481627781371\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"450\" y1=\"160\" x2=\"400\" y2=\"218\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M402.49981889145846,209.35413940027325 L400,218 L408.18317666374406,214.25358575569186\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"165\" y1=\"267\" x2=\"70\" y2=\"163\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M78.28746741997678,166.50968428249942 L70,163 L72.74726612937907,171.5704450767954\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/path>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Sketch first\u003c/b>\u003cspan>label what the arrows mean\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Explain second\u003c/b>\u003cspan>use an equation to check\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Use the six short practice prompts below the picture. These are learning checks, so revealing an answer is allowed. Rephrase the mechanism in your own words afterward.\u003c/p>\n  \u003cp>\u003cb>A useful answer has three pieces:\u003c/b> what is held fixed, what changes, and the physical chain connecting cause to effect.\u003c/p>\n  \u003cp>Use arrows in a sketch if words are difficult. For example, label the energy store and the input/output arrows. Keep current, flux and energy as different quantities.\u003c/p>\n  \u003cp>Ticking a lesson records your own progress; it is not an automatic mastery score. The final written assessment is graded separately when you send it back.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Choose one mechanism you can now explain without looking at its equation.\u003c/p>\u003ctextarea data-note=\"27\" aria-label=\"Your explanation for lesson 28\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Cover the diagram and describe the mechanism. Then reopen it and check the direction of each arrow. Revisit any step you could name but could not explain.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicegrid\">\u003cdiv class=\"practicecard\">\u003cb>1. Fixed quantities\u003c/b>\u003cp>A fixed resistor receives twice its original voltage. A different arrangement transmits the same power at twice its original voltage. Explain the different current trends.\u003c/p>\u003ctextarea data-note=\"practice0\" aria-label=\"Practice answer 1\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Fixed R gives I = V/R, so current doubles. Fixed useful power at unity power factor gives I = P/V, so current halves. Physical cable resistance need not change.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicecard\">\u003cb>2. Flux and gaps\u003c/b>\u003cp>Explain flux using field, area and direction. Why does adding an air gap lower flux at fixed coil current?\u003c/p>\u003ctextarea data-note=\"practice1\" aria-label=\"Practice answer 2\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Flux is the field through a chosen surface. In a magnetic circuit, air has lower permeability than iron. The gap raises reluctance; at fixed NI the flux falls.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicecard\">\u003cb>3. Induction and energy\u003c/b>\u003cp>Explain why a coil opposes a change in current, and how it can return energy to a supply.\u003c/p>\u003ctextarea data-note=\"practice2\" aria-label=\"Practice answer 3\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Changing current changes linked flux, inducing an emf opposing that change. The magnetic field stores energy as current rises and releases it as current falls. In an ideal AC cycle the energy received is returned.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicecard\">\u003cb>4. Transformer loading\u003c/b>\u003cp>An ideal transformer supplies 12 V at 2 A from 240 V. Find input current and explain why it rises if output load increases.\u003c/p>\u003ctextarea data-note=\"practice3\" aria-label=\"Practice answer 4\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Output is 24 W, so input current is 0.10 A at unity power factor. Increased secondary load current has an opposing magnetising effect; extra primary load current balances it and supplies the added output power.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicecard\">\u003cb>5. Two kinds of motor\u003c/b>\u003cp>Why does zero slip remove sustained basic induction torque but not all synchronous torque?\u003c/p>\u003ctextarea data-note=\"practice4\" aria-label=\"Practice answer 5\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>An induction rotor needs relative field motion to induce its steady current. A synchronous rotor has an independently established field; an angular offset produces torque at equal speed.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"practicecard\">\u003cb>6. Frequency and phase\u003c/b>\u003cp>Distinguish the cause of falling generator frequency from the cause of power flow between equal-magnitude AC voltages.\u003c/p>\u003ctextarea data-note=\"practice5\" aria-label=\"Practice answer 6\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Frequency falls when mechanical input is below electrical demand and stored rotation supplies the shortfall. Equal-magnitude AC voltages can still have a phase difference that creates a line voltage difference and real power transfer.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"27\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p28\" data-scene=\"toolbox\" aria-label=\"A compact language and equation toolbox.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 29 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Review and references · 29\u003c/div>\u003ch2>A compact language and equation toolbox.\u003c/h2>\u003cp class=\"lead\">Read symbols as statements about a physical situation.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A compact language and equation toolbox.\">\u003ctitle>A compact language and equation toolbox.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"35\" y=\"38\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"157.5\" y=\"75\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Current\u003c/text>\u003ctext x=\"157.5\" y=\"98\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">A\u003c/text>\u003crect x=\"320\" y=\"38\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"442.5\" y=\"75\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Energy\u003c/text>\u003ctext x=\"442.5\" y=\"98\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">J\u003c/text>\u003crect x=\"35\" y=\"143\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"157.5\" y=\"180\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Power\u003c/text>\u003ctext x=\"157.5\" y=\"203\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">W\u003c/text>\u003crect x=\"320\" y=\"143\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"442.5\" y=\"180\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Field\u003c/text>\u003ctext x=\"442.5\" y=\"203\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">T\u003c/text>\u003crect x=\"35\" y=\"248\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"157.5\" y=\"285\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Flux\u003c/text>\u003ctext x=\"157.5\" y=\"308\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Wb\u003c/text>\u003crect x=\"320\" y=\"248\" width=\"245\" height=\"82\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"442.5\" y=\"285\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Torque\u003c/text>\u003ctext x=\"442.5\" y=\"308\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">N·m\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Different quantities\u003c/b>\u003cspan>different meanings and units\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Units help\u003c/b>\u003cspan>check every result\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Before using any formula, name the component, reference directions, model and fixed quantities.\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cdiv class=\"glossary\">\u003cp>\u003cb>I, current (A):\u003c/b> charge passing per second.\u003c/p>\u003cp>\u003cb>V, voltage (V):\u003c/b> energy per unit charge between points.\u003c/p>\u003cp>\u003cb>P, real power (W):\u003c/b> average net energy transfer each second.\u003c/p>\u003cp>\u003cb>Q, reactive power (var):\u003c/b> quadrature exchange in sinusoidal AC.\u003c/p>\u003cp>\u003cb>B, flux density (T):\u003c/b> local magnetic field.\u003c/p>\u003cp>\u003cb>Φ, flux (Wb):\u003c/b> field through a chosen surface.\u003c/p>\u003cp>\u003cb>μ, permeability:\u003c/b> magnetic material response.\u003c/p>\u003cp>\u003cb>ℜ, reluctance:\u003c/b> opposition to establishing flux.\u003c/p>\u003cp>\u003cb>L, inductance (H):\u003c/b> flux linkage per current in a linear model.\u003c/p>\u003cp>\u003cb>T, torque (N·m):\u003c/b> turning effect.\u003c/p>\u003cp>\u003cb>ω, angular speed (rad/s):\u003c/b> rotation rate.\u003c/p>\u003cp>\u003cb>s, slip:\u003c/b> fractional field-to-rotor speed difference.\u003c/p>\u003cp>\u003cb>δ, angle:\u003c/b> specify which two fields or voltages it compares.\u003c/p>\u003cp>\u003cb>RMS:\u003c/b> equivalent DC heating value for a resistor.\u003c/p>\u003cp>\u003cb>Stator / rotor:\u003c/b> stationary / rotating machine parts.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Which pair of quantities did you previously treat as if they were the same?\u003c/p>\u003ctextarea data-note=\"28\" aria-label=\"Your explanation for lesson 29\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Common examples are flux versus flux density, power versus energy, voltage versus current, speed versus torque, and a phase difference versus a time delay.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"28\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p29\" data-scene=\"sources\" aria-label=\"Sources, models and how to use this workbook.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 30 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Review and references · 30\u003c/div>\u003ch2>Sources, models and how to use this workbook.\u003c/h2>\u003cp class=\"lead\">Original explanations and diagrams, checked against open textbooks and university notes.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Sources, models and how to use this workbook.\">\u003ctitle>Sources, models and how to use this workbook.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"55\" y=\"55\" width=\"490\" height=\"75\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"300\" y=\"88.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">OpenStax · University Physics\u003c/text>\u003ctext x=\"300\" y=\"111.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">power, induction, stored energy and transformers\u003c/text>\u003crect x=\"55\" y=\"155\" width=\"490\" height=\"75\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"300\" y=\"188.5\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">MIT · Electrical engineering\u003c/text>\u003ctext x=\"300\" y=\"211.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">magnetic circuits, machines and power flow\u003c/text>\u003ctext x=\"300\" y=\"285\" font-size=\"17\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Original diagrams · simplified, stated models\u003c/text>\u003ctext x=\"300\" y=\"321\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">No copied lecture figures or generated physics imagery.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Open references\u003c/b>\u003cspan>links in the text\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Offline lessons\u003c/b>\u003cspan>no external scripts or libraries\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003col class=\"sources\">\u003cli>\u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/9-5-electrical-energy-and-power\">OpenStax University Physics 2, §9.5: electrical energy and power\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://web.mit.edu/6.013_book/www/chapter9/9.7.html\">MIT Electromagnetic Fields and Energy, §9.7: magnetic circuits\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law\">OpenStax, §13.1: Faraday’s law\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/14-2-self-inductance-and-inductors\">OpenStax, §14.2: self-inductance\u003c/a>; \u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/14-3-energy-in-a-magnetic-field\">§14.3: stored field energy\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits\">OpenStax, §15.2: AC circuits\u003c/a>; \u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit\">§15.4: AC power\u003c/a>; \u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers\">§15.6: transformers\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://ocw.mit.edu/courses/6-685-electric-machines-fall-2013/pages/course-notes/\">MIT 6.685 Electric Machines: magnetic circuits, synchronous and induction machines\u003c/a>.\u003c/li>\n  \u003cli>\u003ca href=\"https://ocw.mit.edu/courses/6-061-introduction-to-electric-power-systems-spring-2011/9cf8de165233601f547b284cee5c2131_MIT6_061S11_ch2.pdf\">MIT 6.061, Chapter 2: AC power flow in linear networks\u003c/a>.\u003c/li>\u003c/ol>\n  \u003cp>These sources check the physics; the original audit answers set the teaching priorities. No claim is made that all of your lecture notes were available.\u003c/p>\n  \u003cp>\u003cb>Use:\u003c/b> open the HTML file in a browser for controls, animation, saved notes and exports. The PDF contains all lessons with labelled default-state diagrams and written answer space. Its controls do not operate.\u003c/p>\n  \u003cp>Work is saved locally when the browser permits it. Export your answers as a text file to keep a separate copy. Use \u003cb>Read aloud\u003c/b> to hear the lesson, pause it, or change the voice and speed. Only open explanations are narrated. Device voices can work offline; online voices may need a connection.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"29\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p30\" data-scene=\"assessment\" aria-label=\"Final assessment · about 20 minutes\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 31 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Final assessment · 31\u003c/div>\u003ch2>Final assessment · about 20 minutes\u003c/h2>\u003cp class=\"lead\">Use this after studying. The six areas and 30-mark weighting match your baseline.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Final assessment · about 20 minutes\">\u003ctitle>Final assessment · about 20 minutes\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ccircle cx=\"120\" cy=\"155\" r=\"76\" fill=\"#edf5f3\" stroke=\"#087f8c\" stroke-width=\"5\">\u003c/circle>\u003ctext x=\"120\" y=\"148\" font-size=\"43\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"700\">20\u003c/text>\u003ctext x=\"120\" y=\"181\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">minutes\u003c/text>\u003ctext x=\"265\" y=\"110\" font-size=\"27\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"700\">6 areas\u003c/text>\u003ctext x=\"265\" y=\"157\" font-size=\"27\" style=\"fill:#13263a\" text-anchor=\"start\" font-weight=\"700\">30 marks\u003c/text>\u003ctext x=\"265\" y=\"204\" font-size=\"16\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">Explain your reasoning.\u003c/text>\u003ctext x=\"300\" y=\"290\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"400\">Export → send back → compare with 10/30\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>No solution key\u003c/b>\u003cspan>for this final assessment\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Manual grading\u003c/b>\u003cspan>send written answers to the chat\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Use a calculator if needed, without notes. Give reasons, and label each part confident, partly sure or guessing. An unfamiliar mechanism is useful evidence: say so.\u003c/p>\n  \u003cp>This is a comparable diagnostic, not a formally standardised test. Some concepts necessarily recur. The transformer numbers and electrical changes differ from the baseline.\u003c/p>\n  \u003cp>Press \u003cb>Begin assessment\u003c/b> to hide the lesson navigation while answering. When finished, export your answers and paste them into our chat for grading. The document does not automatically grade written explanations.\u003c/p>\n  \u003cp>Use the same marking allocation shown in the baseline record. Compare both the numerical mark and the quality of the physical explanations.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"assessmentpanel\">\u003cdiv class=\"testbar\">\u003cbutton id=\"beginTest\" class=\"primary\">Begin assessment\u003c/button>\u003cspan id=\"timer\" class=\"timer\">20:00 suggested\u003c/span>\u003cbutton id=\"endTest\" hidden=\"\">Finish and export\u003c/button>\u003cbutton id=\"leaveTest\" hidden=\"\">Return to lessons\u003c/button>\u003c/div>\u003cdiv class=\"pdfonly\">Suggested time: 20 minutes. Marks: 30. Confidence for each part: confident / partly sure / guessing.\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>1. Electrical relationships · 5 marks\u003c/h3>\u003cp>a) The voltage across an unchanged resistor is halved. What happens to its current and heating power? Explain. (2 marks)\u003c/p>\u003cp>b) The transmission voltage is tripled while the same useful power is delivered through the same cables. What happens to cable current, cable resistance and cable heating? State what is fixed. (3 marks)\u003c/p>\u003ctextarea data-test=\"0\" aria-label=\"Final assessment answer 1\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"0\" aria-label=\"Confidence for part 1\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>2. Magnetic fields · 5 marks\u003c/h3>\u003cp>a) A current-controlled coil surrounds an iron ring with a small air gap. The gap is made wider while current stays unchanged. What happens to flux, and why? Explain what flux means. (3 marks)\u003c/p>\u003cp>b) Why does increasing current eventually stop producing a proportional increase in flux? (2 marks)\u003c/p>\u003ctextarea data-test=\"1\" aria-label=\"Final assessment answer 2\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"1\" aria-label=\"Confidence for part 2\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>3. Inductors and energy · 5 marks\u003c/h3>\u003cp>a) A constant voltage is suddenly applied across an ideal coil. Can current change instantly? Explain the mechanism. (2 marks)\u003c/p>\u003cp>b) Describe energy flow into and out of an ideal coil over one sinusoidal AC cycle. What is its average real power, and what changes in a real coil? (3 marks)\u003c/p>\u003ctextarea data-test=\"2\" aria-label=\"Final assessment answer 3\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"2\" aria-label=\"Confidence for part 3\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>4. Transformers · 5 marks\u003c/h3>\u003cp>a) An ideal transformer has 800 primary turns, 100 secondary turns and 240 V AC input. Find the secondary voltage. If the secondary supplies 4 A to a resistor, find the primary current and explain the energy accounting. (3 marks)\u003c/p>\u003cp>b) Would steady DC sustain normal secondary voltage in this transformer? Explain, including what differs from the switching transient. (2 marks)\u003c/p>\u003ctextarea data-test=\"3\" aria-label=\"Final assessment answer 4\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"3\" aria-label=\"Confidence for part 4\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>5. Machines · 5 marks\u003c/h3>\u003cp>a) Why must a generator be driven with more torque when electrical load increases at unchanged speed? Explain the current-field-torque chain. (3 marks)\u003c/p>\u003cp>b) Explain why a basic induction motor loses sustained torque at zero slip while a synchronous motor can produce torque at synchronous speed. (2 marks)\u003c/p>\u003ctextarea data-test=\"4\" aria-label=\"Final assessment answer 5\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"4\" aria-label=\"Confidence for part 5\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"testpart\">\u003ch3>6. Power network · 5 marks\u003c/h3>\u003cp>a) On an isolated generator network, electrical demand rises before turbine input responds. Where does the initial extra energy come from, what happens to frequency, and what change sustains the new load? (3 marks)\u003c/p>\u003cp>b) Two equal-magnitude AC voltages have different phases across an inductive line. Can real power flow? Explain why, and which end supplies it for a small phase difference. (2 marks)\u003c/p>\u003ctextarea data-test=\"5\" aria-label=\"Final assessment answer 6\" placeholder=\"a) ...\nb) ...\">\u003c/textarea>\u003clabel>Confidence: \u003cselect data-confidence=\"5\" aria-label=\"Confidence for part 6\">\u003coption value=\"\">Choose\u003c/option>\u003coption>Confident\u003c/option>\u003coption>Partly sure\u003c/option>\u003coption>Guessing\u003c/option>\u003coption>No idea yet\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"30\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003c/div>\u003cfooter class=\"navbottom\">\u003cbutton id=\"prev\">← Previous\u003c/button>\u003cspan class=\"position\" id=\"position\">\u003c/span>\u003cbutton id=\"next\" class=\"primary\">Next →\u003c/button>\u003c/footer>\u003c/main>\n\u003cnoscript>\u003cp style=\"margin:30px\">All lesson text and diagrams remain available without JavaScript. Read-aloud and interactive controls work when you open the downloaded file in a browser with JavaScript enabled.\u003c/p>\u003c/noscript>\n\u003cscript>const DATA = {\"pages\": [{\"stage\": 0, \"title\": \"See the mechanism. Then use the equation.\", \"lead\": \"A visual workbook built around your Electrical Energy Systems audit.\", \"scene\": \"map\", \"body\": \"\u003cp>Your goal is to explain how electromagnetic fields and AC behaviour govern energy storage, transfer and conversion in coils, transformers, machines and transmission lines.\u003c\\/p>\\n  \u003cp>Work through six stages. On each page: \u003cb>predict a change, move a control, explain the result\u003c\\/b>. The pictures and numbers describe the same mechanism.\u003c\\/p>\\n  \u003col>\u003cli>Current, voltage and energy\u003c\\/li>\u003cli>Magnetic fields and flux\u003c\\/li>\u003cli>Induction, stored energy and AC\u003c\\/li>\u003cli>Transformers\u003c\\/li>\u003cli>Motors and generators\u003c\\/li>\u003cli>The whole power system\u003c\\/li>\u003c\\/ol>\\n  \u003cp>Allow several short study sessions. The final assessment takes about 20 minutes. Use the chapter menu to revisit a gap.\u003c\\/p>\", \"eq\": \"\", \"controls\": [], \"question\": \"Before starting: what would you most like to be able to picture clearly?\", \"answer\": \"Keep this as a personal target. Revisit it after the final assessment.\", \"analogy\": \"Minecraft comparisons are memory aids. Each one has a stated limit so it does not replace the physics.\"}, {\"stage\": 0, \"title\": \"Your starting point: 10 / 30\", \"lead\": \"Correct numerical results are useful; the next step is explaining their physical cause.\", \"scene\": \"score\", \"body\": \"\u003ctable>\u003ctr>\u003cth>Area\u003c\\/th>\u003cth>Mark\u003c\\/th>\u003cth>Evidence\u003c\\/th>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Electrical relationships\u003c\\/td>\u003ctd>3/5\u003c\\/td>\u003ctd>Correct fixed-resistor result; fixed-power assumptions mixed up.\u003c\\/td>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Magnetic fields\u003c\\/td>\u003ctd>1/5\u003c\\/td>\u003ctd>Flux unfamiliar; recognised eventual flattening without a cause.\u003c\\/td>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Inductors and energy\u003c\\/td>\u003ctd>0/5\u003c\\/td>\u003ctd>Both mechanisms unknown.\u003c\\/td>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Transformers\u003c\\/td>\u003ctd>3/5\u003c\\/td>\u003ctd>23 V and turns ratio correct; input current unknown.\u003c\\/td>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Machines\u003c\\/td>\u003ctd>1/5\u003c\\/td>\u003ctd>Recognised a connection between current, field and force.\u003c\\/td>\u003c\\/tr>\\n  \u003ctr>\u003ctd>Power network\u003c\\/td>\u003ctd>2/5\u003c\\/td>\u003ctd>Stored rotation identified; phase-flow answer was a guess.\u003c\\/td>\u003c\\/tr>\u003c\\/table>\\n  \u003cp>Your DC answer said both “no” and “the coil only works in DC”. Those conflict. You receive the decision mark, with no mechanism mark; this does not establish which wording you intended.\u003c\\/p>\\n  \u003cp>This is a diagnostic of the sampled concepts, not a university module grade. Previous prompted answers are not being treated as independent mastery.\u003c\\/p>\", \"eq\": \"\", \"controls\": [], \"question\": \"Which result came from reasoning, and which came from remembering an equation?\", \"answer\": \"Track that distinction as you study. A confident prediction plus a correct mechanism is stronger evidence than a remembered result alone.\", \"analogy\": \"\"}, {\"stage\": 1, \"title\": \"Charge moves around. Energy changes form.\", \"lead\": \"A heater does not use up the charge that passes through it.\", \"scene\": \"circuit\", \"body\": \"\u003cp>\u003cb>Current\u003c\\/b> is charge passing a point each second. In a steady circuit, the same current enters and leaves the heater: charge is not steadily piling up inside it.\u003c\\/p>\\n  \u003cp>\u003cb>Voltage\u003c\\/b> describes energy transferred per unit charge between two points. A heater transfers electrical energy into thermal energy. The charges continue around the circuit.\u003c\\/p>\\n  \u003cp>\u003cb>Energy\u003c\\/b> is an amount, measured in joules. \u003cb>Power\u003c\\/b> is the rate of energy transfer, measured in watts: one watt means one joule per second.\u003c\\/p>\\n  \u003cp>The moving dots show \u003cb>conventional current\u003c\\/b>. Electron drift in a metal is opposite to that direction. The diagram is a circuit model, not a picture of the detailed electromagnetic energy flow around a wire.\u003c\\/p>\", \"eq\": \"I = charge / time &nbsp;&nbsp; V = energy / charge &nbsp;&nbsp; P = VI &nbsp;&nbsp; E = Pt\", \"controls\": [], \"question\": \"A 100 W heater runs for 10 seconds. How much energy is transferred? Does the return current become smaller?\", \"answer\": \"1,000 J. The steady return current is equal to the outgoing current. Energy changes form; charge is conserved.\", \"analogy\": \"Think of a loop of minecarts carrying deliveries. The carts circulate while cargo is delivered. Limit: real electrons are not little fuel containers, and electrical energy transfer is described by fields.\"}, {\"stage\": 1, \"title\": \"Ask what stays fixed first.\", \"lead\": \"The same voltage change can produce opposite current trends in different arrangements.\", \"scene\": \"fixed\", \"body\": \"\u003cp>\u003cb>Left: fixed resistance.\u003c\\/b> Increase the voltage across the same resistor. The larger electrical push produces more current. With both voltage and current larger, heating rises rapidly.\u003c\\/p>\\n  \u003cp>\u003cb>Right: fixed useful power.\u003c\\/b> A supply arrangement delivers the same 100 W at a different load voltage. At a higher voltage, fewer coulombs per second are needed to deliver that power.\u003c\\/p>\\n  \u003cp>Your 1b answer made cable resistance increase. \u003cb>The same cables retain the same resistance in this model.\u003c\\/b> Also, voltage is the quantity being changed; it cannot simultaneously be held constant.\u003c\\/p>\\n  \u003cp>A load's effective input resistance can change with a transformer or controlled supply. That is separate from the cable resistance. Never combine quantities from different parts of the circuit without saying where they apply.\u003c\\/p>\", \"eq\": \"Fixed R: I = V/R, P = V²/R &nbsp;&nbsp; Fixed P: I = P/V\", \"controls\": [{\"key\": \"v\", \"label\": \"Voltage\", \"value\": 10, \"min\": 5, \"max\": 30, \"step\": 1, \"unit\": \"V\"}], \"question\": \"Before moving the slider: if V doubles, predict I and P in the left model, and I in the right model.\", \"answer\": \"Fixed R: current doubles and power quadruples. Fixed P: current halves. The right model changes its effective load resistance as needed; it is not the same unchanged resistor.\", \"analogy\": \"\"}, {\"stage\": 1, \"title\": \"Why a high transmission voltage helps.\", \"lead\": \"Deliver the same useful power using less cable current.\", \"scene\": \"transmission\", \"body\": \"\u003cp>This example delivers \u003cb>100 kW at the load terminals\u003c\\/b>, at unity power factor. The outgoing and returning cables together have 2 Ω resistance.\u003c\\/p>\\n  \u003cp>At 10 kV, current is 10 A and cable heating is 200 W. At 20 kV, current is 5 A and cable heating is 50 W. Halving current quarters its square.\u003c\\/p>\\n  \u003cp>There are two different voltages: the \u003cb>load voltage\u003c\\/b> used in P = VI, and the smaller \u003cb>cable voltage drop\u003c\\/b> used in V\u003csub>drop\u003c\\/sub> = IR\u003csub>cable\u003c\\/sub>. The source must provide the load voltage plus the cable drop in this resistive equivalent.\u003c\\/p>\\n  \u003cp>For general single-phase AC, useful power is VI cos φ. Here cos φ = 1. A three-phase calculation uses the appropriate phase or line quantities.\u003c\\/p>\", \"eq\": \"I = P\u003csub>load\u003c\\/sub>/V\u003csub>load\u003c\\/sub> &nbsp;&nbsp; P\u003csub>loss\u003c\\/sub> = I²R\u003csub>cable\u003c\\/sub>\", \"controls\": [{\"key\": \"v\", \"label\": \"Load voltage\", \"value\": 10, \"min\": 5, \"max\": 25, \"step\": 1, \"unit\": \"kV\"}], \"question\": \"If cable resistance stays fixed, why can cable heating change?\", \"answer\": \"Heating also depends on current squared. A fixed resistance does not imply fixed power dissipation.\", \"analogy\": \"\"}, {\"stage\": 2, \"title\": \"A current creates a magnetic field.\", \"lead\": \"A field describes magnetic influence throughout space.\", \"scene\": \"coil\", \"body\": \"\u003cp>A current-carrying wire produces a magnetic field around it. Wrap the wire into a coil and the contributions from its turns reinforce one another through the middle.\u003c\\/p>\\n  \u003cp>\u003cb>Flux density B\u003c\\/b> describes the local magnetic field strength and direction, in teslas. A compass or another magnetic object responds to the field at its location.\u003c\\/p>\\n  \u003cp>More turns and more current usually produce a stronger field, provided the geometry stays fixed and the core has not entered saturation. Reversing current reverses the field direction.\u003c\\/p>\\n  \u003cp>An iron core responds to the applied field through magnetisation. It can guide a much larger flux than air for the same ampere-turns. This is not electrical current flowing around the iron ring.\u003c\\/p>\", \"eq\": \"Magnetising drive = NI &nbsp; (ampere-turns)\", \"controls\": [{\"key\": \"i\", \"label\": \"Coil current\", \"value\": 2, \"min\": -4, \"max\": 4, \"step\": 0.5, \"unit\": \"A\"}, {\"key\": \"n\", \"label\": \"Turns\", \"value\": 100, \"min\": 50, \"max\": 200, \"step\": 25, \"unit\": \"\"}], \"question\": \"If current reverses but its magnitude stays the same, what happens to the field?\", \"answer\": \"Its direction reverses. In a linear model the field magnitude is unchanged. Real ferromagnets can retain magnetisation; hysteresis is omitted here.\", \"analogy\": \"\"}, {\"stage\": 2, \"title\": \"Flux: how much field passes through an area.\", \"lead\": \"Flux is not a substance travelling inside the core.\", \"scene\": \"flux\", \"body\": \"\u003cp>\u003cb>Magnetic flux Φ\u003c\\/b> measures the magnetic field passing through a chosen surface. It depends on field strength, surface area and orientation.\u003c\\/p>\\n  \u003cp>A larger surface intercepts more of a uniform perpendicular field. Turn the surface edge-on to the field and less passes through it.\u003c\\/p>\\n  \u003cp>The angle θ is measured between the field and the \u003cb>surface normal\u003c\\/b>: an imaginary arrow sticking straight out of the surface. It is not measured from the flat surface itself.\u003c\\/p>\\n  \u003cp>The arrow lines are a drawing convention. They help show direction and relative density; there are no literal magnetic strings. Flux is measured in webers (Wb), while B is measured in teslas (T).\u003c\\/p>\", \"eq\": \"Uniform field: Φ = BA cos θ &nbsp;&nbsp; General form: Φ = ∫ B · dA\", \"controls\": [{\"key\": \"b\", \"label\": \"Field strength B\", \"value\": 0.5, \"min\": 0.1, \"max\": 1, \"step\": 0.1, \"unit\": \"T\"}, {\"key\": \"a\", \"label\": \"Surface area\", \"value\": 0.02, \"min\": 0.01, \"max\": 0.05, \"step\": 0.01, \"unit\": \"m²\"}, {\"key\": \"angle\", \"label\": \"Normal-to-field angle\", \"value\": 0, \"min\": 0, \"max\": 90, \"step\": 5, \"unit\": \"°\"}], \"question\": \"Could a strong field produce zero flux through one particular surface?\", \"answer\": \"Yes. If the field is parallel to that surface, it has no component through it, so the flux through that surface is zero.\", \"analogy\": \"Imagine rain passing through a Minecraft frame. More rain, a larger opening or a different tilt changes how much passes through. Limit: magnetic field lines form closed loops; flux is not a flow of water.\"}, {\"stage\": 2, \"title\": \"An air gap makes the magnetic path harder.\", \"lead\": \"At fixed coil current, adding a gap reduces the flux.\", \"scene\": \"gap\", \"body\": \"\u003cp>\u003cb>Permeability μ\u003c\\/b> describes how a material responds magnetically. Iron has much higher permeability than air over its useful operating range.\u003c\\/p>\\n  \u003cp>\u003cb>Reluctance ℜ\u003c\\/b> describes how difficult a magnetic path is to establish flux through. A longer path or lower permeability increases reluctance; a wider cross-section reduces it.\u003c\\/p>\\n  \u003cp>The coil supplies magnetising drive NI. With the same drive, a larger total reluctance produces less flux. Even a short air gap can dominate the total reluctance because air has low permeability.\u003c\\/p>\\n  \u003cp>This is a linear, constant-current model. It neglects leakage, fringing and saturation. If voltage rather than current is constrained, you must reconsider the assumptions.\u003c\\/p>\", \"eq\": \"Φ ≈ NI / ℜ\u003csub>total\u003c\\/sub> &nbsp;&nbsp; ℜ = length / (μ × area)\", \"controls\": [{\"key\": \"gap\", \"label\": \"Air gap\", \"value\": 0, \"min\": 0, \"max\": 2, \"step\": 0.1, \"unit\": \"mm\"}, {\"key\": \"i\", \"label\": \"Current\", \"value\": 1, \"min\": 0.2, \"max\": 2, \"step\": 0.2, \"unit\": \"A\"}], \"question\": \"Why does “an empty gap leaves more space for field” give the wrong prediction here?\", \"answer\": \"Flux depends on the magnetic response of the path, not on available empty space. Replacing high-permeability iron with air increases reluctance and lowers flux at fixed NI.\", \"analogy\": \"\"}, {\"stage\": 2, \"title\": \"Saturation: iron loses its extra advantage.\", \"lead\": \"Increasing current eventually gives a smaller extra increase in B.\", \"scene\": \"saturation\", \"body\": \"\u003cp>Inside a ferromagnet, magnetic regions called \u003cb>domains\u003c\\/b> can change their orientation and extent. This creates a large magnetisation in response to an applied field.\u003c\\/p>\\n  \u003cp>When most of the available magnetisation is aligned, further increases in magnetising drive cannot produce the same extra contribution. The B-versus-current curve bends: its slope falls.\u003c\\/p>\\n  \u003cp>Your answer recognised flattening. The missing part was the mechanism. It does not necessarily plateau “very fast”: the knee depends on material, geometry, turns and current.\u003c\\/p>\\n  \u003cp>B does not become mathematically capped. Even beyond saturation it still rises with applied field, but with a much smaller incremental slope. This graph is illustrative, not a measured material curve.\u003c\\/p>\", \"eq\": \"Before saturation: roughly proportional &nbsp;&nbsp; Near saturation: reduced incremental permeability\", \"controls\": [{\"key\": \"i\", \"label\": \"Magnetising drive\", \"value\": 1, \"min\": 0, \"max\": 5, \"step\": 0.1, \"unit\": \"relative\"}], \"question\": \"Why can a saturated coil draw much more current without obtaining a proportionally larger flux?\", \"answer\": \"The core no longer adds much extra magnetisation. Its incremental permeability and inductance fall, so the former linear relationship no longer applies.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"Changing flux induces a voltage.\", \"lead\": \"A field can exist without inducing a voltage. Change is the key.\", \"scene\": \"faraday\", \"body\": \"\u003cp>\u003cb>Faraday’s law:\u003c\\/b> changing the flux linked by a winding induces an electromotive force, measured in volts. A greater rate of change or more linked turns produces a larger induced voltage.\u003c\\/p>\\n  \u003cp>A stationary coil in a steady field has no changing flux and therefore no induced emf. Move a magnet, change a nearby current or rotate the coil, and the linked flux can change.\u003c\\/p>\\n  \u003cp>\u003cb>Lenz’s law:\u003c\\/b> the induced effect opposes the change that caused it. If a closed conducting loop allows current to flow, that current creates a field opposing the flux change.\u003c\\/p>\\n  \u003cp>Voltage and current are separate: an open secondary can have an induced voltage while carrying no load current. The minus sign describes direction, rather than a reduction in the amount of voltage.\u003c\\/p>\", \"eq\": \"e = −N dΦ/dt &nbsp;&nbsp; (linked flux per turn, with a consistent winding direction)\", \"controls\": [{\"key\": \"speed\", \"label\": \"Rate of variation\", \"value\": 1, \"min\": 0, \"max\": 3, \"step\": 0.25, \"unit\": \"relative\"}], \"question\": \"At the maximum of a sinusoidal flux, is the induced voltage largest or zero?\", \"answer\": \"Zero at that instant: the flux curve has zero slope at its maximum. The largest induced voltage occurs at the steepest flux changes.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"An inductor opposes changes in its own current.\", \"lead\": \"Changing current creates changing flux, which induces an opposing emf.\", \"scene\": \"rl\", \"body\": \"\u003cp>A coil’s own current establishes flux through its turns. If that current changes, the linked flux changes too. The coil therefore induces an emf in its own winding: \u003cb>self-induction\u003c\\/b>.\u003c\\/p>\\n  \u003cp>For a linear ideal inductor, the terminal voltage under the passive sign convention is v = L di/dt. A finite voltage gives a finite current slope. An instantaneous current jump would require an impulse of voltage.\u003c\\/p>\\n  \u003cp>With zero resistance and constant voltage, current ramps upward. Add series resistance and the resistor takes an increasing share of the supply voltage, so the current approaches V/R.\u003c\\/p>\\n  \u003cp>The graph uses a 2 V DC supply. Increasing L slows the initial rise. This mechanism is not electrons simply taking time to accelerate.\u003c\\/p>\", \"eq\": \"v\u003csub>L\u003c\\/sub> = L di/dt &nbsp;&nbsp; V = L di/dt + Ri &nbsp;&nbsp; τ = L/R (R &gt; 0)\", \"controls\": [{\"key\": \"l\", \"label\": \"Inductance\", \"value\": 1, \"min\": 0.2, \"max\": 2, \"step\": 0.1, \"unit\": \"H\"}, {\"key\": \"r\", \"label\": \"Series resistance\", \"value\": 1, \"min\": 0, \"max\": 4, \"step\": 0.25, \"unit\": \"Ω\"}], \"question\": \"For an ideal 1 H coil with 2 V applied, how fast does current rise? What is the ideal coil voltage when current is steady?\", \"answer\": \"The rise is 2 A per second. When current is steady, di/dt = 0 and the ideal inductive voltage is zero. A real coil still needs a resistive drop to maintain steady current.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"A magnetic field can store energy.\", \"lead\": \"A coil can return energy it received earlier.\", \"scene\": \"decay\", \"body\": \"\u003cp>As a coil’s current rises, the supply does work establishing its magnetic field. In a linear inductor, stored energy is ½LI².\u003c\\/p>\\n  \u003cp>Start with a 1 H inductor carrying 3 A. It stores 4.5 J. In a closed ideal loop with no resistance or source, that current persists with zero terminal voltage: nothing dissipates the stored energy.\u003c\\/p>\\n  \u003cp>Put resistance into the closed loop and current decays. The field shrinks while electrical energy is transferred into heat. The inductor’s voltage polarity supports the existing current while it is falling.\u003c\\/p>\\n  \u003cp>Simply opening an energised real coil is different from providing a closed decay path: its voltage may rise sharply. This model assumes the closed loop remains intact.\u003c\\/p>\", \"eq\": \"E = ½LI² &nbsp;&nbsp; i(t) = I₀ exp(−Rt/L) &nbsp;&nbsp; P\u003csub>heat\u003c\\/sub> = i²R\", \"controls\": [{\"key\": \"r\", \"label\": \"Loop resistance\", \"value\": 1, \"min\": 0, \"max\": 3, \"step\": 0.25, \"unit\": \"Ω\"}, {\"key\": \"time\", \"label\": \"Time after supply removal\", \"value\": 1, \"min\": 0, \"max\": 5, \"step\": 0.1, \"unit\": \"s\"}], \"question\": \"If current halves, what fraction of the original field energy remains?\", \"answer\": \"One quarter. Stored energy depends on current squared. In a resistance-free ideal loop neither current nor stored energy decays.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"AC timing and RMS are different ideas.\", \"lead\": \"Phase describes timing. RMS describes equivalent resistive heating.\", \"scene\": \"rms\", \"body\": \"\u003cp>A sinusoidal current changes continuously. Its peak is its largest magnitude. Its RMS value is the steady DC current that would give the same average heating in the same resistor.\u003c\\/p>\\n  \u003cp>Because heating depends on i², reversing current does not undo heating. Both halves of an AC cycle heat a resistor.\u003c\\/p>\\n  \u003cp>For a sine wave, I\u003csub>rms\u003c\\/sub> = I\u003csub>peak\u003c\\/sub>/√2. A 10 A peak sine wave therefore heats a resistor like 7.07 A DC, not 10 A DC.\u003c\\/p>\\n  \u003cp>\u003cb>Phase angle\u003c\\/b> represents timing relative to another wave of the same frequency. A 90° lead means a quarter-cycle earlier; 180° means half a cycle.\u003c\\/p>\", \"eq\": \"I\u003csub>rms\u003c\\/sub> = √(average of i²) &nbsp;&nbsp; P\u003csub>R\u003c\\/sub> = I\u003csub>rms\u003c\\/sub>²R\", \"controls\": [{\"key\": \"peak\", \"label\": \"Peak current\", \"value\": 10, \"min\": 2, \"max\": 15, \"step\": 1, \"unit\": \"A\"}], \"question\": \"Would 10 A peak AC and 10 A DC heat a 2 Ω resistor equally?\", \"answer\": \"No. The sinusoid gives 100 W average; the DC gives 200 W. The AC is below its peak magnitude for most of the cycle.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"Phasors keep timing when you add waves.\", \"lead\": \"Add values at the same instant, or add the corresponding arrows.\", \"scene\": \"phasor\", \"body\": \"\u003cp>A phasor is an arrow representing a sinusoid’s magnitude and phase at one fixed frequency. The angle between arrows carries the relative timing information.\u003c\\/p>\\n  \u003cp>For 6 A and 8 A RMS currents entering a junction, equal phase gives 14 A RMS. A 180° difference gives 2 A RMS. At 90°, perpendicular components give 10 A RMS.\u003c\\/p>\\n  \u003cp>We add the \u003cb>signed instantaneous currents\u003c\\/b>; we do not average their separate peaks. The phasor sum is a shortcut to the resulting sinusoid.\u003c\\/p>\\n  \u003cp>Your earlier 7.07 A misunderstanding was affected by wording. It is not being counted as evidence that you cannot add ordinary currents. Here each arrow and each waveform is labelled separately.\u003c\\/p>\", \"eq\": \"|I\u003csub>sum\u003c\\/sub>| = √(I₁² + I₂² + 2I₁I₂ cos φ)\", \"controls\": [{\"key\": \"angle\", \"label\": \"B leads A by\", \"value\": 90, \"min\": 0, \"max\": 180, \"step\": 5, \"unit\": \"°\"}], \"question\": \"At 90°, why is the total magnitude 10 A rather than 14 A?\", \"answer\": \"The currents do not reach their peaks together. Their phasors are perpendicular, so the resultant magnitude is √(6² + 8²) = 10 A.\", \"analogy\": \"\"}, {\"stage\": 3, \"title\": \"Power can go into a coil and come back.\", \"lead\": \"Zero average real power does not mean zero current.\", \"scene\": \"acpower\", \"body\": \"\u003cp>In a resistor, voltage and current have the same sign at each instant. Their product p = vi is nonnegative: electrical energy continually becomes heat.\u003c\\/p>\\n  \u003cp>In an ideal inductor under sinusoidal steady-state AC, current lags voltage by 90°. During part of the cycle the field receives energy; during another part it returns energy to the source. Its net change over a full cycle is zero.\u003c\\/p>\\n  \u003cp>\u003cb>Real power P\u003c\\/b> is average energy transfer per second. \u003cb>Reactive power Q\u003c\\/b> characterises the quadrature exchange associated with energy storage. Q is measured in var, not joules, and is not an extra amount of heat.\u003c\\/p>\\n  \u003cp>A real coil has winding resistance and often core losses. It therefore takes positive average real power as well as exchanging stored energy. Reactive current can also cause heating in the supply cables.\u003c\\/p>\", \"eq\": \"P = VI cos φ (W) &nbsp;&nbsp; Q = VI sin φ (var) &nbsp;&nbsp; S = VI (VA)\", \"controls\": [{\"key\": \"angle\", \"label\": \"Current lag\", \"value\": 90, \"min\": 0, \"max\": 90, \"step\": 5, \"unit\": \"°\"}], \"question\": \"At a 90° lag, why do the positive and negative power areas matter?\", \"answer\": \"They are equal over one cycle, so net energy transfer and average real power are zero. Current and instantaneous power are still nonzero.\", \"analogy\": \"\"}, {\"stage\": 4, \"title\": \"A transformer links two circuits through flux.\", \"lead\": \"The windings share changing flux, not a flow of charge between them.\", \"scene\": \"transformer\", \"body\": \"\u003cp>Applied primary AC voltage establishes a changing linked flux. That flux induces an emf in every linked turn of both windings.\u003c\\/p>\\n  \u003cp>If the secondary is open, an induced voltage is present but no load current flows. Connect a load and that voltage drives current through the secondary circuit.\u003c\\/p>\\n  \u003cp>Secondary current creates a magnetising effect opposing the original flux change. The primary draws an additional load-related current whose ampere-turns balance that effect. With fixed primary voltage and frequency, the main core flux remains approximately set by the applied voltage.\u003c\\/p>\\n  \u003cp>A real unloaded transformer still draws a small magnetising current and supplies core losses. The ideal loaded calculations omit those contributions.\u003c\\/p>\", \"eq\": \"v per turn ∝ dΦ/dt &nbsp;&nbsp; V₂/V₁ = N₂/N₁\", \"controls\": [{\"key\": \"load\", \"label\": \"Secondary load connected\", \"value\": 1, \"min\": 0, \"max\": 1, \"step\": 1, \"unit\": \"0 / 1\"}], \"question\": \"If no secondary current flows, must the secondary voltage be zero?\", \"answer\": \"No. An open secondary can have an induced voltage. Current requires a closed circuit; induced voltage requires changing linked flux.\", \"analogy\": \"\"}, {\"stage\": 4, \"title\": \"Lower voltage allows higher current at equal power.\", \"lead\": \"Your 23 V result was correct. Now connect it to the missing current.\", \"scene\": \"ratio\", \"body\": \"\u003cp>For the original 500:50 turns ratio and 230 V primary, the ideal secondary voltage is 23 V.\u003c\\/p>\\n  \u003cp>If that secondary supplies 5 A to a resistive load, it delivers 23 × 5 = 115 W. The ideal primary must draw 115/230 = \u003cb>0.5 A\u003c\\/b>. Voltage is ten times smaller on the secondary, while current is ten times larger.\u003c\\/p>\\n  \u003cp>The controls vary secondary turns and load resistance. Notice that current is determined by the actual connected load. A transformer does not force its rated maximum current into every load.\u003c\\/p>\\n  \u003cp>The effective load resistance seen at the primary changes with the turns ratio squared. This explains how a supply can deliver the same useful power at different currents without changing the physical transmission cable resistance.\u003c\\/p>\", \"eq\": \"V₁I₁ = V₂I₂ &nbsp;&nbsp; I₁/I₂ = N₂/N₁ &nbsp;&nbsp; R\u003csub>in\u003c\\/sub> = (N₁/N₂)²R\u003csub>load\u003c\\/sub>\", \"controls\": [{\"key\": \"n\", \"label\": \"Secondary turns\", \"value\": 50, \"min\": 25, \"max\": 250, \"step\": 25, \"unit\": \"\"}, {\"key\": \"r\", \"label\": \"Secondary load resistance\", \"value\": 4.6, \"min\": 2.3, \"max\": 23, \"step\": 2.3, \"unit\": \"Ω\"}], \"question\": \"Keeping the turns ratio fixed, why does lowering secondary load resistance increase primary current?\", \"answer\": \"The same secondary voltage drives more secondary current and power. The primary supplies that added power through increased load-related current.\", \"analogy\": \"\"}, {\"stage\": 4, \"title\": \"Why normal transformers need changing flux.\", \"lead\": \"A coil can carry DC; a transformer cannot sustain normal energy transfer from steady DC.\", \"scene\": \"dctransformer\", \"body\": \"\u003cp>Connecting DC produces a switching transient. While the current and flux are changing, a secondary voltage can appear.\u003c\\/p>\\n  \u003cp>With steady DC applied to a real winding, the flux can be driven towards saturation. Inductive opposition then falls; winding resistance limits a potentially excessive current. Once flux is steady, no sustained secondary emf is produced.\u003c\\/p>\\n  \u003cp>So “coils only work in DC” is not a useful rule. Coils are used with both AC and DC. What matters here is whether the linked flux continues changing, and whether the core remains in its intended operating range.\u003c\\/p>\\n  \u003cp>Real transformer losses include \u003cb>copper heating\u003c\\/b> in windings, \u003cb>eddy-current heating\u003c\\/b> in the core and \u003cb>hysteresis loss\u003c\\/b> from repeated magnetisation. Laminations reduce eddy currents; suitable core materials reduce magnetic losses.\u003c\\/p>\", \"eq\": \"P\u003csub>in\u003c\\/sub> = P\u003csub>load\u003c\\/sub> + P\u003csub>copper\u003c\\/sub> + P\u003csub>core\u003c\\/sub> + other losses\", \"controls\": [], \"question\": \"Explain why a DC electromagnet can work while an ordinary transformer needs changing flux.\", \"answer\": \"A DC electromagnet needs a sustained magnetic field. A transformer needs a sustained rate of change of linked flux to induce its secondary voltage. These are different requirements.\", \"analogy\": \"\"}, {\"stage\": 5, \"title\": \"Current and field can produce force.\", \"lead\": \"A motor and a generator exchange electrical and mechanical energy.\", \"scene\": \"force\", \"body\": \"\u003cp>A current-carrying conductor in a magnetic field experiences a force. With suitable geometry, forces on conductors combine into a turning effect: \u003cb>torque\u003c\\/b>.\u003c\\/p>\\n  \u003cp>In motor operation, electrical input produces mechanical output. In generator operation, mechanical input produces electrical output. The same basic field interactions are involved.\u003c\\/p>\\n  \u003cp>When a generator is open-circuit, its load current is nearly zero. Connect a load: induced voltage drives current, which creates its own magnetic field. Its interaction with the machine field produces an electromagnetic torque opposing the driving motion.\u003c\\/p>\\n  \u003cp>The turbine must supply more torque to hold speed. The original rotor field does not have to become stronger. “All the quantities rise together” is not a general law: geometry, direction and what is held fixed matter.\u003c\\/p>\", \"eq\": \"|F| = BIl sin θ &nbsp;&nbsp; torque = turning effect of force\", \"controls\": [{\"key\": \"i\", \"label\": \"Conductor current\", \"value\": 2, \"min\": -4, \"max\": 4, \"step\": 0.5, \"unit\": \"A\"}], \"question\": \"If conductor current reverses while the magnetic field stays fixed, what happens to force?\", \"answer\": \"The force direction reverses. Its magnitude stays the same for the same current magnitude, field and geometry. The diagram uses B to the right and positive current out of the page.\", \"analogy\": \"\"}, {\"stage\": 5, \"title\": \"Speed is not power.\", \"lead\": \"At the same speed, more turning force means more mechanical power.\", \"scene\": \"torque\", \"body\": \"\u003cp>\u003cb>Angular speed ω\u003c\\/b> tells you how quickly the shaft rotates. \u003cb>Torque T\u003c\\/b> tells you how strongly it is being driven or resisted.\u003c\\/p>\\n  \u003cp>A generator can provide more output power at the same rotational speed if its turbine supplies more torque. This is how increased demand can be supported while retaining normal grid frequency.\u003c\\/p>\\n  \u003cp>At 100 rad/s, supplying 10 kW requires 100 N·m in a lossless model. Supplying 20 kW at that same speed requires 200 N·m.\u003c\\/p>\\n  \u003cp>Changing speed requires a net torque imbalance. Maintaining constant speed requires driving and opposing torques to balance. Real machines need extra input to cover losses.\u003c\\/p>\", \"eq\": \"P\u003csub>mechanical\u003c\\/sub> = Tω &nbsp;&nbsp; T\u003csub>drive\u003c\\/sub> − T\u003csub>opposing\u003c\\/sub> = J dω/dt\", \"controls\": [{\"key\": \"p\", \"label\": \"Mechanical power\", \"value\": 10, \"min\": 5, \"max\": 30, \"step\": 1, \"unit\": \"kW\"}, {\"key\": \"w\", \"label\": \"Shaft speed\", \"value\": 100, \"min\": 50, \"max\": 200, \"step\": 10, \"unit\": \"rad/s\"}], \"question\": \"A shaft doubles its delivered power without changing speed. What changes?\", \"answer\": \"Its transmitted torque doubles in the lossless model. Speed alone does not specify power.\", \"analogy\": \"Pedal harder to climb while keeping the same pedalling rate. Limit: a generator’s opposing torque is electromagnetic, rather than a bicycle’s road load.\"}, {\"stage\": 5, \"title\": \"Three phases can create a rotating field.\", \"lead\": \"Stationary windings can produce a field whose direction turns.\", \"scene\": \"rotating\", \"body\": \"\u003cp>Three stator winding groups are arranged at different positions. Their AC currents are separated by 120° in time. The changing contributions add to a rotating magnetic field.\u003c\\/p>\\n  \u003cp>The \u003cb>stator\u003c\\/b> is the stationary part. The \u003cb>rotor\u003c\\/b> is the moving part inside it. Their fields interact across an air gap.\u003c\\/p>\\n  \u003cp>The rotating field speed depends on electrical frequency and the number of poles. At 50 Hz, a four-pole machine has a synchronous speed of 1500 rpm. A two-pole machine has 3000 rpm.\u003c\\/p>\\n  \u003cp>The animation shows an equivalent two-pole field direction at greatly slowed speed. It is a field-vector illustration, not a detailed winding construction.\u003c\\/p>\", \"eq\": \"n\u003csub>s\u003c\\/sub> = 120f / number of poles &nbsp; (rpm)\", \"controls\": [{\"key\": \"poles\", \"label\": \"Number of poles\", \"value\": 4, \"min\": 2, \"max\": 8, \"step\": 2, \"unit\": \"\"}], \"question\": \"At the same supply frequency, why does adding more poles reduce synchronous mechanical speed?\", \"answer\": \"More electrical cycles correspond to one mechanical revolution. The rotor therefore turns through fewer revolutions each second for the same electrical frequency.\", \"analogy\": \"\"}, {\"stage\": 5, \"title\": \"Induction motors need relative motion.\", \"lead\": \"Slip is a speed difference, not a delay between two events.\", \"scene\": \"slip\", \"body\": \"\u003cp>The rotating stator field sweeps past rotor conductors. This changing linkage induces rotor voltage. A closed conducting rotor path allows current; current and field then produce torque.\u003c\\/p>\\n  \u003cp>If the rotor catches up exactly, the ideal fundamental field stops changing relative to it. Rotor induced voltage and current disappear in steady state, so sustained induction torque becomes zero.\u003c\\/p>\\n  \u003cp>At 50 Hz with four poles, the field runs at 1500 rpm. A rotor at 1470 rpm has 30 rpm relative speed and 2% slip. Rotor electrical frequency is sf = 1 Hz.\u003c\\/p>\\n  \u003cp>More load normally means slightly greater slip on the stable motoring branch. Torque does not rise indefinitely with slip. The plotted curve is illustrative, not a prediction for a specified motor; losses and spatial harmonics are omitted.\u003c\\/p>\", \"eq\": \"s = (n\u003csub>s\u003c\\/sub> − n\u003csub>r\u003c\\/sub>)/n\u003csub>s\u003c\\/sub> &nbsp;&nbsp; f\u003csub>rotor\u003c\\/sub> = sf\", \"controls\": [{\"key\": \"rpm\", \"label\": \"Rotor speed\", \"value\": 1470, \"min\": 0, \"max\": 1500, \"step\": 10, \"unit\": \"rpm\"}], \"question\": \"Explain the full chain from zero slip to zero sustained induction torque.\", \"answer\": \"Zero relative speed → no changing fundamental flux linkage in the rotor → no induced rotor emf → no steady induced rotor current → no induction torque.\", \"analogy\": \"\"}, {\"stage\": 5, \"title\": \"A synchronous rotor has its own field.\", \"lead\": \"It can maintain torque without inducing its rotor field through slip.\", \"scene\": \"synchronous\", \"body\": \"\u003cp>A synchronous machine establishes rotor magnetisation independently, usually using permanent magnets or DC excitation. It does not need a speed difference to keep inducing that rotor field.\u003c\\/p>\\n  \u003cp>During stable motor operation, the rotor field turns at the same speed as the stator field but with an \u003cb>angular offset\u003c\\/b>. Their tendency to align creates torque.\u003c\\/p>\\n  \u003cp>A moderate load increase briefly changes motion and increases the offset. Once settled, the rotor again runs at synchronous speed with a larger angle and torque. It does not maintain a continuing speed difference.\u003c\\/p>\\n  \u003cp>The simple sinusoidal torque-angle curve applies to an idealised round-rotor or equivalent two-pole model at fixed field magnitudes. A real motor has limits; excessive load can cause loss of synchronism.\u003c\\/p>\", \"eq\": \"Simple model: T = T\u003csub>max\u003c\\/sub> sin δ &nbsp;&nbsp; same steady speed, different field angle\", \"controls\": [{\"key\": \"angle\", \"label\": \"Rotor field lag\", \"value\": 25, \"min\": 0, \"max\": 85, \"step\": 5, \"unit\": \"electrical °\"}], \"question\": \"What does this motor have that the basic induction rotor does not have at zero slip?\", \"answer\": \"An independently established rotor field. Its interaction at an angular offset permits torque while the rotor and stator field have equal speed. Angles shown are an equivalent two-pole electrical view.\", \"analogy\": \"\"}, {\"stage\": 6, \"title\": \"A demand step borrows rotational energy.\", \"lead\": \"Matching the new demand stops a fall. Extra input is needed to regain speed.\", \"scene\": \"frequency\", \"body\": \"\u003cp>In this island model there is one synchronous generator and no storage. If electrical demand exceeds mechanical input, the rotor supplies the shortfall from stored kinetic energy. Its speed and electrical frequency fall.\u003c\\/p>\\n  \u003cp>\u003cb>Match load\u003c\\/b> raises mechanical input to the new electrical demand. The frequency stops falling, but remains below its original value in this simplified model.\u003c\\/p>\\n  \u003cp>\u003cb>Recover\u003c\\/b> briefly raises mechanical input above demand. The surplus restores rotational energy and speed. Match the powers again when frequency reaches 50 Hz.\u003c\\/p>\\n  \u003cp>A real power system uses governor and secondary control, includes losses and frequency-sensitive loads, and may have many generators and storage devices. This small-signal swing model isolates inertia and power imbalance.\u003c\\/p>\", \"eq\": \"E\u003csub>rotation\u003c\\/sub> = ½Jω² &nbsp;&nbsp; near 50 Hz: df/dt ≈ f₀(P\u003csub>m\u003c\\/sub> − P\u003csub>e\u003c\\/sub>)/(2H)\", \"controls\": [{\"key\": \"pm\", \"label\": \"Mechanical input\", \"value\": 1, \"min\": 0.5, \"max\": 1.5, \"step\": 0.05, \"unit\": \"pu\"}, {\"key\": \"pe\", \"label\": \"Electrical demand\", \"value\": 1, \"min\": 0.5, \"max\": 1.5, \"step\": 0.05, \"unit\": \"pu\"}], \"question\": \"Why does merely matching the larger load fail to restore the lost frequency immediately?\", \"answer\": \"Equal input and output stop the kinetic energy from changing. Restoring lost kinetic energy requires a temporary positive power surplus. Here H = 5 s and powers use the same per-unit base.\", \"analogy\": \"\"}, {\"stage\": 6, \"title\": \"Balanced three-phase currents cancel in the neutral.\", \"lead\": \"The cancellation happens at every instant.\", \"scene\": \"neutral\", \"body\": \"\u003cp>In a star-connected system with a neutral, the neutral carries the signed sum needed to balance the three phase currents.\u003c\\/p>\\n  \u003cp>Three equal sinusoidal currents separated by 120° sum to zero at every instant. Each phase still supplies its load; zero neutral current does not mean no power transfer.\u003c\\/p>\\n  \u003cp>Reduce one phase load and the three currents no longer cancel. The neutral provides the return path for their imbalance.\u003c\\/p>\\n  \u003cp>The controls change phase C only. Each full-load phase is 10 A RMS. Harmonics, non-sinusoidal loads, unequal phase angles and a missing neutral are outside this model.\u003c\\/p>\", \"eq\": \"i\u003csub>N\u003c\\/sub> = −(i\u003csub>A\u003c\\/sub> + i\u003csub>B\u003c\\/sub> + i\u003csub>C\u003c\\/sub>)\", \"controls\": [{\"key\": \"c\", \"label\": \"Phase C RMS current\", \"value\": 10, \"min\": 0, \"max\": 10, \"step\": 1, \"unit\": \"A\"}], \"question\": \"With phase C disconnected and the other two unchanged, is neutral RMS current 0 A, 10 A or 20 A?\", \"answer\": \"10 A. The remaining two 10 A phasors are 120° apart; their resultant magnitude is 10 A. It is not the scalar sum of their magnitudes.\", \"analogy\": \"\"}, {\"stage\": 6, \"title\": \"Equal magnitudes can still mean different voltages.\", \"lead\": \"A phase difference creates an instantaneous voltage difference across the line.\", \"scene\": \"powerflow\", \"body\": \"\u003cp>Two AC voltages can have equal RMS magnitudes but reach their peaks at different times. Their phasors are different, so their difference is not zero.\u003c\\/p>\\n  \u003cp>That voltage difference drives line current. For a line modelled as pure inductive reactance X, real power transfer depends on the sine of the phase difference δ.\u003c\\/p>\\n  \u003cp>For ordinary small phase differences, real power flows from the leading-voltage end towards the lagging end. Reversing the phase lead reverses power flow.\u003c\\/p>\\n  \u003cp>If both voltage magnitudes and phase angles are equal, current is zero in this simple series-only line model. Equal phase alone would not guarantee zero current if magnitudes differed. Line resistance, charging and network constraints are omitted.\u003c\\/p>\", \"eq\": \"Per phase: I = (V\u003csub>A\u003c\\/sub> − V\u003csub>B\u003c\\/sub>)/(jX) &nbsp;&nbsp; P\u003csub>A→B\u003c\\/sub> = (V\u003csub>A\u003c\\/sub>V\u003csub>B\u003c\\/sub>/X) sin δ\", \"controls\": [{\"key\": \"angle\", \"label\": \"A leads B by\", \"value\": 10, \"min\": -60, \"max\": 60, \"step\": 5, \"unit\": \"°\"}], \"question\": \"At equal magnitudes, what changes when the lead moves from +10° to −10°?\", \"answer\": \"The real power reverses direction. The magnitude is unchanged in this symmetric model. The phase-difference slider is not the same angle as a load’s voltage-current power-factor angle.\", \"analogy\": \"\"}, {\"stage\": 6, \"title\": \"Follow the energy through the entire system.\", \"lead\": \"Each device follows the same energy accounting, with a different physical mechanism.\", \"scene\": \"map\", \"body\": \"\u003cp>\u003cb>Turbine → generator:\u003c\\/b> mechanical torque drives a rotor; electromagnetic interaction supplies electrical power and creates opposing torque.\u003c\\/p>\\n  \u003cp>\u003cb>Transformer → line:\u003c\\/b> changing flux links windings. Raising transmission voltage allows lower current for a chosen useful power, reducing cable heating.\u003c\\/p>\\n  \u003cp>\u003cb>Line → workshop:\u003c\\/b> voltage magnitudes and phase angles determine current and power transfer. Resistive loads dissipate energy; motor loads convert part of it into mechanical output.\u003c\\/p>\\n  \u003cp>\u003cb>When a motor is added:\u003c\\/b> its electrical and mechanical transients increase demand. Generator inertia initially buffers a shortfall. Mechanical input must then increase to sustain the new load.\u003c\\/p>\\n  \u003cp>Connect the local mechanism to the whole-system consequence. No stage creates energy; real equipment also dissipates some as heat.\u003c\\/p>\", \"eq\": \"Input energy = useful output + losses + increase in stored energy\", \"controls\": [], \"question\": \"Explain a motor switching on, from rotor currents and torque to generator frequency and turbine response.\", \"answer\": \"The motor requires current to establish fields and produce torque. Added electrical demand initially exceeds unchanged mechanical input. Stored generator rotation supplies the difference and frequency falls. More turbine torque sustains the load; a temporary input surplus restores the lost rotational energy.\", \"analogy\": \"\"}, {\"stage\": 7, \"title\": \"Practise explaining, not just recognising.\", \"lead\": \"Write your own explanation before opening each model answer.\", \"scene\": \"practice\", \"body\": \"\u003cp>Use the six short practice prompts below the picture. These are learning checks, so revealing an answer is allowed. Rephrase the mechanism in your own words afterward.\u003c\\/p>\\n  \u003cp>\u003cb>A useful answer has three pieces:\u003c\\/b> what is held fixed, what changes, and the physical chain connecting cause to effect.\u003c\\/p>\\n  \u003cp>Use arrows in a sketch if words are difficult. For example, label the energy store and the input/output arrows. Keep current, flux and energy as different quantities.\u003c\\/p>\\n  \u003cp>Ticking a lesson records your own progress; it is not an automatic mastery score. The final written assessment is graded separately when you send it back.\u003c\\/p>\", \"eq\": \"\", \"controls\": [], \"question\": \"Choose one mechanism you can now explain without looking at its equation.\", \"answer\": \"Cover the diagram and describe the mechanism. Then reopen it and check the direction of each arrow. Revisit any step you could name but could not explain.\", \"analogy\": \"\"}, {\"stage\": 7, \"title\": \"A compact language and equation toolbox.\", \"lead\": \"Read symbols as statements about a physical situation.\", \"scene\": \"toolbox\", \"body\": \"\u003cdiv class=\\\"glossary\\\">\u003cp>\u003cb>I, current (A):\u003c\\/b> charge passing per second.\u003c\\/p>\u003cp>\u003cb>V, voltage (V):\u003c\\/b> energy per unit charge between points.\u003c\\/p>\u003cp>\u003cb>P, real power (W):\u003c\\/b> average net energy transfer each second.\u003c\\/p>\u003cp>\u003cb>Q, reactive power (var):\u003c\\/b> quadrature exchange in sinusoidal AC.\u003c\\/p>\u003cp>\u003cb>B, flux density (T):\u003c\\/b> local magnetic field.\u003c\\/p>\u003cp>\u003cb>Φ, flux (Wb):\u003c\\/b> field through a chosen surface.\u003c\\/p>\u003cp>\u003cb>μ, permeability:\u003c\\/b> magnetic material response.\u003c\\/p>\u003cp>\u003cb>ℜ, reluctance:\u003c\\/b> opposition to establishing flux.\u003c\\/p>\u003cp>\u003cb>L, inductance (H):\u003c\\/b> flux linkage per current in a linear model.\u003c\\/p>\u003cp>\u003cb>T, torque (N·m):\u003c\\/b> turning effect.\u003c\\/p>\u003cp>\u003cb>ω, angular speed (rad/s):\u003c\\/b> rotation rate.\u003c\\/p>\u003cp>\u003cb>s, slip:\u003c\\/b> fractional field-to-rotor speed difference.\u003c\\/p>\u003cp>\u003cb>δ, angle:\u003c\\/b> specify which two fields or voltages it compares.\u003c\\/p>\u003cp>\u003cb>RMS:\u003c\\/b> equivalent DC heating value for a resistor.\u003c\\/p>\u003cp>\u003cb>Stator / rotor:\u003c\\/b> stationary / rotating machine parts.\u003c\\/p>\u003c\\/div>\", \"eq\": \"Before using any formula, name the component, reference directions, model and fixed quantities.\", \"controls\": [], \"question\": \"Which pair of quantities did you previously treat as if they were the same?\", \"answer\": \"Common examples are flux versus flux density, power versus energy, voltage versus current, speed versus torque, and a phase difference versus a time delay.\", \"analogy\": \"\"}, {\"stage\": 7, \"title\": \"Sources, models and how to use this workbook.\", \"lead\": \"Original explanations and diagrams, checked against open textbooks and university notes.\", \"scene\": \"sources\", \"body\": \"\u003col class=\\\"sources\\\">\u003cli>\u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/9-5-electrical-energy-and-power\\\">OpenStax University Physics 2, §9.5: electrical energy and power\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://web.mit.edu/6.013_book/www/chapter9/9.7.html\\\">MIT Electromagnetic Fields and Energy, §9.7: magnetic circuits\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law\\\">OpenStax, §13.1: Faraday’s law\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/14-2-self-inductance-and-inductors\\\">OpenStax, §14.2: self-inductance\u003c\\/a>; \u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/14-3-energy-in-a-magnetic-field\\\">§14.3: stored field energy\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits\\\">OpenStax, §15.2: AC circuits\u003c\\/a>; \u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit\\\">§15.4: AC power\u003c\\/a>; \u003ca href=\\\"https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers\\\">§15.6: transformers\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://ocw.mit.edu/courses/6-685-electric-machines-fall-2013/pages/course-notes/\\\">MIT 6.685 Electric Machines: magnetic circuits, synchronous and induction machines\u003c\\/a>.\u003c\\/li>\\n  \u003cli>\u003ca href=\\\"https://ocw.mit.edu/courses/6-061-introduction-to-electric-power-systems-spring-2011/9cf8de165233601f547b284cee5c2131_MIT6_061S11_ch2.pdf\\\">MIT 6.061, Chapter 2: AC power flow in linear networks\u003c\\/a>.\u003c\\/li>\u003c\\/ol>\\n  \u003cp>These sources check the physics; the original audit answers set the teaching priorities. No claim is made that all of your lecture notes were available.\u003c\\/p>\\n  \u003cp>\u003cb>Use:\u003c\\/b> open the HTML file in a browser for controls, animation, saved notes and exports. The PDF contains all lessons with labelled default-state diagrams and written answer space. Its controls do not operate.\u003c\\/p>\\n  \u003cp>Work is saved locally when the browser permits it. Export your answers as a text file to keep a separate copy. Use \u003cb>Read aloud\u003c\\/b> to hear the lesson, pause it, or change the voice and speed. Only open explanations are narrated. Device voices can work offline; online voices may need a connection.\u003c\\/p>\", \"eq\": \"\", \"controls\": [], \"question\": \"\", \"answer\": \"\", \"analogy\": \"\"}, {\"stage\": 8, \"title\": \"Final assessment · about 20 minutes\", \"lead\": \"Use this after studying. The six areas and 30-mark weighting match your baseline.\", \"scene\": \"assessment\", \"body\": \"\u003cp>Use a calculator if needed, without notes. Give reasons, and label each part confident, partly sure or guessing. An unfamiliar mechanism is useful evidence: say so.\u003c\\/p>\\n  \u003cp>This is a comparable diagnostic, not a formally standardised test. Some concepts necessarily recur. The transformer numbers and electrical changes differ from the baseline.\u003c\\/p>\\n  \u003cp>Press \u003cb>Begin assessment\u003c\\/b> to hide the lesson navigation while answering. When finished, export your answers and paste them into our chat for grading. The document does not automatically grade written explanations.\u003c\\/p>\\n  \u003cp>Use the same marking allocation shown in the baseline record. Compare both the numerical mark and the quality of the physical explanations.\u003c\\/p>\", \"eq\": \"\", \"controls\": [], \"question\": \"\", \"answer\": \"\", \"analogy\": \"\"}], \"baseline\": \"1a current would double, and power would4x\\nV=IR and P=i^2r\\n\\n1b current is massively decreased, so resistance is increased. In a resistance is fixed. in the other one, power and voltage remains constant, so the only other variable to change is the current and resistance.\\n\\n2a Im not sure what magnetic flux is, but i think that the flux increases\\nb yes flux increases but it platoes off very fast.\\n\\n3a no idea\\nb no clue\\n\\n4a 23v\\nN1/N2 = V1/V2\\nIdk what current is needed\\nb no, all i know is that the coil only works in DC\\n\\n5a I dont know the formula, but i think force, current, magnetic field are all related to each other, if one increases the other will, so if a load is placed on the system, an opposing force to the load is places, increasing the force needed and thus the current too\\nb i have no idea, whats a syncronos motor\\n\\n6a extra enegery comes from the momentum left in the generator.\\nb yes, i cant explain casue its a guess\", \"rubric\": [[\"1a\", 2, 2, \"Correct doubling of current, quadrupling of heating, with suitable equations.\"], [\"1b\", 1, 3, \"Correct direction of current change. No halving/quartering result; cable resistance and fixed quantities confused.\"], [\"2a\", 0, 3, \"Flux meaning unknown and air-gap direction incorrect.\"], [\"2b\", 1, 2, \"Recognised eventual flattening; no saturation mechanism. “Very fast” is not general.\"], [\"3a\", 0, 2, \"No answer.\"], [\"3b\", 0, 3, \"No answer.\"], [\"4a\", 2, 3, \"Correct secondary voltage and ratio; primary current missing.\"], [\"4b\", 1, 2, \"Correct “no” decision; contradictory DC explanation, intention uncertain.\"], [\"5a\", 1, 3, \"Recognised current-field-force inter
