rgin-top:15px}.prediction[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.prediction-prompt{font-size:13px;font-weight:700;text-align:center;margin:15px 0 0}.trail{padding:13px 28px;background:#f2f3e9;border-top:1px solid var(--line);font-size:12px}.trail-label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}.trace-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.trace-chip{border:1px solid #d5dcca;border-radius:4px;background:var(--card);padding:5px 8px;color:var(--muted);font-size:11px}.trace-chip strong{color:var(--ink)}.trace-arrow{color:var(--off)}.footer-controls{padding:19px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line)}.footer-controls .left{display:flex;gap:8px}.feedback{margin:0 28px 20px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#f2f4ed;font-size:13px;line-height:1.6}.feedback.success{background:var(--pale);border-color:#b1c6a5}.feedback.warning{background:var(--goldpale);border-color:#e6c680}.feedback strong{display:block;font-size:14px;margin-bottom:4px}.feedback button{margin-top:12px}.hint{margin:0 28px 20px;padding:13px 15px;border-left:3px solid var(--gold);background:var(--goldpale);font-size:13px;line-height:1.5}details.reference{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:15px 18px;font-size:13px}summary{cursor:pointer;font-weight:750}details p{font-size:13px}table{border-collapse:collapse;width:100%;margin-top:12px;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 7px}th{color:var(--muted);font-size:11px}.reference-grid{display:grid;grid-template-columns:1fr 1fr;gap:23px}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;color:var(--muted);font-size:11px}.timing-slider{width:100%;accent-color:var(--green);margin:15px 0 0}.timing-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.timing-value{text-align:center;font-weight:700;font-size:13px;margin-top:8px}.finished{padding:26px 28px;background:var(--pale);border-bottom:1px solid var(--line)}.finished h2{font-size:23px}.finished p{font-size:14px}.no-script{padding:20px;text-align:center}.hidden{display:none!important}@media(max-width:850px){.shell{padding:20px}.layout{grid-template-columns:190px 1fr;gap:16px}.mission-head,.bench{padding-left:20px;padding-right:20px}.footer-controls{padding:16px 20px}.feedback,.hint{margin-left:20px;margin-right:20px}.trail{padding-left:20px;padding-right:20px}.switch{min-width:126px}}@media(max-width:660px){.shell{padding:16px 12px}header{margin-bottom:17px;gap:10px}h1{font-size:18px}.eyebrow{font-size:9px;letter-spacing:1px}.cube{width:35px;height:35px;font-size:22px}.top-progress{min-width:85px;font-size:11px}.layout{display:block}.sidebar{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.intro,.sidebar>.note{display:none}.chapter{margin:0;min-width:0}.chapter-label{font-size:10px;gap:5px}.chapter-label span{width:20px;height:20px}.level-button{font-size:10px;padding:7px 4px;gap:3px;line-height:1.3}.level-button .dot{width:11px;font-size:10px}.mission-head{padding:19px 17px 16px}h2{font-size:24px}.badge{font-size:9px;padding:5px}.mission-head p{font-size:13px}.bench{padding:15px 12px}.bench-top{font-size:10px}.legend{gap:8px}.circuit{min-height:195px}.switch{min-width:124px;padding:8px 12px;font-size:13px}.switches{gap:9px}.footer-controls{padding:14px 17px;flex-wrap:wrap}.footer-controls button{font-size:12px;padding:10px}.feedback,.hint{margin-left:17px;margin-right:17px}.trail{padding:12px 17px}.reference-grid{grid-template-columns:1fr;gap:5px}.bottom{align-items:start}.bottom p{max-width:220px}.goal{font-size:12px}.trace-chip{font-size:10px}.timing-labels{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n\u003cheader>\n \u003cdiv class=\"brand\">\u003cdiv class=\"cube\" aria-hidden=\"true\">▦\u003c/div>\u003cdiv>\u003cdiv class=\"eyebrow\">Engineering Mastery · Parts 4–6\u003c/div>\u003ch1>Redstone Memory Lab\u003c/h1>\u003c/div>\u003c/div>\n \u003cdiv class=\"top-progress\">\u003cspan id=\"progress-text\">0 / 12 puzzles solved\u003c/span>\u003cdiv class=\"bar\" aria-hidden=\"true\">\u003cspan id=\"progress-bar\" style=\"width:0%\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/header>\n\u003cdiv class=\"layout\">\n \u003cnav class=\"sidebar\" id=\"level-nav\" aria-label=\"Puzzle rooms\">\u003c/nav>\n \u003cmain id=\"main\">\n  \u003cnoscript>\u003cp class=\"no-script\">Enable JavaScript in your browser to play this offline game.\u003c/p>\u003c/noscript>\n  \u003cdiv id=\"finish\">\u003c/div>\n  \u003csection class=\"mission\" aria-labelledby=\"mission-title\">\n   \u003cdiv class=\"mission-head\">\u003cdiv class=\"mission-title-row\">\u003cdiv>\u003cdiv class=\"eyebrow\" id=\"level-number\">\u003c/div>\u003ch2 id=\"mission-title\">\u003c/h2>\u003c/div>\u003cspan class=\"badge\" id=\"mode-badge\">\u003c/span>\u003c/div>\u003cp id=\"lesson\">\u003c/p>\u003cdiv class=\"goal\">\u003cstrong>Your mission\u003c/strong>\u003cspan id=\"goal-text\">\u003c/span>\u003c/div>\u003c/div>\n   \u003cdiv class=\"bench\">\u003cdiv class=\"bench-top\">\u003cspan id=\"board-label\">Circuit workbench\u003c/span>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"swatch on\">\u003c/i>1 / HIGH\u003c/span>\u003cspan>\u003ci class=\"swatch\">\u003c/i>0 / LOW\u003c/span>\u003cspan>\u003ci class=\"swatch unknown\">\u003c/i>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"diagram\">\u003c/div>\u003cdiv id=\"signal-status\" class=\"signal-status\" aria-live=\"polite\">\u003c/div>\u003cdiv id=\"switches\" class=\"switches\">\u003c/div>\u003cdiv id=\"timing-controls\" class=\"hidden\">\u003clabel for=\"timing-slider\" class=\"hidden\">When data changes relative to the rising clock edge, in example time units\u003c/label>\u003cinput id=\"timing-slider\" class=\"timing-slider\" type=\"range\" min=\"-5\" max=\"5\" value=\"0\" step=\"1\">\u003cdiv class=\"timing-labels\">\u003cspan>Earlier: −5\u003c/span>\u003cspan>Clock edge: 0\u003c/span>\u003cspan>Later: +5\u003c/span>\u003c/div>\u003cdiv class=\"timing-value\" id=\"timing-value\">\u003c/div>\u003c/div>\u003cp class=\"controls-help\" id=\"controls-help\">\u003c/p>\u003cdiv class=\"prediction-prompt hidden\" id=\"prediction-prompt\">\u003c/div>\u003cdiv id=\"predictions\" class=\"predictions\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"trail\">\u003cdiv class=\"trail-label\" id=\"trail-label\">Your signal trail · latest 5 moves\u003c/div>\u003cdiv class=\"trace-chips\" id=\"trace\">\u003c/div>\u003c/div>\n   \u003cdiv class=\"footer-controls\">\u003cdiv class=\"left\">\u003cbutton type=\"button\" data-action=\"restart\">↻ Restart\u003c/button>\u003cbutton type=\"button\" data-action=\"hint\">Need a hint?\u003c/button>\u003c/div>\u003cbutton type=\"button\" class=\"primary\" id=\"check\" data-action=\"check\">Check build →\u003c/button>\u003c/div>\n   \u003cdiv id=\"hint\" class=\"hint hidden\">\u003c/div>\u003cdiv id=\"feedback\" class=\"feedback hidden\" role=\"status\">\u003c/div>\n  \u003c/section>\n  \u003cdetails class=\"reference\">\u003csummary>Workbench notes · the three memory rules\u003c/summary>\u003cdiv class=\"reference-grid\">\u003cdiv>\u003ch3 style=\"margin-top:14px\">4 · SR latch: two control levers\u003c/h3>\u003cp>Cross-coupled NOR gates feed each other. Feedback holds a bit after you release a control. Think of two redstone devices keeping each other in a stable state.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>S\u003c/th>\u003cth>R\u003c/th>\u003cth>Q after settling\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Keep the stored bit*\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1 · set\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0 · reset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Q = 0, Q̅ = 0 · forbidden\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>*After a valid state. Releasing both from 1 together does not guarantee the next bit. Each NOR outputs 1 only when both its inputs are 0.\u003c/p>\u003c/div>\u003cdiv>\u003ch3 style=\"margin-top:14px\">5 · D latch: an open door\u003c/h3>\u003cp>\u003cstrong>EN = 1:\u003c/strong> the door is open, so Q follows D. \u003cstrong>EN = 0:\u003c/strong> the door is shut, so Q keeps its last bit. EN means enable; D means data.\u003c/p>\u003ch3 style=\"margin-top:18px\">6 · D flip-flop: a camera shutter\u003c/h3>\u003cp>This rising-edge flip-flop copies D only when CLK changes \u003cstrong>0 → 1\u003c/strong>. A steady 1 is not another edge. A falling edge, 1 → 0, does not capture.\u003c/p>\u003cp>\u003cstrong>Setup time:\u003c/strong> keep D steady before the edge. \u003cstrong>Hold time:\u003c/strong> keep it steady afterwards. Breaking these limits can cause a wrong capture or a brief in-between voltage: metastability.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"note\">Powered, simplified logic after settling. Starting bits are deliberately initialized, not assumed at power-up. The timing room uses invented time units, not a particular chip's specification. “?” means the result is not guaranteed; it is not a third stored logic value. Minecraft comparisons explain the idea, not exact redstone behavior.\u003c/p>\u003c/details>\n \u003c/main>\n\u003c/div>\n\u003cfooter class=\"bottom\">\u003cp>12 short puzzles. No timer. Progress stays in this browser when storage is available.\u003c/p>\u003cbutton type=\"button\" class=\"ghost small\" data-action=\"reset-progress\" id=\"reset-progress\">Reset saved progress\u003c/button>\u003c/footer>\n\u003c/div>\n\u003cscript id=\"memory-engine\">\n'use strict';\nconst MemoryEngine = (() => {\n const base = {s:0,r:0,q:0,qb:1,d:0,en:0,clk:0,seen:{},captures:[],events:[]};\n const levels = [\n {id:'4.1',room:4,type:'sr',mode:'build',title:'Leave the lamp on',lesson:'You already know the NOR latch. Now use it: S sets Q to 1. With S = R = 0, feedback keeps the bit.',goal:'Start at Q = 0. Set a 1, then release both levers. Leave Q = 1 with S = R = 0.',initial:{},hint:'Press S to 1, then return S to 0. Leave R at 0.',success:'The set pulse made Q = 1. After you released S, Q fed back into the other NOR, keeping its output at 0. That 0 lets Q stay at 1. The circuit remembers.',test:x=>x.q===1&&x.s===0&&x.r===0&&x.seen.set},\n {id:'4.2',room:4,type:'sr',mode:'build',title:'Leave the lamp off',lesson:'The two halves are symmetric. R resets Q to 0; releasing R lets feedback keep that 0.',goal:'Start at Q = 1. Reset it, release both levers, and leave Q = 0.',initial:{q:1,qb:0},hint:'Pulse R: 0 → 1 → 0. Keep S at 0.',success:'R forced Q to 0. The other NOR then produced 1, feeding back to keep Q at 0 even after R returned to 0.',test:x=>x.q===0&&x.s===0&&x.r===0&&x.seen.reset},\n {id:'4.3',room:4,type:'sr',mode:'predict',title:'Two levers, one mistake',lesson:'Each NOR outputs 0 whenever ANY input is 1. Predict before the game presses S and R together.',goal:'What will Q and the other output Q̅ be while S = R = 1?',initial:{q:1,qb:0},choices:[['00','Both 0'],['11','Both 1'],['10','Q = 1, Q̅ = 0']],answer:'00',reveal:[['both',1]],hint:'Each gate gets its own external 1. Feedback cannot override it.',success:'Both outputs are definitely 0 while both inputs are held at 1. Each NOR is forced low by its external input. This is forbidden because the outputs are no longer opposites.'},\n {id:'4.4',room:4,type:'sr',mode:'predict',title:'The release race',lesson:'Both levers are now held at 1, forcing both outputs to 0. Imagine letting go of both at exactly the same time.',goal:'After both inputs return to 0 together, can you guarantee the final value of Q?',initial:{s:1,r:1,q:0,qb:0},choices:[['0','Guaranteed 0'],['1','Guaranteed 1'],['?','Could settle at 0 or 1']],answer:'?',reveal:[['both',0]],hint:'Both gates initially see two 0s and try to go high. A tiny difference can decide which side wins.',success:'No guaranteed winner. Tiny gate delays and noise can decide the outcome; the circuit may briefly be metastable, then settle to 0 or 1. It need not keep oscillating. Set or reset explicitly to recover a known bit.'},\n {id:'5.1',room:5,type:'d',mode:'build',title:'Open the data door',lesson:'New device: a D latch. D is the data lever. EN opens the door. While EN = 1, Q follows every change of D.',goal:'Open EN. Make Q go 0 → 1 → 0 while the door stays open. Finish with EN = 1 and D = Q = 0.',initial:{},hint:'Turn EN on, turn D on, then turn D off. Keep EN on.',success:'Q followed both data changes without a clock pulse. A D latch is transparent for the whole time EN is 1.',test:x=>x.en===1&&x.d===0&&x.q===0&&x.seen.follow1&&x.seen.back0},\n {id:'5.2',room:5,type:'d',mode:'build',title:'Trap a 1 inside',lesson:'The door starts open, with D = Q = 1. Closing EN makes the latch remember its current bit.',goal:'Keep Q = 1, but make D = 0. Finish with the door closed: EN = 0.',initial:{d:1,en:1,q:1},hint:'Close EN first. Then change D. Closing the door after changing D would store 0 instead.',success:'You closed EN while Q was 1. Now D can change outside, but Q keeps the trapped 1.',test:x=>x.q===1&&x.en===0&&x.d===0},\n {id:'5.3',room:5,type:'d',mode:'build',title:'Replace the stored bit',lesson:'A closed door protects the bit, but it also blocks new data. You must open it to replace the stored value.',goal:'Replace the stored 1 with 0. Close EN again, then put D back to 1 while Q stays 0.',initial:{d:1,en:0,q:1},hint:'Set D to 0, open EN, close EN, then set D back to 1.',success:'The open latch copied 0. Closing EN locked it in. Changing D back to 1 proved the latch was holding rather than following.',test:x=>x.q===0&&x.en===0&&x.d===1&&x.seen.follow0},\n {id:'5.4',room:5,type:'d',mode:'predict',title:'An open door is not a snapshot',lesson:'EN stays at 1 throughout this test. The game will change D from 0 to 1, then back to 0.',goal:'What will Q do when D makes that 0 → 1 → 0 journey?',initial:{en:1},choices:[['follow','Go 0 → 1 → 0'],['hold0','Stay at 0'],['hold1','Go to 1 and stay there']],answer:'follow',reveal:[['d',1],['d',0]],hint:'An open D latch keeps following. It does not wait for EN to change again.',success:'Q went 0 → 1 → 0 too. Holding EN high keeps the door open. That is the key difference between a latch and a flip-flop.'},\n {id:'6.1',room:6,type:'ff',mode:'build',title:'Take a one-bit photo',lesson:'New device: a rising-edge D flip-flop. It captures D only on CLK 0 → 1, like a camera shutter taking one photo.',goal:'Capture a 1. Leave CLK high, then change D to 0 while Q stays 1.',initial:{d:1},hint:'Raise CLK once while D = 1. Then turn D off. A steady HIGH clock does not take more photos.',success:'The rising edge captured D = 1. With CLK held at 1, changing D did not alter Q. A high clock is a level; 0 → 1 is an edge.',test:x=>x.q===1&&x.d===0&&x.clk===1&&x.captures.includes(1)},\n {id:'6.2',room:6,type:'ff',mode:'predict',title:'The wrong clock edge',lesson:'This flip-flop starts with Q = 1, D = 0 and CLK = 1. We will lower CLK to 0.',goal:'What will Q be after the falling edge, CLK 1 → 0?',initial:{q:1,d:0,clk:1},choices:[['0','Q becomes 0'],['1','Q stays 1'],['?','Q is unpredictable']],answer:'1',reveal:[['clk',0]],hint:'This particular flip-flop captures on a rising edge only.',success:'Q stayed 1. The falling edge is not its capture event. Raise CLK again with D = 0 and it would capture 0 on that next rising edge.'},\n {id:'6.3',room:6,type:'ff',mode:'build',title:'Photograph a secret code',lesson:'A new rising edge needs the clock to return LOW first. Set the data, then take each photo.',goal:'Capture exactly three bits in this order: 1, 0, 1. The capture strip records rising edges only.',initial:{},hint:'D = 1, CLK up; CLK down; D = 0, CLK up; CLK down; D = 1, CLK up. Restart if you captured an extra bit.',success:'You captured 1, 0, 1 on three rising edges. Data changes and falling edges between them did not add photographs.',test:x=>x.captures.join(',')==='1,0,1'},\n {id:'6.4',room:6,type:'timing',mode:'timing',title:'Keep still for the photo',lesson:'D changes once, from 0 to 1. This example needs D steady for 2 units before the clock edge (setup) and 2 units after it (hold).',goal:'Choose when D changes so the rising edge reliably captures a 1. Avoid the shaded setup/hold window.',initial:{},hint:'Move the data change to −3 or earlier. Then D is already 1 for more than 2 units before the edge, and stays 1 afterwards.',success:'D changed early enough, then stayed steady across the setup and hold window. The flip-flop can reliably capture 1 in this simplified example.'}\n ];\n function init(level){const x={...base,...level.initial,seen:{},captures:[],events:[]};x.events.push(snapshot(x,'Start'));return x;}\n function snapshot(x,label){return {label,q:x.q,qb:x.qb,s:x.s,r:x.r,d:x.d,en:x.en,clk:x.clk};}\n function reduce(previous,type,key,value){\n  const x={...previous,seen:{...previous.seen},captures:[...previous.captures],events:[...previous.events]};\n  if(key==='both'){x.s=value;x.r=value;}else{x[key]=value;}\n  if(type==='sr'){\n   if(x.s&&x.r){x.q=0;x.qb=0;}\n   else if(x.s){x.q=1;x.qb=0;x.seen.set=true;}\n   else if(x.r){x.q=0;x.qb=1;x.seen.reset=true;}\n   else if(previous.s&&previous.r){x.q='?';x.qb='?';}\n  }\n  if(type==='d'&&key==='en'&&!x.en){x.seen.follow1=false;x.seen.back0=false;}\n  if(type==='d'&&x.en){x.q=x.d;if(x.q===1)x.seen.follow1=true;if(x.q===0){x.seen.follow0=true;if(previous.seen.follow1)x.seen.back0=true;}}\n  if(type==='ff'&&key==='clk'&&previous.clk===0&&x.clk===1){x.q=x.d;x.captures.push(x.d);}\n  const label=key==='both'?(value?'S & R → 1':'S & R → 0'):`${{s:'S',r:'R',d:'D',en:'EN',clk:'CLK'}[key]} → ${value}`;\n  x.events.push(snapshot(x,label));x.events=x.events.slice(-20);return x;\n }\n function timing(offset){return {q:Math.abs(offset)\u003c2?'?':offset\u003c0?1:0,safe:Math.abs(offset)>=2};}\n return {levels,init,reduce,timing};\n})();\n\u003c/script>\n\u003cscript>\n(() => {\n 'use strict';\n const $=id=>document.getElementById(id),E=MemoryEngine,key='redstone-memory-lab-v1';\n let saved={results:{},last:0};\n try{const p=JSON.parse(localStorage.getItem(key));if(p&&p.results&&typeof p.results==='object'&&!Array.isArray(p.results))saved={results:p.results,last:Number.isInteger(p.last)&&p.last>=0&&p.last\u003cE.levels.length?p.last:0};}catch{}\n let index=saved.last,state,selected=null,feedback=null,hint=false,assisted=false,wrong=0,solved=false,revealed=false,offset=0,timingResult=null,moves=0;\n const esc=t=>String(t).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n function persist(){try{localStorage.setItem(key,JSON.stringify(saved));}catch{}}\n function level(){return E.levels[index];}\n function load(i){index=i;saved.last=i;persist();state=E.init(level());selected=null;feedback=null;hint=false;assisted=false;wrong=0;solved=false;revealed=false;offset=0;timingResult=null;moves=0;render();}\n function color(bit){return bit===1?'var(--red)':bit===0?'var(--off)':'var(--gold)';}\n function wire(path,bit,thin=false){return `\u003cpath class=\"wire${thin?' thin':''}\" stroke=\"${color(bit)}\" d=\"${path}\"/>`;}\n function text(x,y,t,cls='',anchor='middle'){return `\u003ctext x=\"${x}\" y=\"${y}\" text-anchor=\"${anchor}\" class=\"${cls}\">${esc(t)}\u003c/text>`;}\n function lamp(x,y,bit){return `\u003crect x=\"${x-26}\" y=\"${y-26}\" width=\"52\" height=\"52\" rx=\"4\" fill=\"${bit===1?'#f6be64':bit===0?'#e3e7dc':'#fff0cd'}\" stroke=\"${color(bit)}\" stroke-width=\"3\"/>${text(x,y+8,bit,'big')}`;}\n function srDiagram(){const x=state,small=$('diagram').clientWidth\u003c450;return small?`\u003csvg class=\"circuit\" viewBox=\"0 0 360 290\" role=\"img\" aria-label=\"Cross-coupled NOR latch. S ${x.s}, R ${x.r}, Q ${x.q}, other output ${x.qb}.\">${wire('M35 205 H110',x.s)}${wire('M35 75 H110',x.r)}${wire('M235 75 H294',x.q)}${wire('M235 205 H270',x.qb)}${wire('M250 75 V140 H85 V185 H110',x.q)}${wire('M270 205 V252 H62 V95 H110',x.qb)}\u003crect class=\"gate\" x=\"110\" y=\"43\" width=\"125\" height=\"65\" rx=\"8\"/>\u003crect class=\"gate\" x=\"110\" y=\"172\" width=\"125\" height=\"65\" rx=\"8\"/>${text(55,57,`R = ${x.r}`)}${text(55,189,`S = ${x.s}`)}${text(172,69,'NOR')}${text(172,91,`${x.r}, ${x.qb} → ${x.q}`,'sub')}${text(172,198,'NOR')}${text(172,220,`${x.s}, ${x.q} → ${x.qb}`,'sub')}${lamp(320,75,x.q)}${text(320,123,'Q','sub')}${text(315,210,`Q̅ = ${x.qb}`)}${text(180,279,'Each output feeds the other gate','sub')}\u003c/svg>`:`\u003csvg class=\"circuit\" viewBox=\"0 0 600 280\" role=\"img\" aria-label=\"Cross-coupled NOR latch. S ${x.s}, R ${x.r}, Q ${x.q}, other output ${x.qb}.\">${wire('M90 205 H180',x.s)}${wire('M90 75 H180',x.r)}${wire('M330 75 H485',x.q)}${wire('M330 205 H385',x.qb)}${wire('M355 75 V145 H150 V185 H180',x.q)}${wire('M385 205 V245 H125 V95 H180',x.qb)}\u003crect class=\"gate\" x=\"180\" y=\"43\" width=\"150\" height=\"65\" rx=\"8\"/>\u003crect class=\"gate\" x=\"180\" y=\"172\" width=\"150\" height=\"65\" rx=\"8\"/>${text(70,80,`R = ${x.r}`)}${text(70,210,`S = ${x.s}`)}${text(255,69,'NOR')}${text(255,91,`${x.r}, ${x.qb} → ${x.q}`,'sub')}${text(255,198,'NOR')}${text(255,220,`${x.s}, ${x.q} → ${x.qb}`,'sub')}${lamp(520,75,x.q)}${text(520,125,'Q · stored bit','sub')}${text(470,210,`Q̅ = ${x.qb}`)}${text(275,268,'Each output feeds the other gate','sub')}\u003c/svg>`;}\n function dDiagram(ff=false){const x=state,control=ff?x.clk:x.en,open=!ff&&x.en,small=$('diagram').clientWidth\u003c450,c=small?180:300,left=small?110:210,right=small?250:390,out=small?320:520;return `\u003csvg class=\"circuit\" viewBox=\"0 0 ${small?360:600} 245\" role=\"img\" aria-label=\"${ff?'D flip-flop':'D latch'}. D ${x.d}, ${ff?'clock':'enable'} ${control}, Q ${x.q}.\">${wire(`M${small?58:85} 110 H${left}`,x.d)}${wire(`M${right} 110 H${out-26}`,x.q)}${wire(`M${c} 205 V160`,control)}\u003crect class=\"gate\" x=\"${left}\" y=\"45\" width=\"${right-left}\" height=\"115\" rx=\"8\"/>${ff?`\u003cpath d=\"M${c-15} 160 L${c} 140 L${c+15} 160\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/>`:''}${text(small?40:65,116,`D = ${x.d}`)}${text(c,79,ff?'D FLIP-FLOP':'D LATCH')}${text(c,109,ff?'Rising edge only':open?'DOOR OPEN':'DOOR CLOSED','sub')}${text(c,133,ff?'0 → 1 takes a photo':open?'Q follows D':'Q keeps its bit','sub')}${text(c,228,`${ff?'CLK':'EN'} = ${control}`)}${lamp(out,110,x.q)}${text(out,159,small?'Q':'Q · stored bit','sub')}\u003c/svg>`;}\n function timingDiagram(){const small=$('diagram').clientWidth\u003c450,cx=small?180:300,scale=small?22:39,dx=cx+offset*scale,left=small?65:95,right=small?295:505,q=timingResult?timingResult.q:'—';return `\u003csvg class=\"circuit\" viewBox=\"0 0 ${small?360:600} 255\" role=\"img\" aria-label=\"Example timing diagram. Clock rises at 0. Data changes at ${offset}. Setup and hold window from minus 2 to plus 2.\">\u003crect x=\"${cx-2*scale}\" y=\"30\" width=\"${4*scale}\" height=\"170\" rx=\"4\" fill=\"var(--goldpale)\"/>${text(cx,20,small?'Keep D steady in the shaded window':'D must stay steady in this shaded window','sub')}${text(small?30:52,78,'D')}${text(small?30:52,160,'CLK')}${wire(`M${left} 88 H${dx}`,0,true)}${wire(`M${dx} 88 V52 H${right}`,1,true)}${wire(`M${left} 170 H${cx}`,0,true)}${wire(`M${cx} 170 V135 H${right}`,1,true)}\u003cpath d=\"M${cx} 30 V211\" stroke=\"var(--green)\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>${text(cx-2*scale,224,'−2','sub')}${text(cx,224,'0 ↑','sub')}${text(cx+2*scale,224,'+2','sub')}${text(cx-scale,245,'Setup','sub')}${text(cx+scale,245,'Hold','sub')}${text(left+4,109,'0','sub')}${text(right-4,44,'1','sub')}\u003crect x=\"${dx-4}\" y=\"46\" width=\"8\" height=\"48\" rx=\"2\" fill=\"var(--red)\"/>${text(small?328:552,158,`Q: ${q}`)}\u003c/svg>`;}\n function status(){const l=level(),x=state;if(l.type==='sr'){if(x.s&&x.r)return 'Both forced LOW: Q = 0 and Q̅ = 0. Forbidden input combination.';if(x.q==='?')return '? = no guaranteed final bit after simultaneous release.';return x.s?'SET active: Q = 1.':x.r?'RESET active: Q = 0.':`Both controls released. Feedback holds Q = ${x.q}.`;}\n  if(l.type==='d')return x.en?`Door open: Q follows D = ${x.d}.`:`Door closed: Q holds ${x.q}, even if D changes.`;\n  if(l.type==='timing')return timingResult?timingResult.safe?`Timing is safe in this example. The edge captures ${timingResult.q}.`:'Timing violated: the captured bit is not guaranteed.':'Place the data change, then try the capture.';\n  return `D = ${x.d} · CLK = ${x.clk} · Q holds ${x.q} until the next rising edge.`;\n }\n function renderNav(){const count=E.levels.filter(l=>saved.results[l.id]).length;$('progress-text').textContent=`${count} / 12 puzzles solved`;$('progress-bar').style.width=`${count/12*100}%`;\n  $('level-nav').innerHTML='\u003cp class=\"intro\">Operate the levers. Watch the wires. Teach a circuit to remember.\u003c/p>'+[4,5,6].map(r=>`\u003cdiv class=\"chapter\">\u003cdiv class=\"chapter-label\">\u003cspan>${r}\u003c/span>${{4:'Feedback & SR',5:'D latch',6:'Flip-flop'}[r]}\u003c/div>${E.levels.map((l,i)=>l.room===r?`\u003cbutton type=\"button\" data-level=\"${i}\" class=\"level-button ${i===index?'selected':''} ${saved.results[l.id]?'done':''}\" ${i===index?'aria-current=\"step\"':''}>\u003cspan class=\"dot\">${saved.results[l.id]?'✓':'·'}\u003c/span>\u003cspan>${l.id} ${esc(l.title)}\u003c/span>\u003c/button>`:'').join('')}\u003c/div>`).join('')+'\u003cp class=\"note\">Red wire = HIGH, like powered redstone. The lamp shows Q, the stored bit. You can visit any room.\u003c/p>';\n }\n function render(){const l=level();renderNav();$('level-number').textContent=`Room ${l.room} · Puzzle ${l.id}`;$('mission-title').textContent=l.title;$('mode-badge').textContent=l.mode==='build'?'Operate & solve':l.mode==='predict'?'Predict & test':'Timing challenge';$('lesson').textContent=l.lesson;$('goal-text').textContent=l.goal;$('board-label').textContent=l.type==='sr'?'Two NOR gates · feedback loop':l.type==='timing'?'Time diagram · example units':l.type==='d'?'Level-sensitive memory':'Edge-triggered memory';\n  $('diagram').innerHTML=l.type==='sr'?srDiagram():l.type==='timing'?timingDiagram():dDiagram(l.type==='ff');$('signal-status').textContent=status();\n  const keys=l.mode==='build'?(l.type==='sr'?['s','r']:l.type==='d'?['d','en']:['d','clk']):[];\n  $('switches').innerHTML=keys.map(k=>`\u003cbutton type=\"button\" class=\"switch ${state[k]?'high':''}\" data-toggle=\"${k}\" aria-label=\"${{s:'Set',r:'Reset',d:'Data',en:'Enable',clk:'Clock'}[k]}\" aria-pressed=\"${!!state[k]}\" ${solved?'disabled':''}>\u003cspan>${{s:'S · set',r:'R · reset',d:'D · data',en:'EN · door',clk:'CLK · clock'}[k]}\u003c/span>\u003cspan class=\"switch-symbol\">${state[k]}\u003c/span>\u003c/button>`).join('');\n  $('controls-help').textContent=l.mode==='build'?'Click a lever to switch between 0 and 1. No timer.':l.mode==='predict'?'Choose a prediction, then run the test.':'One data change, 0 → 1. It stays at 1 afterwards.';\n  $('timing-controls').classList.toggle('hidden',l.type!=='timing');$('timing-slider').value=String(offset);$('timing-slider').disabled=solved;$('timing-value').textContent=`D changes at t = ${offset>0?'+':''}${offset}`;\n  $('prediction-prompt').classList.toggle('hidden',l.mode!=='predict');$('prediction-prompt').textContent='Choose your prediction';$('predictions').innerHTML=l.choices?l.choices.map(([v,t])=>`\u003cbutton type=\"button\" class=\"prediction\" data-predict=\"${esc(v)}\" aria-pressed=\"${selected===v}\" ${solved?'disabled':''}>${esc(t)}\u003c/button>`).join(''):'';\n  $('check').disabled=solved||(l.mode==='predict'&&selected===null);$('check').textContent=solved?'✓ Solved':l.mode==='predict'?'Run test →':l.type==='timing'?'Try this timing →':'Check build →';\n  if(l.id==='6.3'){$('trail-label').textContent='Captured bits · rising edges only';$('trace').innerHTML=state.captures.length?state.captures.map((v,i)=>`\u003cspan class=\"trace-chip\">Photo ${i+1}: \u003cstrong>${v}\u003c/strong>\u003c/span>`).join(''):'\u003cspan class=\"note\">No photos yet. Target: 1, 0, 1.\u003c/span>';}\n  else if(l.type==='timing'){$('trail-label').textContent='Capture setup';$('trace').innerHTML='\u003cspan class=\"trace-chip\">Before change: \u003cstrong>D = 0\u003c/strong>\u003c/span>\u003cspan class=\"trace-chip\">After change: \u003cstrong>D = 1\u003c/strong>\u003c/span>\u003cspan class=\"trace-chip\">Clock rises: \u003cstrong>t = 0\u003c/strong>\u003c/span>';}\n  else{$('trail-label').textContent='Your signal trail · latest 5 moves';$('trace').innerHTML=state.events.slice(-5).map((v,i)=>`${i?'\u003cspan class=\"trace-arrow\">→\u003c/span>':''}\u003cspan class=\"trace-chip\">${esc(v.label)} · \u003cstrong>Q ${esc(v.q)}\u003c/strong>\u003c/span>`).join('');}\n  $('hint').classList.toggle('hidden',!hint);$('hint').textContent='Hint: '+l.hint;\n  $('feedback').className='feedback'+(feedback?' '+feedback.kind:' hidden');$('feedback').innerHTML=feedback?`\u003cstrong>${esc(feedback.title)}\u003c/strong>${esc(feedback.body)}${solved?`\u003cbr>\u003cbutton type=\"button\" class=\"primary\" data-action=\"next\">${index===E.levels.length-1?'View progress':'Next puzzle →'}\u003c/button>`:''}`:'';\n  $('finish').innerHTML='';\n }\n function complete(){solved=true;const result={assisted:assisted||wrong>0,moves};const old=saved.results[level().id];if(!old||old.assisted&&!result.assisted)saved.results[level().id]=result;persist();feedback={kind:'success',title:result.assisted?'Solved with help.':'Puzzle solved.',body:level().success};}\n function check(){if(solved)return;const l=level();if(l.mode==='predict'){\n    if(selected===null)return;if(!revealed){l.reveal.forEach(([k,v])=>{state=E.reduce(state,l.type,k,v);});revealed=true;}\n    if(selected===l.answer)complete();else{wrong++;assisted=true;feedback={kind:'warning',title:'Watch what the circuit did.',body:l.success+' Choose the matching prediction and run it again.'};}\n   }else if(l.type==='timing'){\n    timingResult=E.timing(offset);if(timingResult.safe&&timingResult.q===1)complete();else{wrong++;assisted=true;feedback={kind:'warning',title:timingResult.safe?'Safe timing, wrong bit.':'Too close to the edge.',body:timingResult.safe?'D changes after the edge, so the flip-flop safely photographs the old 0. Move the change earlier to capture 1.':'D changes inside the setup/hold window. It might look fine on one attempt, but the captured value is not guaranteed. The circuit can briefly sit at an in-between voltage. Move the change outside the shaded window.'};}\n   }else if(l.test(state))complete();else{wrong++;assisted=true;feedback={kind:'warning',title:'Not there yet.',body:l.id==='6.3'&&state.captures.length>=3?'Your captured sequence is '+state.captures.join(', ')+'. Restart and aim for exactly 1, 0, 1.':`Right now Q = ${state.q}. Compare your levers and signal trail with the mission, then adjust the circuit. A hint is available if you need it.`};}render();\n }\n function showProgress(){const done=E.levels.filter(l=>saved.results[l.id]),help=done.filter(l=>saved.results[l.id].assisted).length;$('finish').innerHTML=`\u003csection class=\"finished\" tabindex=\"-1\">\u003cdiv class=\"eyebrow\">Your workbench record\u003c/div>\u003ch2>${done.length===12?'All three rooms explored.':`${done.length} of 12 puzzles solved.`}\u003c/h2>\u003cp>${done.length-help} solved without a hint or failed check; ${help} solved with help. These are practice results, not a mastery score.\u003c/p>\u003cp>\u003cstrong>Remember:\u003c/strong> SR uses set/reset and feedback. A D latch follows while enabled. A D flip-flop captures at an edge.\u003c/p>\u003c/section>`;$('finish').firstElementChild.focus();$('finish').scrollIntoView({block:'start',behavior:'instant'});}\n document.addEventListener('click',event=>{\n  const b=event.target.closest('button');if(!b||b.disabled)return;\n  if(b.dataset.level!==undefined){load(Number(b.dataset.level));return;}\n  if(b.dataset.toggle){const k=b.dataset.toggle;state=E.reduce(state,level().type,k,1-state[k]);moves++;feedback=null;render();document.querySelector(`[data-toggle=\"${k}\"]`)?.focus();return;}\n  if(b.dataset.predict!==undefined){selected=b.dataset.predict;feedback=null;render();document.querySelector(`[data-predict=\"${selected}\"]`)?.focus();return;}\n  switch(b.dataset.action){case'check':check();break;case'restart':{const hadHelp=assisted||hint||wrong>0;load(index);assisted=hadHelp;break;}case'hint':hint=!hint;if(hint)assisted=true;render();break;case'next':if(index\u003cE.levels.length-1){load(index+1);$('mission-title').scrollIntoView({block:'start',behavior:'instant'});}else showProgress();break;case'reset-progress':if(confirm('Clear all saved puzzle results and return to 4.1?')){saved={results:{},last:0};persist();load(0);}break;}\n });\n $('timing-slider').addEventListener('input',event=>{offset=Number(event.target.value);timingResult=null;feedback=null;render();$('timing-slider').focus();});\n if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{$('diagram').innerHTML=level().type==='sr'?srDiagram():level().type==='timing'?timingDiagram():dDiagram(level().type==='ff');}).observe($('diagram'));\n load(index);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","workbook":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Electrical Energy · Visual Workbook\u003c/title>\n\u003cstyle>\n:root{--ink:#13263a;--muted:#506276;--teal:#087f8c;--purple:#6952b8;--orange:#d8692d;--b
