" stroke-linejoin=\"round\">\u003c/path>\u003ctext x=\"60\" y=\"34\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">v\u003c/text>\u003ctext x=\"125\" y=\"34\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"start\" font-weight=\"400\">i\u003c/text>\u003ctext x=\"188\" y=\"34\" font-size=\"15\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">p = vi (scaled)\u003c/text>\u003ctext x=\"550\" y=\"34\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">V = 10 V, I = 2 A RMS\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>0 W\u003c/b>\u003cspan>average real power P\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>20 var\u003c/b>\u003cspan>reactive power Q\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>20 VA\u003c/b>\u003cspan>apparent power S\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c14-angle\">Current lag\u003coutput>90 °\u003c/output>\u003c/label>\u003cinput id=\"c14-angle\" type=\"range\" min=\"0\" max=\"90\" step=\"5\" value=\"90\" data-page=\"14\" data-key=\"angle\" aria-label=\"Current lag\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">P = VI cos φ (W) &nbsp;&nbsp; Q = VI sin φ (var) &nbsp;&nbsp; S = VI (VA)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>In a resistor, voltage and current have the same sign at each instant. Their product p = vi is nonnegative: electrical energy continually becomes heat.\u003c/p>\n  \u003cp>In an ideal inductor under sinusoidal steady-state AC, current lags voltage by 90°. During part of the cycle the field receives energy; during another part it returns energy to the source. Its net change over a full cycle is zero.\u003c/p>\n  \u003cp>\u003cb>Real power P\u003c/b> is average energy transfer per second. \u003cb>Reactive power Q\u003c/b> characterises the quadrature exchange associated with energy storage. Q is measured in var, not joules, and is not an extra amount of heat.\u003c/p>\n  \u003cp>A real coil has winding resistance and often core losses. It therefore takes positive average real power as well as exchanging stored energy. Reactive current can also cause heating in the supply cables.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>At a 90° lag, why do the positive and negative power areas matter?\u003c/p>\u003ctextarea data-note=\"14\" aria-label=\"Your explanation for lesson 15\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>They are equal over one cycle, so net energy transfer and average real power are zero. Current and instantaneous power are still nonzero.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"14\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p15\" data-scene=\"transformer\" aria-label=\"A transformer links two circuits through flux.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 16 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">4 · Transformers · 16\u003c/div>\u003ch2>A transformer links two circuits through flux.\u003c/h2>\u003cp class=\"lead\">The windings share changing flux, not a flow of charge between them.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A transformer links two circuits through flux.\">\u003ctitle>A transformer links two circuits through flux.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"145\" y=\"55\" width=\"310\" height=\"250\" rx=\"38\" fill=\"none\" stroke=\"#cbd5dc\" stroke-width=\"51\">\u003c/rect>\u003cpath d=\"M115 102 Q180 85 176 110\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 124 Q180 107 176 132\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 146 Q180 129 176 154\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 168 Q180 151 176 176\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 190 Q180 173 176 198\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 212 Q180 195 176 220\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M115 234 Q180 217 176 242\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M176 87 H418 V273 H176 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.6476903040860096\" opacity=\"0.7354993488279531\">\u003c/path>\u003cpath d=\"M187 98 H407 V262 H187 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.6476903040860096\" opacity=\"0.7354993488279531\">\u003c/path>\u003cpath d=\"M198 109 H396 V251 H198 Z\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"1.6476903040860096\" opacity=\"0.7354993488279531\">\u003c/path>\u003cline x1=\"280\" y1=\"87\" x2=\"345\" y2=\"87\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M336.819308252926,90.7518372218629 L345,87 L336.819308252926,83.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"300\" y=\"181\" font-size=\"18\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">shared flux Φ\u003c/text>\u003cpath d=\"M424 114 Q484 101 480 122\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M424 139 Q484 126 480 147\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M424 164 Q484 151 480 172\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M424 189 Q484 176 480 197\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M424 214 Q484 201 480 222\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cline x1=\"45\" y1=\"150\" x2=\"100\" y2=\"150\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M91.81930825292604,153.7518372218629 L100,150 L91.81930825292604,146.2481627781371\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/path>\u003ctext x=\"55\" y=\"128\" font-size=\"13\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">primary AC\u003c/text>\u003ctext x=\"80\" y=\"325\" font-size=\"13\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">extra primary current\u003c/text>\u003cline x1=\"485\" y1=\"110\" x2=\"555\" y2=\"110\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cline x1=\"485\" y1=\"260\" x2=\"555\" y2=\"260\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cline x1=\"555\" y1=\"110\" x2=\"555\" y2=\"155\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cline x1=\"555\" y1=\"210\" x2=\"555\" y2=\"260\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003crect x=\"525\" y=\"155\" width=\"60\" height=\"55\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"555\" y=\"187.5\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">R\u003c/text>\u003ctext x=\"300\" y=\"30\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Linked changing flux; no electrical connection\u003c/text>\u003ctext x=\"530\" y=\"303\" font-size=\"13\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"400\">load current\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Voltage present\u003c/b>\u003cspan>secondary emf with AC\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Current flows\u003c/b>\u003cspan>secondary condition\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c15-load\">Secondary load connected\u003coutput>1 0 / 1\u003c/output>\u003c/label>\u003cinput id=\"c15-load\" type=\"range\" min=\"0\" max=\"1\" step=\"1\" value=\"1\" data-page=\"15\" data-key=\"load\" aria-label=\"Secondary load connected\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">v per turn ∝ dΦ/dt &nbsp;&nbsp; V₂/V₁ = N₂/N₁\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Applied primary AC voltage establishes a changing linked flux. That flux induces an emf in every linked turn of both windings.\u003c/p>\n  \u003cp>If the secondary is open, an induced voltage is present but no load current flows. Connect a load and that voltage drives current through the secondary circuit.\u003c/p>\n  \u003cp>Secondary current creates a magnetising effect opposing the original flux change. The primary draws an additional load-related current whose ampere-turns balance that effect. With fixed primary voltage and frequency, the main core flux remains approximately set by the applied voltage.\u003c/p>\n  \u003cp>A real unloaded transformer still draws a small magnetising current and supplies core losses. The ideal loaded calculations omit those contributions.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>If no secondary current flows, must the secondary voltage be zero?\u003c/p>\u003ctextarea data-note=\"15\" aria-label=\"Your explanation for lesson 16\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>No. An open secondary can have an induced voltage. Current requires a closed circuit; induced voltage requires changing linked flux.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"15\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p16\" data-scene=\"ratio\" aria-label=\"Lower voltage allows higher current at equal power.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 17 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">4 · Transformers · 17\u003c/div>\u003ch2>Lower voltage allows higher current at equal power.\u003c/h2>\u003cp class=\"lead\">Your 23 V result was correct. Now connect it to the missing current.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Lower voltage allows higher current at equal power.\">\u003ctitle>Lower voltage allows higher current at equal power.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"25\" y=\"65\" width=\"180\" height=\"180\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"115\" y=\"151\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Primary\u003c/text>\u003ctext x=\"115\" y=\"174\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">N₁ = 500, V₁ = 230 V\u003c/text>\u003crect x=\"395\" y=\"65\" width=\"180\" height=\"180\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"485\" y=\"151\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">Secondary\u003c/text>\u003ctext x=\"485\" y=\"174\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">N₂ = 50 turns\u003c/text>\u003cline x1=\"215\" y1=\"155\" x2=\"385\" y2=\"155\" stroke=\"#087f8c\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M376.819308252926,158.7518372218629 L385,155 L376.819308252926,151.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"300\" y=\"125\" font-size=\"14\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">equal power\u003c/text>\u003ctext x=\"115\" y=\"280\" font-size=\"20\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"700\">0.5 A input\u003c/text>\u003ctext x=\"485\" y=\"280\" font-size=\"20\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"700\">5 A output\u003c/text>\u003ctext x=\"485\" y=\"314\" font-size=\"20\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"700\">23 V output\u003c/text>\u003ctext x=\"300\" y=\"38\" font-size=\"14\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">ideal model · resistive secondary load\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>23 V\u003c/b>\u003cspan>secondary voltage\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0.5 A\u003c/b>\u003cspan>primary current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>115 W\u003c/b>\u003cspan>power on each side\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c16-n\">Secondary turns\u003coutput>50 \u003c/output>\u003c/label>\u003cinput id=\"c16-n\" type=\"range\" min=\"25\" max=\"250\" step=\"25\" value=\"50\" data-page=\"16\" data-key=\"n\" aria-label=\"Secondary turns\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c16-r\">Secondary load resistance\u003coutput>4.6 Ω\u003c/output>\u003c/label>\u003cinput id=\"c16-r\" type=\"range\" min=\"2.3\" max=\"23\" step=\"2.3\" value=\"4.6\" data-page=\"16\" data-key=\"r\" aria-label=\"Secondary load resistance\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">V₁I₁ = V₂I₂ &nbsp;&nbsp; I₁/I₂ = N₂/N₁ &nbsp;&nbsp; R\u003csub>in\u003c/sub> = (N₁/N₂)²R\u003csub>load\u003c/sub>\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>For the original 500:50 turns ratio and 230 V primary, the ideal secondary voltage is 23 V.\u003c/p>\n  \u003cp>If that secondary supplies 5 A to a resistive load, it delivers 23 × 5 = 115 W. The ideal primary must draw 115/230 = \u003cb>0.5 A\u003c/b>. Voltage is ten times smaller on the secondary, while current is ten times larger.\u003c/p>\n  \u003cp>The controls vary secondary turns and load resistance. Notice that current is determined by the actual connected load. A transformer does not force its rated maximum current into every load.\u003c/p>\n  \u003cp>The effective load resistance seen at the primary changes with the turns ratio squared. This explains how a supply can deliver the same useful power at different currents without changing the physical transmission cable resistance.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Keeping the turns ratio fixed, why does lowering secondary load resistance increase primary current?\u003c/p>\u003ctextarea data-note=\"16\" aria-label=\"Your explanation for lesson 17\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The same secondary voltage drives more secondary current and power. The primary supplies that added power through increased load-related current.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"16\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p17\" data-scene=\"dctransformer\" aria-label=\"Why normal transformers need changing flux.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 18 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">4 · Transformers · 18\u003c/div>\u003ch2>Why normal transformers need changing flux.\u003c/h2>\u003cp class=\"lead\">A coil can carry DC; a transformer cannot sustain normal energy transfer from steady DC.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Why normal transformers need changing flux.\">\u003ctitle>Why normal transformers need changing flux.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"25\" y=\"75\" width=\"165\" height=\"95\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107.5\" y=\"118.5\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">DC switched on\u003c/text>\u003ctext x=\"107.5\" y=\"141.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">brief changing current\u003c/text>\u003crect x=\"220\" y=\"75\" width=\"165\" height=\"95\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"118.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Flux changes\u003c/text>\u003ctext x=\"302.5\" y=\"141.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">transient secondary emf\u003c/text>\u003cline x1=\"193\" y1=\"123\" x2=\"215\" y2=\"123\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M206.81930825292602,126.7518372218629 L215,123 L206.81930825292602,119.2481627781371\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/path>\u003crect x=\"25\" y=\"228\" width=\"165\" height=\"95\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107.5\" y=\"271.5\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">DC held on\u003c/text>\u003ctext x=\"107.5\" y=\"294.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">real winding + core\u003c/text>\u003crect x=\"220\" y=\"228\" width=\"165\" height=\"95\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"271.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Flux settles\u003c/text>\u003ctext x=\"302.5\" y=\"294.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">no sustained emf\u003c/text>\u003cline x1=\"193\" y1=\"277\" x2=\"215\" y2=\"277\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M206.81930825292602,280.7518372218629 L215,277 L206.81930825292602,273.2481627781371\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"3\">\u003c/path>\u003crect x=\"420\" y=\"160\" width=\"155\" height=\"120\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"497.5\" y=\"216\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">Heating risk\u003c/text>\u003ctext x=\"497.5\" y=\"239\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">saturation + high current\u003c/text>\u003cline x1=\"389\" y1=\"273\" x2=\"420\" y2=\"245\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M416.4438919669144,253.26765357625874 L420,245 L411.41428210301353,247.69915694122565\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"300\" y=\"35\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">A field and a changing field do different jobs.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Switching transient\u003c/b>\u003cspan>can induce a secondary pulse\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Steady flux\u003c/b>\u003cspan>no sustained secondary emf\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">P\u003csub>in\u003c/sub> = P\u003csub>load\u003c/sub> + P\u003csub>copper\u003c/sub> + P\u003csub>core\u003c/sub> + other losses\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Connecting DC produces a switching transient. While the current and flux are changing, a secondary voltage can appear.\u003c/p>\n  \u003cp>With steady DC applied to a real winding, the flux can be driven towards saturation. Inductive opposition then falls; winding resistance limits a potentially excessive current. Once flux is steady, no sustained secondary emf is produced.\u003c/p>\n  \u003cp>So “coils only work in DC” is not a useful rule. Coils are used with both AC and DC. What matters here is whether the linked flux continues changing, and whether the core remains in its intended operating range.\u003c/p>\n  \u003cp>Real transformer losses include \u003cb>copper heating\u003c/b> in windings, \u003cb>eddy-current heating\u003c/b> in the core and \u003cb>hysteresis loss\u003c/b> from repeated magnetisation. Laminations reduce eddy currents; suitable core materials reduce magnetic losses.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Explain why a DC electromagnet can work while an ordinary transformer needs changing flux.\u003c/p>\u003ctextarea data-note=\"17\" aria-label=\"Your explanation for lesson 18\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>A DC electromagnet needs a sustained magnetic field. A transformer needs a sustained rate of change of linked flux to induce its secondary voltage. These are different requirements.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"17\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p18\" data-scene=\"force\" aria-label=\"Current and field can produce force.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 19 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">5 · Machines · 19\u003c/div>\u003ch2>Current and field can produce force.\u003c/h2>\u003cp class=\"lead\">A motor and a generator exchange electrical and mechanical energy.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Current and field can produce force.\">\u003ctitle>Current and field can produce force.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"70\" y1=\"100\" x2=\"525\" y2=\"100\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M516.819308252926,103.7518372218629 L525,100 L516.819308252926,96.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"70\" y1=\"160\" x2=\"525\" y2=\"160\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M516.819308252926,163.7518372218629 L525,160 L516.819308252926,156.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"70\" y1=\"220\" x2=\"525\" y2=\"220\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M516.819308252926,223.7518372218629 L525,220 L516.819308252926,216.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003cline x1=\"70\" y1=\"280\" x2=\"525\" y2=\"280\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/line>\u003cpath d=\"M516.819308252926,283.7518372218629 L525,280 L516.819308252926,276.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/path>\u003ccircle cx=\"300\" cy=\"190\" r=\"29\" fill=\"white\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/circle>\u003ccircle cx=\"300\" cy=\"190\" r=\"6\" fill=\"#6952b8\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/circle>\u003cline x1=\"300\" y1=\"190\" x2=\"300\" y2=\"109\" stroke=\"#d8692d\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M303.7518372218629,117.18069174707396 L300,109 L296.2481627781371,117.18069174707396\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"300\" y=\"35\" font-size=\"17\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">Field B →\u003c/text>\u003ctext x=\"300\" y=\"338\" font-size=\"14\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"400\">dot: current out of page · cross: into page\u003c/text>\u003ctext x=\"380\" y=\"85\" font-size=\"18\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">force ↑\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Upward\u003c/b>\u003cspan>force direction for B to the right\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>2\u003c/b>\u003cspan>force magnitude, relative units\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c18-i\">Conductor current\u003coutput>2 A\u003c/output>\u003c/label>\u003cinput id=\"c18-i\" type=\"range\" min=\"-4\" max=\"4\" step=\"0.5\" value=\"2\" data-page=\"18\" data-key=\"i\" aria-label=\"Conductor current\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">|F| = BIl sin θ &nbsp;&nbsp; torque = turning effect of force\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A current-carrying conductor in a magnetic field experiences a force. With suitable geometry, forces on conductors combine into a turning effect: \u003cb>torque\u003c/b>.\u003c/p>\n  \u003cp>In motor operation, electrical input produces mechanical output. In generator operation, mechanical input produces electrical output. The same basic field interactions are involved.\u003c/p>\n  \u003cp>When a generator is open-circuit, its load current is nearly zero. Connect a load: induced voltage drives current, which creates its own magnetic field. Its interaction with the machine field produces an electromagnetic torque opposing the driving motion.\u003c/p>\n  \u003cp>The turbine must supply more torque to hold speed. The original rotor field does not have to become stronger. “All the quantities rise together” is not a general law: geometry, direction and what is held fixed matter.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>If conductor current reverses while the magnetic field stays fixed, what happens to force?\u003c/p>\u003ctextarea data-note=\"18\" aria-label=\"Your explanation for lesson 19\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The force direction reverses. Its magnitude stays the same for the same current magnitude, field and geometry. The diagram uses B to the right and positive current out of the page.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"18\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p19\" data-scene=\"torque\" aria-label=\"Speed is not power.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 20 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">5 · Machines · 20\u003c/div>\u003ch2>Speed is not power.\u003c/h2>\u003cp class=\"lead\">At the same speed, more turning force means more mechanical power.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Speed is not power.\">\u003ctitle>Speed is not power.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ccircle cx=\"300\" cy=\"180\" r=\"95\" fill=\"#edf5f3\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/circle>\u003cpath d=\"M300 180 L300 90\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cpath d=\"M300 180 L370 230\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ccircle cx=\"300\" cy=\"180\" r=\"12\" fill=\"#087f8c\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/circle>\u003cline x1=\"205\" y1=\"180\" x2=\"205\" y2=\"96\" stroke=\"#d8692d\" stroke-width=\"7\">\u003c/line>\u003cpath d=\"M208.7518372218629,104.18069174707396 L205,96 L201.2481627781371,104.18069174707396\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"7\">\u003c/path>\u003ctext x=\"95\" y=\"83\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">torque T\u003c/text>\u003cline x1=\"380\" y1=\"100\" x2=\"425\" y2=\"165\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M417.2587373556966,160.40948230894242 L425,165 L423.42819989196494,156.13831593767975\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/path>\u003ctext x=\"443\" y=\"150\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"start\" font-weight=\"400\">speed ω\u003c/text>\u003ctext x=\"300\" y=\"325\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">More torque at the same speed → more power.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>100 N·m\u003c/b>\u003cspan>required torque\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>100 rad/s\u003c/b>\u003cspan>shaft speed\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>10 kW\u003c/b>\u003cspan>mechanical power\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c19-p\">Mechanical power\u003coutput>10 kW\u003c/output>\u003c/label>\u003cinput id=\"c19-p\" type=\"range\" min=\"5\" max=\"30\" step=\"1\" value=\"10\" data-page=\"19\" data-key=\"p\" aria-label=\"Mechanical power\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c19-w\">Shaft speed\u003coutput>100 rad/s\u003c/output>\u003c/label>\u003cinput id=\"c19-w\" type=\"range\" min=\"50\" max=\"200\" step=\"10\" value=\"100\" data-page=\"19\" data-key=\"w\" aria-label=\"Shaft speed\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">P\u003csub>mechanical\u003c/sub> = Tω &nbsp;&nbsp; T\u003csub>drive\u003c/sub> − T\u003csub>opposing\u003c/sub> = J dω/dt\u003c/div>\u003cdiv class=\"analogy\">\u003cb>Picture it.\u003c/b> Pedal harder to climb while keeping the same pedalling rate. Limit: a generator’s opposing torque is electromagnetic, rather than a bicycle’s road load.\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Angular speed ω\u003c/b> tells you how quickly the shaft rotates. \u003cb>Torque T\u003c/b> tells you how strongly it is being driven or resisted.\u003c/p>\n  \u003cp>A generator can provide more output power at the same rotational speed if its turbine supplies more torque. This is how increased demand can be supported while retaining normal grid frequency.\u003c/p>\n  \u003cp>At 100 rad/s, supplying 10 kW requires 100 N·m in a lossless model. Supplying 20 kW at that same speed requires 200 N·m.\u003c/p>\n  \u003cp>Changing speed requires a net torque imbalance. Maintaining constant speed requires driving and opposing torques to balance. Real machines need extra input to cover losses.\u003c/p>\u003cdiv class=\"analogy pdfonly\">\u003cb>Picture it.\u003c/b> Pedal harder to climb while keeping the same pedalling rate. Limit: a generator’s opposing torque is electromagnetic, rather than a bicycle’s road load.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>A shaft doubles its delivered power without changing speed. What changes?\u003c/p>\u003ctextarea data-note=\"19\" aria-label=\"Your explanation for lesson 20\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Its transmitted torque doubles in the lossless model. Speed alone does not specify power.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"19\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p20\" data-scene=\"rotating\" aria-label=\"Three phases can create a rotating field.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 21 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">5 · Machines · 21\u003c/div>\u003ch2>Three phases can create a rotating field.\u003c/h2>\u003cp class=\"lead\">Stationary windings can produce a field whose direction turns.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Three phases can create a rotating field.\">\u003ctitle>Three phases can create a rotating field.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ccircle cx=\"300\" cy=\"180\" r=\"120\" fill=\"#f8fafb\" stroke=\"#dbe2e6\" stroke-width=\"28\">\u003c/circle>\u003ccircle cx=\"300\" cy=\"180\" r=\"70\" fill=\"white\" stroke=\"#dbe2e6\" stroke-width=\"2\">\u003c/circle>\u003cline x1=\"300\" y1=\"180\" x2=\"343.0746401766566\" y2=\"180\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M334.8939484295826,183.7518372218629 L343.0746401766566,180 L334.8939484295826,176.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"450\" y=\"180\" font-size=\"19\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">A\u003c/text>\u003cline x1=\"300\" y1=\"180\" x2=\"292.68253601053914\" y2=\"167.32578058769815\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M300.0220682290734,172.53454885026244 L292.68253601053914,167.32578058769815 L293.5236955390788,176.28638607212534\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"225.00000000000003\" y=\"50.0961894323342\" font-size=\"19\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">B\u003c/text>\u003cline x1=\"300\" y1=\"180\" x2=\"328.8547840777892\" y2=\"130.02204793583974\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M328.0136245492495,138.98265342026693 L328.8547840777892,130.02204793583974 L321.5152518592549,135.23081619840403\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003ctext x=\"224.99999999999994\" y=\"309.90381056766574\" font-size=\"19\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">C\u003c/text>\u003cline x1=\"300\" y1=\"180\" x2=\"368.2015136130396\" y2=\"113.86715233040111\" stroke=\"#13263a\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M364.94029382274954,122.25550410410615 L368.2015136130396,113.86715233040111 L359.71672162328446,116.86853615966844\" fill=\"none\" stroke=\"#13263a\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"300\" y=\"35\" font-size=\"14\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Three stationary windings → a rotating resultant\u003c/text>\u003ctext x=\"300\" y=\"350\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Equivalent two-pole vector illustration; slowed animation.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>1,500 rpm\u003c/b>\u003cspan>synchronous speed at 50 Hz\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>4\u003c/b>\u003cspan>poles in the speed calculation\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c20-poles\">Number of poles\u003coutput>4 \u003c/output>\u003c/label>\u003cinput id=\"c20-poles\" type=\"range\" min=\"2\" max=\"8\" step=\"2\" value=\"4\" data-page=\"20\" data-key=\"poles\" aria-label=\"Number of poles\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">n\u003csub>s\u003c/sub> = 120f / number of poles &nbsp; (rpm)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Three stator winding groups are arranged at different positions. Their AC currents are separated by 120° in time. The changing contributions add to a rotating magnetic field.\u003c/p>\n  \u003cp>The \u003cb>stator\u003c/b> is the stationary part. The \u003cb>rotor\u003c/b> is the moving part inside it. Their fields interact across an air gap.\u003c/p>\n  \u003cp>The rotating field speed depends on electrical frequency and the number of poles. At 50 Hz, a four-pole machine has a synchronous speed of 1500 rpm. A two-pole machine has 3000 rpm.\u003c/p>\n  \u003cp>The animation shows an equivalent two-pole field direction at greatly slowed speed. It is a field-vector illustration, not a detailed winding construction.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>At the same supply frequency, why does adding more poles reduce synchronous mechanical speed?\u003c/p>\u003ctextarea data-note=\"20\" aria-label=\"Your explanation for lesson 21\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>More electrical cycles correspond to one mechanical revolution. The rotor therefore turns through fewer revolutions each second for the same electrical frequency.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"20\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p21\" data-scene=\"slip\" aria-label=\"Induction motors need relative motion.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 22 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">5 · Machines · 22\u003c/div>\u003ch2>Induction motors need relative motion.\u003c/h2>\u003cp class=\"lead\">Slip is a speed difference, not a delay between two events.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Induction motors need relative motion.\">\u003ctitle>Induction motors need relative motion.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ccircle cx=\"165\" cy=\"173\" r=\"92\" fill=\"#edf5f3\" stroke=\"#087f8c\" stroke-width=\"12\">\u003c/circle>\u003ccircle cx=\"165\" cy=\"173\" r=\"63\" fill=\"#f4f0fb\" stroke=\"#6952b8\" stroke-width=\"5\">\u003c/circle>\u003cline x1=\"165\" y1=\"173\" x2=\"201.2876897140462\" y2=\"101.70341119508517\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M200.92062461287188,110.69592270252845 L201.2876897140462,101.70341119508517 L194.23329472111854,107.29228507841421\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/path>\u003cline x1=\"165\" y1=\"173\" x2=\"191.02002347753339\" y2=\"124.54426372214934\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M190.45522790769127,133.5265243487559 L191.02002347753339,124.54426372214934 L183.84439027205445,129.97660098160114\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/path>\u003ctext x=\"165\" y=\"300\" font-size=\"14\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"400\">field: 1500 rpm\u003c/text>\u003ctext x=\"165\" y=\"326\" font-size=\"14\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"400\">rotor: 1470 rpm\u003c/text>\u003cline x1=\"335\" y1=\"90\" x2=\"335\" y2=\"280\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"335\" y1=\"280\" x2=\"545\" y2=\"280\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"335\" y=\"76\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">relative torque\u003c/text>\u003ctext x=\"545\" y=\"304\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">slip: 0 → 1\u003c/text>\u003cpath d=\"M335.00,280.00L336.31,269.22L337.63,258.49L338.94,247.90L340.25,237.48L341.56,227.31L342.88,217.43L344.19,207.88L345.50,198.72L346.81,189.96L348.13,181.65L349.44,173.80L350.75,166.43L352.06,159.54L353.38,153.14L354.69,147.24L356.00,141.82L357.31,136.87L358.63,132.39L359.94,128.35L361.25,124.74L362.56,121.54L363.88,118.73L365.19,116.28L366.50,114.18L367.81,112.41L369.13,110.93L370.44,109.74L371.75,108.80L373.06,108.11L374.38,107.63L375.69,107.36L377.00,107.27L378.31,107.35L379.63,107.59L380.94,107.96L382.25,108.46L383.56,109.08L384.88,109.79L386.19,110.60L387.50,111.49L388.81,112.44L390.13,113.47L391.44,114.55L392.75,115.68L394.06,116.85L395.38,118.05L396.69,119.29L398.00,120.56L399.31,121.85L400.63,123.15L401.94,124.47L403.25,125.81L404.56,127.15L405.88,128.49L407.19,129.84L408.50,131.19L409.81,132.54L411.13,133.88L412.44,135.22L413.75,136.56L415.06,137.89L416.38,139.21L417.69,140.52L419.00,141.82L420.31,143.11L421.63,144.39L422.94,145.65L424.25,146.91L425.56,148.15L426.88,149.38L428.19,150.59L429.50,151.79L430.81,152.98L432.13,154.15L433.44,155.31L434.75,156.45L436.06,157.58L437.38,158.69L438.69,159.79L440.00,160.88L441.31,161.95L442.63,163.01L443.94,164.05L445.25,165.08L446.56,166.09L447.88,167.09L449.19,168.08L450.50,169.05L451.81,170.01L453.13,170.96L454.44,171.89L455.75,172.81L457.06,173.72L458.38,174.61L459.69,175.49L461.00,176.36L462.31,177.22L463.63,178.07L464.94,178.90L466.25,179.72L467.56,180.53L468.88,181.33L470.19,182.12L471.50,182.90L472.81,183.67L474.13,184.42L475.44,185.17L476.75,185.90L478.06,186.63L479.38,187.35L480.69,188.05L482.00,188.75L483.31,189.43L484.63,190.11L485.94,190.78L487.25,191.44L488.56,192.09L489.88,192.74L491.19,193.37L492.50,193.99L493.81,194.61L495.13,195.22L496.44,195.82L497.75,196.42L499.06,197.00L500.38,197.58L501.69,198.15L503.00,198.72L504.31,199.27L505.63,199.82L506.94,200.37L508.25,200.90L509.56,201.43L510.88,201.95L512.19,202.47L513.50,202.98L514.81,203.48L516.13,203.98L517.44,204.47L518.75,204.96L520.06,205.44L521.38,205.91L522.69,206.38L524.00,206.84L525.31,207.30L526.63,207.75L527.94,208.20L529.25,208.64L530.56,209.08L531.88,209.51L533.19,209.94L534.50,210.36L535.81,210.78L537.13,211.19L538.44,211.60L539.75,212.00L541.06,212.40L542.38,212.79L543.69,213.18L545.00,213.57\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ccircle cx=\"339.2\" cy=\"245.7965796579658\" r=\"6\" fill=\"#13263a\" stroke=\"#13263a\" stroke-width=\"2\">\u003c/circle>\u003ctext x=\"300\" y=\"35\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Relative motion induces the rotor current.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>2%\u003c/b>\u003cspan>slip\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>1 Hz\u003c/b>\u003cspan>rotor induced electrical frequency\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Nonzero\u003c/b>\u003cspan>steady induction torque\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c21-rpm\">Rotor speed\u003coutput>1470 rpm\u003c/output>\u003c/label>\u003cinput id=\"c21-rpm\" type=\"range\" min=\"0\" max=\"1500\" step=\"10\" value=\"1470\" data-page=\"21\" data-key=\"rpm\" aria-label=\"Rotor speed\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">s = (n\u003csub>s\u003c/sub> − n\u003csub>r\u003c/sub>)/n\u003csub>s\u003c/sub> &nbsp;&nbsp; f\u003csub>rotor\u003c/sub> = sf\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>The rotating stator field sweeps past rotor conductors. This changing linkage induces rotor voltage. A closed conducting rotor path allows current; current and field then produce torque.\u003c/p>\n  \u003cp>If the rotor catches up exactly, the ideal fundamental field stops changing relative to it. Rotor induced voltage and current disappear in steady state, so sustained induction torque becomes zero.\u003c/p>\n  \u003cp>At 50 Hz with four poles, the field runs at 1500 rpm. A rotor at 1470 rpm has 30 rpm relative speed and 2% slip. Rotor electrical frequency is sf = 1 Hz.\u003c/p>\n  \u003cp>More load normally means slightly greater slip on the stable motoring branch. Torque does not rise indefinitely with slip. The plotted curve is illustrative, not a prediction for a specified motor; losses and spatial harmonics are omitted.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Explain the full chain from zero slip to zero sustained induction torque.\u003c/p>\u003ctextarea data-note=\"21\" aria-label=\"Your explanation for lesson 22\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Zero relative speed → no changing fundamental flux linkage in the rotor → no induced rotor emf → no steady induced rotor current → no induction torque.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"21\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p22\" data-scene=\"synchronous\" aria-label=\"A synchronous rotor has its own field.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 23 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">5 · Machines · 23\u003c/div>\u003ch2>A synchronous rotor has its own field.\u003c/h2>\u003cp class=\"lead\">It can maintain torque without inducing its rotor field through slip.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A synchronous rotor has its own field.\">\u003ctitle>A synchronous rotor has its own field.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003ccircle cx=\"175\" cy=\"185\" r=\"100\" fill=\"#edf5f3\" stroke=\"#087f8c\" stroke-width=\"12\">\u003c/circle>\u003ccircle cx=\"175\" cy=\"185\" r=\"68\" fill=\"#f4f0fb\" stroke=\"#6952b8\" stroke-width=\"5\">\u003c/circle>\u003cline x1=\"175\" y1=\"185\" x2=\"244.51931637176813\" y2=\"131.04571702633783\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M240.35694806989042,139.0253592563832 L244.51931637176813,131.04571702633783 L235.75631881671976,133.09751473815453\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/path>\u003cline x1=\"175\" y1=\"185\" x2=\"233.50542935976785\" y2=\"171.69155398142917\" stroke=\"#6952b8\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M226.3607000266871,177.16447301582164 L233.50542935976785,171.69155398142917 L224.69632925543286,169.84771143072007\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"175\" y=\"316\" font-size=\"13\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">equal speed, fixed angular offset\u003c/text>\u003ctext x=\"300\" y=\"35\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Rotor field exists independently of slip.\u003c/text>\u003cline x1=\"335\" y1=\"90\" x2=\"335\" y2=\"280\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"335\" y1=\"280\" x2=\"545\" y2=\"280\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"335\" y=\"76\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">relative torque\u003c/text>\u003ctext x=\"545\" y=\"304\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">angle: 0° → 90°\u003c/text>\u003cpath d=\"M335.00,280.00L336.31,278.22L337.63,276.45L338.94,274.67L340.25,272.90L341.56,271.12L342.88,269.35L344.19,267.57L345.50,265.80L346.81,264.03L348.13,262.26L349.44,260.50L350.75,258.73L352.06,256.97L353.38,255.21L354.69,253.45L356.00,251.69L357.31,249.94L358.63,248.19L359.94,246.44L361.25,244.70L362.56,242.96L363.88,241.22L365.19,239.49L366.50,237.76L367.81,236.03L369.13,234.31L370.44,232.59L371.75,230.88L373.06,229.17L374.38,227.47L375.69,225.77L377.00,224.08L378.31,222.40L379.63,220.71L380.94,219.04L382.25,217.37L383.56,215.71L384.88,214.05L386.19,212.40L387.50,210.75L388.81,209.11L390.13,207.48L391.44,205.86L392.75,204.24L394.06,202.63L395.38,201.03L396.69,199.44L398.00,197.85L399.31,196.27L400.63,194.70L401.94,193.14L403.25,191.58L404.56,190.04L405.88,188.50L407.19,186.97L408.50,185.45L409.81,183.94L411.13,182.44L412.44,180.95L413.75,179.47L415.06,178.00L416.38,176.53L417.69,175.08L419.00,173.64L420.31,172.21L421.63,170.79L422.94,169.37L424.25,167.97L425.56,166.58L426.88,165.21L428.19,163.84L429.50,162.48L430.81,161.14L432.13,159.80L433.44,158.48L434.75,157.17L436.06,155.87L437.38,154.58L438.69,153.31L440.00,152.05L441.31,150.80L442.63,149.56L443.94,148.33L445.25,147.12L446.56,145.92L447.88,144.74L449.19,143.56L450.50,142.40L451.81,141.26L453.13,140.12L454.44,139.00L455.75,137.90L457.06,136.80L458.38,135.72L459.69,134.66L461.00,133.61L462.31,132.57L463.63,131.55L464.94,130.54L466.25,129.54L467.56,128.56L468.88,127.60L470.19,126.65L471.50,125.71L472.81,124.79L474.13,123.89L475.44,123.00L476.75,122.12L478.06,121.26L479.38,120.41L480.69,119.58L482.00,118.77L483.31,117.97L484.63,117.19L485.94,116.42L487.25,115.67L488.56,114.93L489.88,114.21L491.19,113.51L492.50,112.82L493.81,112.15L495.13,111.49L496.44,110.86L497.75,110.23L499.06,109.63L500.38,109.04L501.69,108.46L503.00,107.90L504.31,107.36L505.63,106.84L506.94,106.33L508.25,105.84L509.56,105.37L510.88,104.91L512.19,104.47L513.50,104.05L514.81,103.64L516.13,103.25L517.44,102.88L518.75,102.52L520.06,102.19L521.38,101.87L522.69,101.56L524.00,101.28L525.31,101.01L526.63,100.75L527.94,100.52L529.25,100.30L530.56,100.10L531.88,99.92L533.19,99.75L534.50,99.61L535.81,99.47L537.13,99.36L538.44,99.27L539.75,99.19L541.06,99.13L542.38,99.08L543.69,99.06L545.00,99.05\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ccircle cx=\"393.3333333333333\" cy=\"203.52621930406391\" r=\"6\" fill=\"#13263a\" stroke=\"#13263a\" stroke-width=\"2\">\u003c/circle>\u003ctext x=\"450\" y=\"322\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">idealised stable range\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>42.26%\u003c/b>\u003cspan>of model maximum torque\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Own rotor field\u003c/b>\u003cspan>permanent magnet or DC excitation\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c22-angle\">Rotor field lag\u003coutput>25 electrical °\u003c/output>\u003c/label>\u003cinput id=\"c22-angle\" type=\"range\" min=\"0\" max=\"85\" step=\"5\" value=\"25\" data-page=\"22\" data-key=\"angle\" aria-label=\"Rotor field lag\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Simple model: T = T\u003csub>max\u003c/sub> sin δ &nbsp;&nbsp; same steady speed, different field angle\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A synchronous machine establishes rotor magnetisation independently, usually using permanent magnets or DC excitation. It does not need a speed difference to keep inducing that rotor field.\u003c/p>\n  \u003cp>During stable motor operation, the rotor field turns at the same speed as the stator field but with an \u003cb>angular offset\u003c/b>. Their tendency to align creates torque.\u003c/p>\n  \u003cp>A moderate load increase briefly changes motion and increases the offset. Once settled, the rotor again runs at synchronous speed with a larger angle and torque. It does not maintain a continuing speed difference.\u003c/p>\n  \u003cp>The simple sinusoidal torque-angle curve applies to an idealised round-rotor or equivalent two-pole model at fixed field magnitudes. A real motor has limits; excessive load can cause loss of synchronism.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>What does this motor have that the basic induction rotor does not have at zero slip?\u003c/p>\u003ctextarea data-note=\"22\" aria-label=\"Your explanation for lesson 23\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>An independently established rotor field. Its interaction at an angular offset permits torque while the rotor and stator field have equal speed. Angles shown are an equivalent two-pole electrical view.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"22\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p23\" data-scene=\"frequency\" aria-label=\"A demand step borrows rotational energy.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 24 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">6 · Power systems · 24\u003c/div>\u003ch2>A demand step borrows rotational energy.\u003c/h2>\u003cp class=\"lead\">Matching the new demand stops a fall. Extra input is needed to regain speed.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A demand step borrows rotational energy.\">\u003ctitle>A demand step borrows rotational energy.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"65\" x2=\"55\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"305\" x2=\"550\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"55\" y=\"51\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">frequency (Hz)\u003c/text>\u003ctext x=\"550\" y=\"329\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">simulation time (s; ¼ real-time)\u003c/text>\u003cline x1=\"55\" y1=\"161\" x2=\"550\" y2=\"161\" stroke=\"#dbe2e6\" stroke-width=\"2\" stroke-dasharray=\"5 5\">\u003c/line>\u003cpath d=\"M55,161L104.5,161L154,161L203.5,185L253,209L302.5,209\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ctext x=\"550\" y=\"52\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">50 Hz reference\u003c/text>\u003ctext x=\"300\" y=\"342\" font-size=\"13\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Preview: a load step followed by matching input.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>49 Hz\u003c/b>\u003cspan>frequency at end of preview\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0 Hz/s\u003c/b>\u003cspan>approximate rate with these inputs\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0 pu\u003c/b>\u003cspan>mechanical minus electrical power\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c23-pm\">Mechanical input\u003coutput>1 pu\u003c/output>\u003c/label>\u003cinput id=\"c23-pm\" type=\"range\" min=\"0.5\" max=\"1.5\" step=\"0.05\" value=\"1\" data-page=\"23\" data-key=\"pm\" aria-label=\"Mechanical input\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c23-pe\">Electrical demand\u003coutput>1 pu\u003c/output>\u003c/label>\u003cinput id=\"c23-pe\" type=\"range\" min=\"0.5\" max=\"1.5\" step=\"0.05\" value=\"1\" data-page=\"23\" data-key=\"pe\" aria-label=\"Electrical demand\">\u003c/div>\u003cdiv class=\"labbuttons\">\u003cbutton data-freq=\"run\">Run / pause\u003c/button>\u003cbutton data-freq=\"step\">Add load\u003c/button>\u003cbutton data-freq=\"match\">Match load\u003c/button>\u003cbutton data-freq=\"recover\">Recover\u003c/button>\u003cbutton data-freq=\"reset\">Reset\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">E\u003csub>rotation\u003c/sub> = ½Jω² &nbsp;&nbsp; near 50 Hz: df/dt ≈ f₀(P\u003csub>m\u003c/sub> − P\u003csub>e\u003c/sub>)/(2H)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>In this island model there is one synchronous generator and no storage. If electrical demand exceeds mechanical input, the rotor supplies the shortfall from stored kinetic energy. Its speed and electrical frequency fall.\u003c/p>\n  \u003cp>\u003cb>Match load\u003c/b> raises mechanical input to the new electrical demand. The frequency stops falling, but remains below its original value in this simplified model.\u003c/p>\n  \u003cp>\u003cb>Recover\u003c/b> briefly raises mechanical input above demand. The surplus restores rotational energy and speed. Match the powers again when frequency reaches 50 Hz.\u003c/p>\n  \u003cp>A real power system uses governor and secondary control, includes losses and frequency-sensitive loads, and may have many generators and storage devices. This small-signal swing model isolates inertia and power imbalance.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Why does merely matching the larger load fail to restore the lost frequency immediately?\u003c/p>\u003ctextarea data-note=\"23\" aria-label=\"Your explanation for lesson 24\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Equal input and output stop the kinetic energy from changing. Restoring lost kinetic energy requires a temporary positive power surplus. Here H = 5 s and powers use the same per-unit base.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"23\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p24\" data-scene=\"neutral\" aria-label=\"Balanced three-phase currents cancel in the neutral.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 25 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">6 · Power systems · 25\u003c/div>\u003ch2>Balanced three-phase currents cancel in the neutral.\u003c/h2>\u003cp class=\"lead\">The cancellation happens at every instant.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Balanced three-phase currents cancel in the neutral.\">\u003ctitle>Balanced three-phase currents cancel in the neutral.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"65\" x2=\"55\" y2=\"300\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"300\" x2=\"550\" y2=\"300\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"182.5\" x2=\"550\" y2=\"182.5\" stroke=\"#dbe2e6\" stroke-width=\"1\">\u003c/line>\u003ctext x=\"55\" y=\"51\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weig =\"start\" font-weight=\"400\">C\u003c/text>\u003ctext x=\"255\" y=\"35\" font-size=\"15\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">neutral\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>0 A\u003c/b>\u003cspan>neutral RMS current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>Balanced\u003c/b>\u003cspan>load condition\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c24-c\">Phase C RMS current\u003coutput>10 A\u003c/output>\u003c/label>\u003cinput id=\"c24-c\" type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"10\" data-page=\"24\" data-key=\"c\" aria-label=\"Phase C RMS current\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">i\u003csub>N\u003c/sub> = −(i\u003csub>A\u003c/sub> + i\u003csub>B\u003c/sub> + i\u003csub>C\u003c/sub>)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>In a star-connected system with a neutral, the neutral carries the signed sum needed to balance the three phase currents.\u003c/p>\n  \u003cp>Three equal sinusoidal currents separated by 120° sum to zero at every instant. Each phase still supplies its load; zero neutral current does not mean no power transfer.\u003c/p>\n  \u003cp>Reduce one phase load and the three currents no longer cancel. The neutral provides the return path for their imbalance.\u003c/p>\n  \u003cp>The controls change phase C only. Each full-load phase is 10 A RMS. Harmonics, non-sinusoidal loads, unequal phase angles and a missing neutral are outside this model.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>With phase C disconnected and the other two unchanged, is neutral RMS current 0 A, 10 A or 20 A?\u003c/p>\u003ctextarea data-note=\"24\" aria-label=\"Your explanation for lesson 25\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>10 A. The remaining two 10 A phasors are 120° apart; their resultant magnitude is 10 A. It is not the scalar sum of their magnitudes.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"24\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p25\" data-scene=\"powerflow\" aria-label=\"Equal magnitudes can still mean different voltages.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 26 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">6 · Power systems · 26\u003c/div>\u003ch2>Equal magnitudes can still mean different voltages.\u003c/h2>\u003cp class=\"lead\">A phase difference creates an instantaneous voltage difference across the line.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Equal magnitudes can still mean different voltages.\">\u003ctitle>Equal magnitudes can still mean different voltages.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"65\" x2=\"55\" y2=\"220\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"220\" x2=\"550\" y2=\"220\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"142.5\" x2=\"550\" y2=\"142.5\" stroke=\"#dbe2e6\" stroke-width=\"1\">\u003c/line>\u003ctext x=\"55\" y=\"51\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">equal-magnitude voltage waves\u003c/text>\u003ctext x=\"550\" y=\"244\" font-size=\"12\" style=\"fill:#65798a\" text-anc 206.88L423.16,207.03L426.25,207.08L429.34,207.03L432.44,206.88L435.53,206.64L438.63,206.29L441.72,205.84L444.81,205.30L447.91,204.66L451.00,203.92L454.09,203.09L457.19,202.17L460.28,201.15L463.38,200.04L466.47,198.85L469.56,197.57L472.66,196.20L475.75,194.75L478.84,193.22L481.94,191.61L485.03,189.92L488.13,188.17L491.22,186.34L494.31,184.44L497.41,182.48L500.50,180.46L503.59,178.38L506.69,176.24L509.78,174.06L512.88,171.82L515.97,169.54L519.06,167.21L522.16,164.85L525.25,162.46L528.34,160.03L531.44,157.58L534.53,155.10L537.63,152.60L540.72,150.09L543.81,147.57L546.91,145.04L550.00,142.50\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ctext x=\"60\" y=\"35\" font-size=\"15\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">A\u003c/text>\u003ctext x=\"115\" y=\"35\" font-size=\"15\" style=\"fill:#6952b8\" text-anchor=\"start\" font-weight=\"400\">B\u003c/text>\u003crect x=\"55\" y=\"275\" width=\"110\" height=\"55\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"110\" y=\"307.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">A\u003c/text>\u003crect x=\"435\" y=\"275\" width=\"110\" height=\"55\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"490\" y=\"307.5\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">B\u003c/text>\u003cline x1=\"180\" y1=\"302\" x2=\"420\" y2=\"302\" stroke=\"#d8692d\" stroke-width=\"5\">\u003c/line>\u003cpath d=\"M411.819308252926,305.7518372218629 L420,302 L411.819308252926,298.2481627781371\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"5\">\u003c/path>\u003ctext x=\"300\" y=\"254\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">230 V RMS per phase at both ends · X = 10 Ω\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>918.6 W\u003c/b>\u003cspan>real power A → B, per phase\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>4.01 A\u003c/b>\u003cspan>line RMS current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>A → B\u003c/b>\u003cspan>real power direction\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c25-angle\">A leads B by\u003coutput>10 °\u003c/output>\u003c/label>\u003cinput id=\"c25-angle\" type=\"range\" min=\"-60\" max=\"60\" step=\"5\" value=\"10\" data-page=\"25\" data-key=\"angle\" aria-label=\"A leads B by\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Per phase: I = (V\u003csub>A\u003c/sub> − V\u003csub>B\u003c/sub>)/(jX) &nbsp;&nbsp; P\u003csub>A→B\u003c/sub> = (V\u003csub>A\u003c/sub>V\u003csub>B\u003c/sub>/X) sin δ\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>Two AC voltages can have equal RMS magnitudes but reach their peaks at different times. Their phasors are different, so their difference is not zero.\u003c/p>\n  \u003cp>That voltage difference drives line current. For a line modelled as pure inductive reactance X, real power transfer depends on the sine of the phase difference δ.\u003c/p>\n  \u003cp>For ordinary small phase differences, real power flows from the leading-voltage end towards the lagging end. Reversing the phase lead reverses power flow.\u003c/p>\n  \u003cp>If both voltage magnitudes and phase angles are equal, current is zero in this simple series-only line model. Equal phase alone would not guarantee zero current if magnitudes differed. Line resistance, charging and network constraints are omitted.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>At equal magnitudes, what changes when the lead moves from +10° to −10°?\u003c/p>\u003ctextarea data-note=\"25\" aria-label=\"Your explanation for lesson 26\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The real power reverses direction. The magnitude is unchanged in this symmetric model. The phase-difference slider is not the same angle as a load’s voltage-current power-factor angle.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"25\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p26\" data-scene=\"map\" aria-label=\"Follow the energy through the entire system.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 27 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">6 · Power systems · 27\u003c/div>\u003ch2>Follow the energy through the entire system.\u003c/h2>\u003cp class=\"lead\">Each device follows the same energy accounting, with a different physical mechanism.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"See the mechanism. Then use the equation.\">\u003ctitle>See the mechanism. Then use the equation.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"32\" y=\"44\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107\" y=\"75\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Turbine\u003c/text>\u003ctext x=\"107\" y=\"98\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">mechanical input\u003c/text>\u003crect x=\"32\" y=\"230\" width=\"150\" height=\"75\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"107\" y=\"263.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Generator\u003c/text>\u003ctext x=\"107\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">rotation ↔ electricity\u003c/text>\u003crect x=\"225\" y=\"45\" width=\"155\" height=\"70\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"76\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">Transformer\u003c/text>\u003ctext x=\"302.5\" y=\"99\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">changing linked flux\u003c/text>\u003crect x=\"420\" y=\"45\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#2974c412\" stroke=\"#2974c4\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"495\" y=\"76\" font-size=\"16\" style=\"fill:#2974c4\" text-anchor=\"middle\" font-weight=\"600\">Transmission\u003c/text>\u003ctext x=\"495\" y=\"99\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">phase + current\u003c/text>\u003crect x=\"420\" y=\"230\" width=\"150\" height=\"75\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"495\" y=\"263.5\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">Workshop\u003c/text>\u003ctext x=\"495\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">motor + heater\u003c/text>\u003crect x=\"225\" y=\"230\" width=\"155\" height=\"75\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"302.5\" y=\"263.5\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">Energy stores\u003c/text>\u003ctext x=\"302.5\" y=\"286.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">rotation + fields\u003c/text>\u003cline x1=\"108\" y1=\"116\" x2=\"108\" y2=\"225\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M104.2481627781371,216.81930825292602 L108,225 L111.7518372218629,216.81930825292602\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"182\" y1=\"258\" x2=\"235\" y2=\"120\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M235.56942595777704,128.981968274193 L235,120 L228.56459697344044,126.29170786716519\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"382\" y1=\"80\" x2=\"415\" y2=\"80\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M406.819308252926,83.7518372218629 L415,80 L406.819308252926,76.2481627781371\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"495\" y1=\"117\" x2=\"495\" y2=\"225\" stroke=\"#2974c4\" stroke-width=\"3\">\u003c/line>\u003cpath d=\"M491.2481627781371,216.81930825292602 L495,225 L498.7518372218629,216.81930825292602\" fill=\"none\" stroke=\"#2974c4\" stroke-width=\"3\">\u003c/path>\u003cline x1=\"188\" y1=\"267\" x2=\"220\" y2=\"267\" stroke=\"#087f8c\" stroke-width=\"2\" stroke-dasharray=\"5 4\">\u003c/line>\u003ctext x=\"300\" y=\"178\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"700\">ENERGY IS ACCOUNTED FOR\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>6 stages\u003c/b>\u003cspan>one physical story\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>10/30\u003c/b>\u003cspan>baseline; final test at the end\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">Input energy = useful output + losses + increase in stored energy\u003c/div>\u003csmall class=\"note\">Schematic illustration; real equipment includes additional effects.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Turbine → generator:\u003c/b> mechanical torque drives a rotor; electromagnetic interaction supplies electrical power and creates opposing torque.\u003c/p>\n  \u003cp>\u003cb>Transformer → line:\u003c/b> changing flux links windings. Raising transmission voltage allows lower current for a chosen useful power, reducing cable heating.\u003c/p>\n  \u003cp>\u003cb>Line → workshop:\u003c/b> voltage magnitudes and phase angles determine current and power transfer. Resistive loads dissipate energy; motor loads convert part of it into mechanical output.\u003c/p>\n  \u003cp>\u003cb>When a motor is added:\u003c/b> its electrical and mechanical transients increase demand. Generator inertia initially buffers a shortfall. Mechanical input must then increase to sustain the new load.\u003c/p>\n  \u003cp>Connect the local mechanism to the whole-system consequence. No stage creates energy; real equipment also dissipates some as heat.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Explain a motor switching on, from rotor currents and torque to generator frequency and turbine response.\u003c/p>\u003ctextarea data-note=\"26\" aria-label=\"Your explanation for lesson 27\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The motor requires current to establish fields and produce torque. Added electrical demand initially exceeds unchanged mechanical input. Stored generator rotation supplies the difference and frequency falls. More turbine torque sustains the load; a temporary input surplus restores the lost rotational energy.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"26\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p27\" data-scene=\"practice\" aria-label=\"Practise explaining, not just recognising.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 28 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">Review and references · 28\u003c/div>\u003ch2>Practise explaining, not just recognising.\u003c/h2>\u003cp class=\"lead\">Write your own explanation before opening each model answer.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Practise explaining, not just recognising.\">\u003ctitle>Practise explaining, not just recognising.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003crect x=\"30\" y=\"55\" width=\"245\" height=\"100\" rx=\"12\" fill=\"#087f8c12\" stroke=\"#087f8c\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"152.5\" y=\"101\" font-size=\"16\" style=\"fill:#087f8c\" text-anchor=\"middle\" font-weight=\"600\">1. State the conditions\u003c/text>\u003ctext x=\"152.5\" y=\"124\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">What is fixed? Which model?\u003c/text>\u003crect x=\"325\" y=\"55\" width=\"245\" height=\"100\" rx=\"12\" fill=\"#6952b812\" stroke=\"#6952b8\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"447.5\" y=\"101\" font-size=\"16\" style=\"fill:#6952b8\" text-anchor=\"middle\" font-weight=\"600\">2. Follow the mechanism\u003c/text>\u003ctext x=\"447.5\" y=\"124\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">What changes, and why?\u003c/text>\u003crect x=\"165\" y=\"225\" width=\"270\" height=\"95\" rx=\"12\" fill=\"#d8692d12\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/rect>\u003ctext x=\"300\" y=\"268.5\" font-size=\"16\" style=\"fill:#d8692d\" text-anchor=\"middle\" font-weight=\"600\">3. Check the consequence\u003c/text>\u003ctext x=\"300\" y=\"291.5\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"middle\"
