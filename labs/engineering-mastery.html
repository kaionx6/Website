06,229.11L423.16,229.19L426.25,229.22L429.34,229.19L432.44,229.11L435.53,228.96L438.63,228.77L441.72,228.51L444.81,228.20L447.91,227.84L451.00,227.42L454.09,226.95L457.19,226.42L460.28,225.85L463.38,225.22L466.47,224.54L469.56,223.81L472.66,223.03L475.75,222.21L478.84,221.34L481.94,220.42L485.03,219.46L488.13,218.46L491.22,217.42L494.31,216.35L497.41,215.23L500.50,214.08L503.59,212.90L506.69,211.69L509.78,210.44L512.88,209.17L515.97,207.87L519.06,206.55L522.16,205.21L525.25,203.85L528.34,202.47L531.44,201.07L534.53,199.66L537.63,198.24L540.72,196.82L543.81,195.38L546.91,193.94L550.00,192.50\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ctext x=\"65\" y=\"37\" font-size=\"15\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">flux Φ\u003c/text>\u003ctext x=\"200\" y=\"37\" font-size=\"15\" style=\"fill:#6952b8\" text-anchor=\"start\" font-weight=\"400\">induced emf −dΦ/dt\u003c/text>\u003cline x1=\"141.70382165605096\" y1=\"75\" x2=\"141.70382165605096\" y2=\"310\" stroke=\"#d8692d\" stroke-width=\"1.5\">\u003c/line>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>Changes with slope\u003c/b>\u003cspan>induced emf\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>1\u003c/b>\u003cspan>variation rate; zero = steady flux\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c9-speed\">Rate of variation\u003coutput>1 relative\u003c/output>\u003c/label>\u003cinput id=\"c9-speed\" type=\"range\" min=\"0\" max=\"3\" step=\"0.25\" value=\"1\" data-page=\"9\" data-key=\"speed\" aria-label=\"Rate of variation\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">e = −N dΦ/dt &nbsp;&nbsp; (linked flux per turn, with a consistent winding direction)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>\u003cb>Faraday’s law:\u003c/b> changing the flux linked by a winding induces an electromotive force, measured in volts. A greater rate of change or more linked turns produces a larger induced voltage.\u003c/p>\n  \u003cp>A stationary coil in a steady field has no changing flux and therefore no induced emf. Move a magnet, change a nearby current or rotate the coil, and the linked flux can change.\u003c/p>\n  \u003cp>\u003cb>Lenz’s law:\u003c/b> the induced effect opposes the change that caused it. If a closed conducting loop allows current to flow, that current creates a field opposing the flux change.\u003c/p>\n  \u003cp>Voltage and current are separate: an open secondary can have an induced voltage while carrying no load current. The minus sign describes direction, rather than a reduction in the amount of voltage.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>At the maximum of a sinusoidal flux, is the induced voltage largest or zero?\u003c/p>\u003ctextarea data-note=\"9\" aria-label=\"Your explanation for lesson 10\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>Zero at that instant: the flux curve has zero slope at its maximum. The largest induced voltage occurs at the steepest flux changes.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"9\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p10\" data-scene=\"rl\" aria-label=\"An inductor opposes changes in its own current.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 11 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 11\u003c/div>\u003ch2>An inductor opposes changes in its own current.\u003c/h2>\u003cp class=\"lead\">Changing current creates changing flux, which induces an opposing emf.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"An inductor opposes changes in its own current.\">\u003ctitle>An inductor opposes changes in its own current.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"65\" x2=\"55\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"305\" x2=\"550\" y2=\"305\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"55\" y=\"51\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">current (A)\u003c/text>\u003ctext x=\"550\" y=\"329\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">time, 0 → 3 s\u003c/text>\u003cpath d=\"M55.00,305.00L58.09,300.73L61.19,296.55L64.28,292.44L67.38,288.41L70.47,284.45L73.56,280.57L76.66,276.76L79.75,273.02L82.84,269.35L85.94,265.74L89.03,262.21L92.13,258.74L95.22,255.33L98.31,251.99L101.41,248.71L104.50,245.49L107.59,242.33L110.69,239.23L113.78,236.18L116.88,233.20L119.97,230.27L123.06,227.39L126.16,224.57L129.25,221.79L132.34,219.07L135.44,216.41L138.53,213.79L141.63,211.22L144.72,208.69L147.81,206.22L150.91,203.79L154.00,201.40L157.09,199.06L160.19,196.76L163.28,194.51L166.38,192.30L169.47,190.12L172.56,187.99L175.66,185.90L178.75,183.85L181.84,181.83L184.94,179.86L188.03,177.92L191.13,176.01L194.22,174.14L197.31,172.31L200.41,170.51L203.50,168.74L206.59,167.01L209.69,165.30L212.78,163.63L215.88,161.99L218.97,160.39L222.06,158.81L225.16,157.26L228.25,155.74L231.34,154.24L234.44,152.78L237.53,151.34L240.63,149.93L243.72,148.55L246.81,147.19L249.91,145.85L253.00,144.54L256.09,143.26L259.19,142.00L262.28,140.76L265.38,139.55L268.47,138.36L271.56,137.19L274.66,136.04L277.75,134.91L280.84,133.81L283.94,132.72L287.03,131.66L290.13,130.61L293.22,129.58L296.31,128.58L299.41,127.59L302.50,126.62L305.59,125.67L308.69,124.73L311.78,123.82L314.88,122.92L317.97,122.04L321.06,121.17L324.16,120.32L327.25,119.48L330.34,118.66L333.44,117.86L336.53,117.07L339.63,116.30L342.72,115.54L345.81,114.79L348.91,114.06L352.00,113.34L355.09,112.64L358.19,111.94L361.28,111.27L364.38,110.60L367.47,109.94L370.56,109.30L373.66,108.67L376.75,108.05L379.84,107.45L382.94,106.85L386.03,106.27L389.13,105.69L392.22,105.13L395.31,104.58L398.41,104.04L401.50,103.50L404.59,102.98L407.69,102.47L410.78,101.97L413.88,101.47L416.97,100.99L420.06,100.51L423.16,100.05L426.25,99.59L429.34,99.14L432.44,98.70L435.53,98.26L438.63,97.84L441.72,97.42L444.81,97.01L447.91,96.61L451.00,96.22L454.09,95.83L457.19,95.45L460.28,95.08L463.38,94.71L466.47,94.35L469.56,94.00L472.66,93.65L475.75,93.32L478.84,92.98L481.94,92.66L485.03,92.33L488.13,92.02L491.22,91.71L494.31,91.41L497.41,91.11L500.50,90.82L503.59,90.53L506.69,90.25L509.78,89.97L512.88,89.70L515.97,89.44L519.06,89.18L522.16,88.92L525.25,88.67L528.34,88.42L531.44,88.18L534.53,87.94L537.63,87.71L540.72,87.48L543.81,87.26L546.91,87.03L550.00,86.82\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ctext x=\"560\" y=\"65\" font-size=\"11\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">2.09 A\u003c/text>\u003ctext x=\"300\" y=\"35\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">With resistance: approaches V/R\u003c/text>\u003cline x1=\"55\" y1=\"75.38639349281686\" x2=\"550\" y2=\"75.38639349281686\" stroke=\"#d8692d\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\">\u003c/line>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>2 A/s\u003c/b>\u003cspan>initial current slope\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>2 A\u003c/b>\u003cspan>steady current in this model\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>1 s\u003c/b>\u003cspan>time constant\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c10-l\">Inductance\u003coutput>1 H\u003c/output>\u003c/label>\u003cinput id=\"c10-l\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\" data-page=\"10\" data-key=\"l\" aria-label=\"Inductance\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c10-r\">Series resistance\u003coutput>1 Ω\u003c/output>\u003c/label>\u003cinput id=\"c10-r\" type=\"range\" min=\"0\" max=\"4\" step=\"0.25\" value=\"1\" data-page=\"10\" data-key=\"r\" aria-label=\"Series resistance\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">v\u003csub>L\u003c/sub> = L di/dt &nbsp;&nbsp; V = L di/dt + Ri &nbsp;&nbsp; τ = L/R (R &gt; 0)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A coil’s own current establishes flux through its turns. If that current changes, the linked flux changes too. The coil therefore induces an emf in its own winding: \u003cb>self-induction\u003c/b>.\u003c/p>\n  \u003cp>For a linear ideal inductor, the terminal voltage under the passive sign convention is v = L di/dt. A finite voltage gives a finite current slope. An instantaneous current jump would require an impulse of voltage.\u003c/p>\n  \u003cp>With zero resistance and constant voltage, current ramps upward. Add series resistance and the resistor takes an increasing share of the supply voltage, so the current approaches V/R.\u003c/p>\n  \u003cp>The graph uses a 2 V DC supply. Increasing L slows the initial rise. This mechanism is not electrons simply taking time to accelerate.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>For an ideal 1 H coil with 2 V applied, how fast does current rise? What is the ideal coil voltage when current is steady?\u003c/p>\u003ctextarea data-note=\"10\" aria-label=\"Your explanation for lesson 11\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The rise is 2 A per second. When current is steady, di/dt = 0 and the ideal inductive voltage is zero. A real coil still needs a resistive drop to maintain steady current.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"10\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p11\" data-scene=\"decay\" aria-label=\"A magnetic field can store energy.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 12 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 12\u003c/div>\u003ch2>A magnetic field can store energy.\u003c/h2>\u003cp class=\"lead\">A coil can return energy it received earlier.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"A magnetic field can store energy.\">\u003ctitle>A magnetic field can store energy.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"58\" x2=\"55\" y2=\"228\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"228\" x2=\"550\" y2=\"228\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003ctext x=\"55\" y=\"44\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">current (A)\u003c/text>\u003ctext x=\"550\" y=\"252\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">0 → 5 seconds\u003c/text>\u003cpath d=\"M55.00,68.63L58.09,73.53L61.19,78.28L64.28,82.89L67.38,87.35L70.47,91.68L73.56,95.87L76.66,99.94L79.75,103.88L82.84,107.70L85.94,111.40L89.03,114.99L92.13,118.46L95.22,121.83L98.31,125.10L101.41,128.27L104.50,131.33L107.59,134.31L110.69,137.19L113.78,139.98L116.88,142.69L119.97,145.32L123.06,147.86L126.16,150.33L129.25,152.72L132.34,155.03L135.44,157.28L138.53,159.45L141.63,161.56L144.72,163.61L147.81,165.59L150.91,167.51L154.00,169.37L157.09,171.17L160.19,172.92L163.28,174.62L166.38,176.26L169.47,177.85L172.56,179.39L175.66,180.89L178.75,182.34L181.84,183.74L184.94,185.10L188.03,186.42L191.13,187.70L194.22,188.94L197.31,190.15L200.41,191.31L203.50,192.44L206.59,193.53L209.69,194.59L212.78,195.62L215.88,196.62L218.97,197.58L222.06,198.52L225.16,199.43L228.25,200.30L231.34,201.16L234.44,201.98L237.53,202.78L240.63,203.56L243.72,204.31L246.81,205.04L249.91,205.75L253.00,206.43L256.09,207.09L259.19,207.74L262.28,208.36L265.38,208.97L268.47,209.55L271.56,210.12L274.66,210.67L277.75,211.20L280.84,211.72L283.94,212.22L287.03,212.71L290.13,213.18L293.22,213.63L296.31,214.07L299.41,214.50L302.50,214.92L305.59,215.32L308.69,215.71L311.78,216.09L314.88,216.45L317.97,216.81L321.06,217.15L324.16,217.49L327.25,217.81L330.34,218.12L333.44,218.43L336.53,218.72L339.63,219.01L342.72,219.29L345.81,219.55L348.91,219.81L352.00,220.07L355.09,220.31L358.19,220.55L361.28,220.78L364.38,221.00L367.47,221.21L370.56,221.42L373.66,221.62L376.75,221.82L379.84,222.01L382.94,222.19L386.03,222.37L389.13,222.55L392.22,222.71L395.31,222.88L398.41,223.03L401.50,223.19L404.59,223.34L407.69,223.48L410.78,223.62L413.88,223.75L416.97,223.88L420.06,224.01L423.16,224.13L426.25,224.25L429.34,224.37L432.44,224.48L435.53,224.59L438.63,224.69L441.72,224.79L444.81,224.89L447.91,224.99L451.00,225.08L454.09,225.17L457.19,225.26L460.28,225.34L463.38,225.42L466.47,225.50L469.56,225.58L472.66,225.65L475.75,225.73L478.84,225.80L481.94,225.86L485.03,225.93L488.13,225.99L491.22,226.06L494.31,226.12L497.41,226.17L500.50,226.23L503.59,226.28L506.69,226.34L509.78,226.39L512.88,226.44L515.97,226.49L519.06,226.53L522.16,226.58L525.25,226.62L528.34,226.66L531.44,226.70L534.53,226.74L537.63,226.78L540.72,226.82L543.81,226.86L546.91,226.89L550.00,226.93\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003ccircle cx=\"154\" cy=\"169.3692140633014\" r=\"6\" fill=\"#d8692d\" stroke=\"#d8692d\" stroke-width=\"2\">\u003c/circle>\u003crect x=\"55\" y=\"279\" width=\"495\" height=\"30\" rx=\"6\" fill=\"#f6dfce\">\u003c/rect>\u003crect x=\"55\" y=\"279\" width=\"66.99096520212328\" height=\"30\" rx=\"6\" fill=\"#087f8c\">\u003c/rect>\u003ctext x=\"55\" y=\"268\" font-size=\"13\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">remaining field energy\u003c/text>\u003ctext x=\"550\" y=\"268\" font-size=\"13\" style=\"fill:#d8692d\" text-anchor=\"end\" font-weight=\"400\">heat transferred\u003c/text>\u003ctext x=\"300\" y=\"345\" font-size=\"15\" style=\"fill:#13263a\" text-anchor=\"middle\" font-weight=\"400\">Total accounted energy = 4.5 J\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>1.1 A\u003c/b>\u003cspan>current now\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>0.61 J\u003c/b>\u003cspan>field energy left\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>3.89 J\u003c/b>\u003cspan>heat released\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c11-r\">Loop resistance\u003coutput>1 Ω\u003c/output>\u003c/label>\u003cinput id=\"c11-r\" type=\"range\" min=\"0\" max=\"3\" step=\"0.25\" value=\"1\" data-page=\"11\" data-key=\"r\" aria-label=\"Loop resistance\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"c11-time\">Time after supply removal\u003coutput>1 s\u003c/output>\u003c/label>\u003cinput id=\"c11-time\" type=\"range\" min=\"0\" max=\"5\" step=\"0.1\" value=\"1\" data-page=\"11\" data-key=\"time\" aria-label=\"Time after supply removal\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">E = ½LI² &nbsp;&nbsp; i(t) = I₀ exp(−Rt/L) &nbsp;&nbsp; P\u003csub>heat\u003c/sub> = i²R\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>As a coil’s current rises, the supply does work establishing its magnetic field. In a linear inductor, stored energy is ½LI².\u003c/p>\n  \u003cp>Start with a 1 H inductor carrying 3 A. It stores 4.5 J. In a closed ideal loop with no resistance or source, that current persists with zero terminal voltage: nothing dissipates the stored energy.\u003c/p>\n  \u003cp>Put resistance into the closed loop and current decays. The field shrinks while electrical energy is transferred into heat. The inductor’s voltage polarity supports the existing current while it is falling.\u003c/p>\n  \u003cp>Simply opening an energised real coil is different from providing a closed decay path: its voltage may rise sharply. This model assumes the closed loop remains intact.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>If current halves, what fraction of the original field energy remains?\u003c/p>\u003ctextarea data-note=\"11\" aria-label=\"Your explanation for lesson 12\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>One quarter. Stored energy depends on current squared. In a resistance-free ideal loop neither current nor stored energy decays.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"11\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p12\" data-scene=\"rms\" aria-label=\"AC timing and RMS are different ideas.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 13 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 13\u003c/div>\u003ch2>AC timing and RMS are different ideas.\u003c/h2>\u003cp class=\"lead\">Phase describes timing. RMS describes equivalent resistive heating.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"AC timing and RMS are different ideas.\">\u003ctitle>AC timing and RMS are different ideas.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"62\" x2=\"55\" y2=\"302\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"302\" x2=\"550\" y2=\"302\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"182\" x2=\"550\" y2=\"182\" stroke=\"#dbe2e6\" stroke-width=\"1\">\u003c/line>\u003ctext x=\"55\" y=\"48\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">current (A)\u003c/text>\u003ctext x=\"550\" y=\"326\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">one cycle →\u003c/text>\u003cpath d=\"M55.00,182.00L58.09,179.06L61.19,176.12L64.28,173.18L67.38,170.27L70.47,167.37L73.56,164.49L76.66,161.64L79.75,158.82L82.84,156.04L85.94,153.30L89.03,150.60L92.13,147.95L95.22,145.35L98.31,142.81L101.41,140.33L104.50,137.92L107.59,135.57L110.69,133.29L113.78,131.09L116.88,128.97L119.97,126.93L123.06,124.97L126.16,123.10L129.25,121.32L132.34,119.64L135.44,118.05L138.53,116.56L141.63,115.17L144.72,113.89L147.81,112.71L150.91,111.64L154.00,110.67L157.09,109.82L160.19,109.07L163.28,108.44L166.38,107.92L169.47,107.52L172.56,107.23L175.66,107.06L178.75,107.00L181.84,107.06L184.94,107.23L188.03,107.52L191.13,107.92L194.22,108.44L197.31,109.07L200.41,109.82L203.50,110.67L206.59,111.64L209.69,112.71L212.78,113.89L215.88,115.17L218.97,116.56L222.06,118.05L225.16,119.64L228.25,121.32L231.34,123.10L234.44,124.97L237.53,126.93L240.63,128.97L243.72,131.09L246.81,133.29L249.91,135.57L253.00,137.92L256.09,140.33L259.19,142.81L262.28,145.35L265.38,147.95L268.47,150.60L271.56,153.30L274.66,156.04L277.75,158.82L280.84,161.64L283.94,164.49L287.03,167.37L290.13,170.27L293.22,173.18L296.31,176.12L299.41,179.06L302.50,182.00L305.59,184.94L308.69,187.88L311.78,190.82L314.88,193.73L317.97,196.63L321.06,199.51L324.16,202.36L327.25,205.18L330.34,207.96L333.44,210.70L336.53,213.40L339.63,216.05L342.72,218.65L345.81,221.19L348.91,223.67L352.00,226.08L355.09,228.43L358.19,230.71L361.28,232.91L364.38,235.03L367.47,237.07L370.56,239.03L373.66,240.90L376.75,242.68L379.84,244.36L382.94,245.95L386.03,247.44L389.13,248.83L392.22,250.11L395.31,251.29L398.41,252.36L401.50,253.33L404.59,254.18L407.69,254.93L410.78,255.56L413.88,256.08L416.97,256.48L420.06,256.77L423.16,256.94L426.25,257.00L429.34,256.94L432.44,256.77L435.53,256.48L438.63,256.08L441.72,255.56L444.81,254.93L447.91,254.18L451.00,253.33L454.09,252.36L457.19,251.29L460.28,250.11L463.38,248.83L466.47,247.44L469.56,245.95L472.66,244.36L475.75,242.68L478.84,240.90L481.94,239.03L485.03,237.07L488.13,235.03L491.22,232.91L494.31,230.71L497.41,228.43L500.50,226.08L503.59,223.67L506.69,221.19L509.78,218.65L512.88,216.05L515.97,213.40L519.06,210.70L522.16,207.96L525.25,205.18L528.34,202.36L531.44,199.51L534.53,196.63L537.63,193.73L540.72,190.82L543.81,187.88L546.91,184.94L550.00,182.00\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003cline x1=\"55\" y1=\"128.96699141100893\" x2=\"550\" y2=\"128.96699141100893\" stroke=\"#d8692d\" stroke-width=\"2\" stroke-dasharray=\"6 5\">\u003c/line>\u003ctext x=\"63\" y=\"35\" font-size=\"14\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">sine current\u003c/text>\u003ctext x=\"300\" y=\"35\" font-size=\"14\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">positive RMS reference\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>10 A\u003c/b>\u003cspan>peak\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>7.07 A\u003c/b>\u003cspan>RMS\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>100 W\u003c/b>\u003cspan>average heat in 2 Ω\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c12-peak\">Peak current\u003coutput>10 A\u003c/output>\u003c/label>\u003cinput id=\"c12-peak\" type=\"range\" min=\"2\" max=\"15\" step=\"1\" value=\"10\" data-page=\"12\" data-key=\"peak\" aria-label=\"Peak current\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">I\u003csub>rms\u003c/sub> = √(average of i²) &nbsp;&nbsp; P\u003csub>R\u003c/sub> = I\u003csub>rms\u003c/sub>²R\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A sinusoidal current changes continuously. Its peak is its largest magnitude. Its RMS value is the steady DC current that would give the same average heating in the same resistor.\u003c/p>\n  \u003cp>Because heating depends on i², reversing current does not undo heating. Both halves of an AC cycle heat a resistor.\u003c/p>\n  \u003cp>For a sine wave, I\u003csub>rms\u003c/sub> = I\u003csub>peak\u003c/sub>/√2. A 10 A peak sine wave therefore heats a resistor like 7.07 A DC, not 10 A DC.\u003c/p>\n  \u003cp>\u003cb>Phase angle\u003c/b> represents timing relative to another wave of the same frequency. A 90° lead means a quarter-cycle earlier; 180° means half a cycle.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>Would 10 A peak AC and 10 A DC heat a 2 Ω resistor equally?\u003c/p>\u003ctextarea data-note=\"12\" aria-label=\"Your explanation for lesson 13\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>No. The sinusoid gives 100 W average; the DC gives 200 W. The AC is below its peak magnitude for most of the cycle.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"12\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p13\" data-scene=\"phasor\" aria-label=\"Phasors keep timing when you add waves.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 14 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 14\u003c/div>\u003ch2>Phasors keep timing when you add waves.\u003c/h2>\u003cp class=\"lead\">Add values at the same instant, or add the corresponding arrows.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Phasors keep timing when you add waves.\">\u003ctitle>Phasors keep timing when you add waves.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"50\" y1=\"190\" x2=\"390\" y2=\"190\" stroke=\"#dbe2e6\" stroke-width=\"2\">\u003c/line>\u003cline x1=\"195\" y1=\"40\" x2=\"195\" y2=\"320\" stroke=\"#dbe2e6\" stroke-width=\"2\">\u003c/line>\u003cline x1=\"195\" y1=\"190\" x2=\"267\" y2=\"190\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M258.819308252926,193.7518372218629 L267,190 L258.819308252926,186.2481627781371\" fill=\"none\" stroke=\"#087f8c\" stroke-width=\"4\">\u003c/path>\u003cline x1=\"195\" y1=\"190\" x2=\"195\" y2=\"94\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M198.7518372218629,102.18069174707396 L195,94 L191.2481627781371,102.18069174707396\" fill=\"none\" stroke=\"#6952b8\" stroke-width=\"4\">\u003c/path>\u003cline x1=\"195\" y1=\"190\" x2=\"267\" y2=\"94\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/line>\u003cpath d=\"M265.0930547292459,102.79565573077691 L267,94 L259.0901151742653,98.29345106454143\" fill=\"none\" stroke=\"#d8692d\" stroke-width=\"4\">\u003c/path>\u003cline x1=\"267\" y1=\"190\" x2=\"267\" y2=\"94\" stroke=\"#6952b8\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\">\u003c/line>\u003ctext x=\"60\" y=\"35\" font-size=\"14\" style=\"fill:#087f8c\" text-anchor=\"start\" font-weight=\"400\">A = 6 A RMS\u003c/text>\u003ctext x=\"290\" y=\"35\" font-size=\"14\" style=\"fill:#6952b8\" text-anchor=\"start\" font-weight=\"400\">B = 8 A RMS\u003c/text>\u003ctext x=\"450\" y=\"235\" font-size=\"18\" style=\"fill:#d8692d\" text-anchor=\"start\" font-weight=\"400\">sum\u003c/text>\u003ctext x=\"300\" y=\"342\" font-size=\"13\" style=\"fill:#65798a\" text-anchor=\"middle\" font-weight=\"400\">Arrow lengths use RMS values at one frequency.\u003c/text>\u003c/svg>\u003c/div>\u003cdiv class=\"metrics\" aria-live=\"polite\">\u003cdiv class=\"metric\">\u003cb>10 A\u003c/b>\u003cspan>resultant RMS current\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cb>90°\u003c/b>\u003cspan>B relative to A\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"c13-angle\">B leads A by\u003coutput>90 °\u003c/output>\u003c/label>\u003cinput id=\"c13-angle\" type=\"range\" min=\"0\" max=\"180\" step=\"5\" value=\"90\" data-page=\"13\" data-key=\"angle\" aria-label=\"B leads A by\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"equation\">|I\u003csub>sum\u003c/sub>| = √(I₁² + I₂² + 2I₁I₂ cos φ)\u003c/div>\u003csmall class=\"note\">Change a control, then explain the result. PDF: labelled default-state snapshot.\u003c/small>\u003c/div>\u003cdiv class=\"reading\">\u003cp>A phasor is an arrow representing a sinusoid’s magnitude and phase at one fixed frequency. The angle between arrows carries the relative timing information.\u003c/p>\n  \u003cp>For 6 A and 8 A RMS currents entering a junction, equal phase gives 14 A RMS. A 180° difference gives 2 A RMS. At 90°, perpendicular components give 10 A RMS.\u003c/p>\n  \u003cp>We add the \u003cb>signed instantaneous currents\u003c/b>; we do not average their separate peaks. The phasor sum is a shortcut to the resulting sinusoid.\u003c/p>\n  \u003cp>Your earlier 7.07 A misunderstanding was affected by wording. It is not being counted as evidence that you cannot add ordinary currents. Here each arrow and each waveform is labelled separately.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"check\">\u003cstrong>Explain it back\u003c/strong>\u003cp>At 90°, why is the total magnitude 10 A rather than 14 A?\u003c/p>\u003ctextarea data-note=\"13\" aria-label=\"Your explanation for lesson 14\" placeholder=\"Write or sketch your reasoning separately, then check it.\">\u003c/textarea>\u003cdetails>\u003csummary>Reveal explanation\u003c/summary>\u003cp>The currents do not reach their peaks together. Their phasors are perpendicular, so the resultant magnitude is √(6² + 8²) = 10 A.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"statusline\">\u003clabel>\u003cinput type=\"checkbox\" data-done=\"13\"> I can explain this without the notes\u003c/label>\u003cspan>Self-check, not a graded result\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" id=\"p14\" data-scene=\"acpower\" aria-label=\"Power can go into a coil and come back.\">\u003cdiv class=\"print-heading\">\u003cspan>ENGINEERING MASTERY · ELECTRICAL ENERGY SYSTEMS\u003c/span>\u003cspan>Lesson 15 / 31\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">3 · Induction and AC · 15\u003c/div>\u003ch2>Power can go into a coil and come back.\u003c/h2>\u003cp class=\"lead\">Zero average real power does not mean zero current.\u003c/p>\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"visual\">\u003cdiv class=\"drawing\">\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"Power can go into a coil and come back.\">\u003ctitle>Power can go into a coil and come back.\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\">\u003c/rect>\u003cline x1=\"55\" y1=\"68\" x2=\"55\" y2=\"303\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"303\" x2=\"550\" y2=\"303\" stroke=\"#65798a\" stroke-width=\"1.5\">\u003c/line>\u003cline x1=\"55\" y1=\"185.5\" x2=\"550\" y2=\"185.5\" stroke=\"#dbe2e6\" stroke-width=\"1\">\u003c/line>\u003ctext x=\"55\" y=\"54\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"start\" font-weight=\"400\">normalised traces\u003c/text>\u003ctext x=\"550\" y=\"327\" font-size=\"12\" style=\"fill:#65798a\" text-anchor=\"end\" font-weight=\"400\">one cycle →\u003c/text>\u003cpath d=\"M55.00,185.50L58.09,181.49L61.19,177.48L64.28,173.49L67.38,169.52L70.47,165.57L73.56,161.65L76.66,157.77L79.75,153.93L82.84,150.14L85.94,146.40L89.03,142.72L92.13,139.11L95.22,135.58L98.31,132.11L101.41,128.74L104.50,125.44L107.59,122.24L110.69,119.14L113.78,116.14L116.88,113.25L119.97,110.47L123.06,107.81L126.16,105.26L129.25,102.84L132.34,100.55L135.44,98.38L138.53,96.35L141.63,94.46L144.72,92.71L147.81,91.10L150.91,89.64L154.00,88.33L157.09,87.16L160.19,86.15L163.28,85.29L166.38,84.58L169.47,84.03L172.56,83.64L175.66,83.40L178.75,83.33L181.84,83.40L184.94,83.64L188.03,84.03L191.13,84.58L194.22,85.29L197.31,86.15L200.41,87.16L203.50,88.33L206.59,89.64L209.69,91.10L212.78,92.71L215.88,94.46L218.97,96.35L222.06,98.38L225.16,100.55L228.25,102.84L231.34,105.26L234.44,107.81L237.53,110.47L240.63,113.25L243.72,116.14L246.81,119.14L249.91,122.24L253.00,125.44L256.09,128.74L259.19,132.11L262.28,135.58L265.38,139.11L268.47,142.72L271.56,146.40L274.66,150.14L277.75,153.93L280.84,157.77L283.94,161
