action; loaded-generator mechanism incomplete.\"], [\"5b\", 0, 2, \"No induction/synchronous explanation.\"], [\"6a\", 1, 3, \"Identified stored rotation; frequency change and sustained input response omitted.\"], [\"6b\", 1, 2, \"Correct yes prediction, explicitly identified as a guess; mechanism absent.\"]], \"post\": [[\"Electrical relationships\", \"a) The voltage across an unchanged resistor is halved. What happens to its current and heating power? Explain. (2 marks)\", \"b) The transmission voltage is tripled while the same useful power is delivered through the same cables. What happens to cable current, cable resistance and cable heating? State what is fixed. (3 marks)\"], [\"Magnetic fields\", \"a) A current-controlled coil surrounds an iron ring with a small air gap. The gap is made wider while current stays unchanged. What happens to flux, and why? Explain what flux means. (3 marks)\", \"b) Why does increasing current eventually stop producing a proportional increase in flux? (2 marks)\"], [\"Inductors and energy\", \"a) A constant voltage is suddenly applied across an ideal coil. Can current change instantly? Explain the mechanism. (2 marks)\", \"b) Describe energy flow into and out of an ideal coil over one sinusoidal AC cycle. What is its average real power, and what changes in a real coil? (3 marks)\"], [\"Transformers\", \"a) An ideal transformer has 800 primary turns, 100 secondary turns and 240 V AC input. Find the secondary voltage. If the secondary supplies 4 A to a resistor, find the primary current and explain the energy accounting. (3 marks)\", \"b) Would steady DC sustain normal secondary voltage in this transformer? Explain, including what differs from the switching transient. (2 marks)\"], [\"Machines\", \"a) Why must a generator be driven with more torque when electrical load increases at unchanged speed? Explain the current-field-torque chain. (3 marks)\", \"b) Explain why a basic induction motor loses sustained torque at zero slip while a synchronous motor can produce torque at synchronous speed. (2 marks)\"], [\"Power network\", \"a) On an isolated generator network, electrical demand rises before turbine input responds. Where does the initial extra energy come from, what happens to frequency, and what change sustains the new load? (3 marks)\", \"b) Two equal-magnitude AC voltages have different phases across an inductive line. Can real power flow? Explain why, and which end supplies it for a small phase difference. (2 marks)\"]]};\n'use strict';\nconst $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));\nconst C={ink:'#13263a',muted:'#65798a',teal:'#087f8c',purple:'#6952b8',orange:'#d8692d',blue:'#2974c4',line:'#dbe2e6',pale:'#edf5f3'};\nconst stageNames=['Start here','1 · Electrical basics','2 · Fields and flux','3 · Induction and AC','4 · Transformers','5 · Machines','6 · Power systems','Review and references','Final assessment'];\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt=(n,d=2)=>Number(n).toLocaleString('en-IE',{maximumFractionDigits:d});\nconst rad=d=>d*Math.PI/180;\nlet state={page:0,notes:{},done:{},test:{},confidence:{},controls:{}};\nlet saveOK=true;try{state={...state,...JSON.parse(localStorage.getItem('ees-visual-workbook-v1')||'{}')}}catch(e){saveOK=false}\nlet running=false,time=1.1,frameLast=0,exam=false,examStart=0,timerHandle=null;\nconst freq={f:50,t:0,history:[[0,50]],run:false};\nfunction save(){try{localStorage.setItem('ees-visual-workbook-v1',JSON.stringify(state));saveOK=true}catch(e){saveOK=false}$('#saveStatus').textContent=saveOK?'Notes saved in this browser.':'Browser saving unavailable. Export your notes.'}\nfunction toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2600)}\nfunction text(x,y,s,size=15,color=C.ink,anchor='start',weight=400){return `\u003ctext x=\"${x}\" y=\"${y}\" font-size=\"${size}\" style=\"fill:${color}\" text-anchor=\"${anchor}\" font-weight=\"${weight}\">${esc(s)}\u003c/text>`}\nfunction line(x1,y1,x2,y2,color=C.line,width=2,dash=''){return `\u003cline x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${color}\" stroke-width=\"${width}\" ${dash?`stroke-dasharray=\"${dash}\"`:''}/>`}\nfunction arrow(x1,y1,x2,y2,color=C.teal,width=3){const a=Math.atan2(y2-y1,x2-x1),h=9;return line(x1,y1,x2,y2,color,width)+`\u003cpath d=\"M${x2-h*Math.cos(a-.43)},${y2-h*Math.sin(a-.43)} L${x2},${y2} L${x2-h*Math.cos(a+.43)},${y2-h*Math.sin(a+.43)}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"${width}\"/>`}\nfunction box(x,y,w,h,label,color=C.teal,sub=''){return `\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"12\" fill=\"${color}12\" stroke=\"${color}\" stroke-width=\"2\"/>`+text(x+w/2,y+h/2+(sub?-4:5),label,16,color,'middle',600)+(sub?text(x+w/2,y+h/2+19,sub,11,C.muted,'middle'):'')}\nfunction circle(x,y,r,fill='none',stroke=C.ink,width=2){return `\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"${width}\"/>`}\nfunction path(d,color=C.teal,width=3,fill='none'){return `\u003cpath d=\"${d}\" fill=\"${fill}\" stroke=\"${color}\" stroke-width=\"${width}\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`}\nfunction graph(fn,xmax=1,ymin=-1,ymax=1,color=C.teal,x=55,y=70,w=495,h=235){let d='';for(let i=0;i\u003c=160;i++){const xx=i/160*xmax,yy=fn(xx);d+=(i?'L':'M')+(x+w*i/160).toFixed(2)+','+(y+h*(ymax-yy)/(ymax-ymin)).toFixed(2)}return path(d,color,3)}\nfunction axes(ymin=-1,ymax=1,x=55,y=70,w=495,h=235,xlabel='time →',ylabel=''){let z=line(x,y,x,y+h,C.muted,1.5)+line(x,y+h,x+w,y+h,C.muted,1.5);if(ymin\u003c0&&ymax>0)z+=line(x,y+h*ymax/(ymax-ymin),x+w,y+h*ymax/(ymax-ymin),C.line,1);return z+text(x,y-14,ylabel,12,C.muted)+text(x+w,y+h+24,xlabel,12,C.muted,'end')}\nfunction metric(value,label){return `\u003cdiv class=\"metric\">\u003cb>${value}\u003c/b>\u003cspan>${esc(label)}\u003c/span>\u003c/div>`}\nfunction svg(content,title){return `\u003csvg viewBox=\"0 0 600 370\" role=\"img\" aria-label=\"${esc(title)}\">\u003ctitle>${esc(title)}\u003c/title>\u003crect width=\"600\" height=\"370\" fill=\"#ffffff\"/>${content}\u003c/svg>`}\nfunction ring(gap=0,flux=1,load=true){let s=`\u003crect x=\"145\" y=\"55\" width=\"310\" height=\"250\" rx=\"38\" fill=\"none\" stroke=\"#cbd5dc\" stroke-width=\"51\"/>`;\n if(gap>0)s+=`\u003crect x=\"421\" y=\"${174-gap/2}\" width=\"70\" height=\"${gap}\" fill=\"white\"/>`;\n for(let i=0;i\u003c7;i++)s+=path(`M115 ${102+i*22} Q180 ${85+i*22} 176 ${110+i*22}`,C.orange,5);\n for(let k=0;k\u003c3;k++){const v=11*k;let d=`M${176+v} ${87+v} H${418-v} V${273-v} H${176+v} Z`;s+=`\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${C.teal}\" stroke-width=\"${Math.max(1,2*flux)}\" opacity=\"${Math.min(1,.2+.65*flux)}\"/>`;}\n s+=arrow(280,87,345,87,C.teal,3)+text(300,181,'shared flux Φ',18,C.teal,'middle');\n if(load)for(let i=0;i\u003c5;i++)s+=path(`M424 ${114+i*25} Q484 ${101+i*25} 480 ${122+i*25}`,C.purple,5);\n return s;\n}\nfunction scene(kind,v={},t=1.1){let s='',m='';\n switch(kind){\n case'map':\n s=box(32,44,150,70,'Turbine',C.orange,'mechanical input')+box(32,230,150,75,'Generator',C.teal,'rotation ↔ electricity')+box(225,45,155,70,'Transformer',C.purple,'changing linked flux')+box(420,45,150,70,'Transmission',C.blue,'phase + current')+box(420,230,150,75,'Workshop',C.orange,'motor + heater')+box(225,230,155,75,'Energy stores',C.teal,'rotation + fields');\n s+=arrow(108,116,108,225,C.orange)+arrow(182,258,235,120,C.teal)+arrow(382,80,415,80,C.purple)+arrow(495,117,495,225,C.blue)+line(188,267,220,267,C.teal,2,'5 4')+text(300,178,'ENERGY IS ACCOUNTED FOR',12,C.muted,'middle',700);\n m=metric('6 stages','one physical story')+metric('10/30','baseline; final test at the end');break;\n case'score':{\n const vals=[3,1,0,3,1,2],labs=['Basics','Flux','Inductors','Transformers','Machines' l transformer supplies 12 V at 2 A from 240 V. Find input current and explain why it rises if output load increases.','Output is 24 W, so input current is 0.10 A at unity power factor. Increased secondary load current has an opposing magnetising effect; extra primary load current balances it and supplies the added output power.'],\n ['Two kinds of motor','Why does zero slip remove sustained basic induction torque but not all synchronous torque?','An induction rotor needs relative field motion to induce its steady current. A synchronous rotor has an independently established field; an angular offset produces torque at equal speed.'],\n ['Frequency and phase','Distinguish the cause of falling generator frequency from the cause of power flow between equal-magnitude AC voltages.','Frequency falls when mechanical input is below electrical demand and stored rotation supplies the shortfall. Equal-magnitude AC voltages can still have a phase difference that creates a line voltage difference and real power transfer.']\n];\n\nfunction values(i){const p=DATA.pages[i],v={};p.controls.forEach(c=>v[c.key]=state.controls[i]?.[c.key]??c.value);return v}\nfunction draw(i,t=time){const section=$(`#p${i}`),p=DATA.pages[i],res=scene(p.scene,values(i),t);section.querySelector('.drawing').innerHTML=res.html;section.querySelector('.metrics').innerHTML=res.metrics}\nfunction controlMarkup(c,i){const val=state.controls[i]?.[c.key]??c.value;return `\u003cdiv class=\"control\">\u003clabel for=\"c${i}-${c.key}\">${esc(c.label)}\u003coutput>${esc(val)} ${esc(c.unit)}\u003c/output>\u003c/label>\u003cinput id=\"c${i}-${c.key}\" type=\"range\" min=\"${c.min}\" max=\"${c.max}\" step=\"${c.step}\" value=\"${val}\" data-page=\"${i}\" data-key=\"${c.key}\" aria-label=\"${esc(c.label)}\">\u003c/div>`}\nfunction build(){\n $('#chapters').innerHTML=stageNames.map((name,stage)=>`\u003ca class=\"chapter\" href=\"#p${DATA.pages.findIndex(p=>p.stage===stage)}\" data-stage=\"${stage}\">${esc(name)}\u003csmall =false;$('#leaveTest').hidden=false;examStart=Date.now();$('#motion').textContent='▶ Animate';clearInterval(timerHandle);timerHandle=setInterval(()=>{const elapsed=Math.floor((Date.now()-examStart)/1000),remaining=Math.max(0,1200-elapsed);$('#timer').textContent=remaining?`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')} remaining`:'20 minutes reached — finish your explanation';},1000);window.scrollTo(0,0)}\nfunction leaveExam(){if(window.EESNarration)window.EESNarration.stop();exam=false;document.body.classList.remove('exam-mode');$('#beginTest').hidden=false;$('#endTest').hidden=true;$('#leaveTest').hidden=true;clearInterval(timerHandle);$('#timer').textContent='Timer stopped. Answers retained.'}\nfunction exportAnswers(){let out='ELECTRICAL ENERGY SYSTEMS — VISUAL WORKBOOK\\nKelvin Gao\\nBaseline assessment: 10/30 (33.3%)\\nExported: '+new Date().toISOString()+'\\n\\nFINAL ASSESSMENT\\n';DATA.post.forEach((q,k)=>{out+=`\\n${k+1}. ${q[0]}\\n${q[1]}\\n${q[2]}\\nConfidence: ${state.confidence[k]||'Not stated'}\\n${state.test[k]||'[Unanswered]'}\\n`});out+='\\nLEARNING NOTES\\n';DATA.pages.forEach((p,i)=>{if(state.notes[i])out+=`\\n${i+1}. ${p.title}\\n${state.notes[i]}\\n`});practice.forEach((q,k)=>{if(state.notes['practice'+k])out+=`\\nPractice ${k+1}. ${q[0]}\\n${state.notes['practice'+k]}\\n`});out+='\\nBASELINE MARKING RECORD\\n';DATA.rubric.forEach(r=>out+=`${r[0]}: ${r[1]}/${r[2]} — ${r[3]}\\n`);out+='\\nORIGINAL BASELINE ANSWERS\\n'+DATA.baseline;const b=new Blob([out],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Electrical_Energy_Answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Answers exported. Send them back for grading.')}\ndocument.addEventListener('input',e=>{const el=e.target;if(el.matches('input[type=range][data-page]'))setControl(+el.dataset.page,el.dataset.key,el.value);if(el.dataset.note!==undefined){state.note ,'TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(state.page+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(state.page-1)}});\nfunction tick(now){const dt=Math.min(.05,(now-(frameLast||now))/1000);frameLast=now;if(running&&!document.hidden){time+=dt;const kinds=['circuit','faraday','transformer','rotating','slip','synchronous'];if(kinds.includes(DATA.pages[state.page].scene))draw(state.page)}if(freq.run&&!document.hidden&&DATA.pages[state.page].scene==='frequency'){const i=state.page,v=values(i);freq.t+=dt*.25;freq.f+=5*((v.pm??1)-(v.pe??1))*dt*.25;if(freq.f\u003c47||freq.f>52){freq.f=Math.max(47,Math.min(52,freq.f));freq.run=false;toast('Model range reached. Reset to repeat the experiment.')}if(freq.history.length===1||freq.t-freq.history.at(-1)[0]>.09){freq.history.push([freq.t,freq.f]);draw(i)}if(freq.t>30){freq.run=false;toast('30-second run complete. Reset to repeat.')}}requestAnimationFrame(tick)}\nbuild();show(Number.isInteger(state.page)?state.page:0);requestAnimationFrame(tick);\nwindow.EES={DATA,scene,show,values,setControl,preparePrint,state,freq,exportAnswers};\ndocument.documentElement.classList.add('workbook-ready');\n\n\n// Browser-native narration. Keep each utterance short and retain a reference\n// until its end event. Generation tokens discard events from cancelled audio.\nconst speechEngine=('speechSynthesis' in window)?window.speechSynthesis:null;\nconst narration={supported:!!(speechEngine&&window.SpeechSynthesisUtterance),phase:'idle',chunks:[],index:0,token:0,utterance:null,highlight:null,voices:[],selection:false,nextTimer:null,pendingRestart:false};\nstate.narration={rate:1,voice:'',autoNext:false,...state.narration};\nconst equationSpeech={\n circuit:'Current is charge per unit time. Voltage is energy per unit charge. Power equals voltage times current. Energy equals power times time.',\n fixed:'For fixed resistance, current equals voltage divided by resistance. Heating power equals voltage squared divided by resistance. For fixed power, current equals power divided by voltage.',\n transmission:'Cable current equals load power divided by load voltage, at unity power factor. Cable heating equals current squared times cable resistance.',\n coil:'The magnetising drive is the number of turns times the coil current, measured in ampere turns.',\n flux:'For a uniform field, magnetic flux equals field strength times surface area times the cosine of the angle between the field and the surface normal.',\n gap:'Flux is approximately the number of turns times current, divided by total reluctance. Reluctance is magnetic path length divided by permeability times cross-sectional area.',\n saturation:'Before saturation the relationship is roughly proportional. Near saturation the incremental permeability decreases.',\n faraday:'Induced electromotive force equals minus the number of linked turns times the rate of change of magnetic flux. The minus sign expresses opposition to the change.',\n rl:'Inductor terminal voltage equals inductance times the rate of change of current. With series resistance, supply voltage equals inductive voltage plus current times resistance. The time constant is inductance divided by resistance, when resistance is greater than zero.',\n decay:'Stored energy equals one half times inductance times current squared. With resistance, current decays exponentially. Heating power equals current squared times resistance.',\n rms:'Root mean square current is the square root of the average of current squared. Average resistive heating equals RMS current squared times resistance.',\n phasor:'The resultant current magnitude is the square root of: current one squared, plus current two squared, plus twice current one times current two times the cosine of their phase difference.',\n acpower:'Real power equals RMS voltage times RMS current times the cosine of their phase difference. Reactive power uses the sine instead. Apparent power equals RMS voltage times RMS current.',\n transformer:'Induced voltage per turn depends on the rate of change of flux. Secondary voltage divided by primary voltage equals secondary turns divided by primary turns.',\n ratio:'For an ideal transformer, primary power equals secondary power. The current ratio is the inverse of the voltage ratio. Input resistance equals the turns ratio squared times the load resistance.',\n dctransformer:'Input power equals load power plus copper losses, core losses and other losses.',\n force:'Force magnitude equals flux density times current times conductor length times the sine of their angle. Torque is the turning effect of force.',\n torque:'Mechanical power equals torque times angular speed. Driving torque minus opposing torque equals rotational inertia times angular acceleration.',\n rotating:'Synchronous speed in revolutions per minute equals one hundred and twenty times supply frequency, divided by the number of poles.',\n slip:'Slip equals synchronous speed minus rotor speed, divided by synchronous speed. Rotor electrical frequency equals slip times supply frequency.',\n synchronous:'In the simple model, torque equals maximum torque times the sine of the field angle. Equal steady speed can coexist with a field angle offset.',\n frequency:'Rotational energy equals one half times rotational inertia times angular speed squared. Near fifty hertz, the frequency rate of change is approximately nominal frequency times the per-unit mechanical minus electrical power, divided by twice the inertia constant.',\n neutral:'Neutral current is the negative of the instantaneous sum of the three phase currents.',\n powerflow:'Per phase, current equals the phasor voltage difference divided by inductive reactance j X. Real power from A to B equals the product of the two voltage magnitudes, divided by reactance, times the sine of their phase difference.',\n map:'Input energy equals useful output, plus losses, plus the increase in stored energy.'\n};\nfunction speechText(s){return String(s).replace(/\\b(\\d+(?:\\.\\d+)?)\\s*kW\\b/g,'$1 kilowatts').replace(/\\b(\\d+(?:\\.\\d+)?)\\s*kV\\b/g,'$1 kilovolts').replace(/\\b(\\d+(?:\\.\\d+)?)\\s*Hz\\b/g,'$1 hertz').replace(/\\b(\\d+(?:\\.\\d+)?)\\s*rpm\\b/g,'$1 revolutions per minute').replace(/[ΦℜφδωμτθΩ→↔×²½≈∞]/g,c=>({'Φ':' magnetic flux ','ℜ':' reluctance ','φ':' phi ','δ':' delta ','ω':' omega ','μ':' mu ','τ':' tau ','θ':' theta ','Ω':' ohms ','→':' leads to ','↔':' exchanges with ','×':' times ','²':' squared ','½':' one half ','≈':' approximately equals ','∞':' infinity '}[c])).replace(/\\s+/g,' ').trim()}\nfunction splitSpeech(s){const result=[];const sentences=s.match(/.+?(?:[.!?](?=\\s|$)|$)/gs)||[s];for(let sentence of sentences){sentence=sentence.trim();while(sentence.length>210){let cut=sentence.lastIndexOf(' ',210);if(cut\u003c1)cut=210;result.push(sentence.slice(0,cut).trim());sentence=sentence.slice(cut).trim()}if(sentence)result.push(sentence)}return result}\nfunction lessonSpeechChunks(){const el=$('#p'+state.page),p=DATA.pages[state.page],blocks=[];\n const add=(node,text)=>{text=speechText(text??node?.textContent??'');if(text)blocks.push({node,text})};\n add(el.querySelector('h2'));add(el.querySelector('.lead'));\n el.querySelectorAll('.reading p, .reading li, .reading tr').forEach(node=>{if(node.closest('.pdfonly')||node.closest('li')&&node.tagName!=='LI'||node.closest('td'))return;add(node,node.tagName==='TR'?Array.from(node.children).map(n=>n.textContent).join('. '):undefined)});\n const equation=el.querySelector('.equation');if(equation)add(equation,equationSpeech[p.scene]||equation.textContent);\n const analogy=el.querySelector('.two>div:first-child>.analogy');if(analogy)add(analogy);\n const question=el.querySelector('.check>p');if(question)add(question,'Explain it back. '+question.textContent);\n el.querySelectorAll('.check details[open] p').forEach(node=>add(node,'Explanation. '+node.textContent));\n el.querySelectorAll('.practicecard').forEach(card=>{add(card.querySelector('b'));add(card.querySelector(':scope>p'));card.querySelectorAll('details[open] p').forEach(node=>add(node,'Explanation. '+node.textContent))});\n el.querySelectorAll('.testpart').forEach(part=>{add(part.querySelector('h3'));part.querySelectorAll(':scope>p').forEach(node=>add(node))});\n return blocks.flatMap(b=>splitSpeech(b.text).map(text=>({node:b.node,text})))\n}\nfunction clearSpeechHighlight(){if(narration.highlight)narration.highlight.classList.remove('tts-reading');narration.highlight=null}\nfunction speechUI(message){const active=narration.phase!=='idle';$('#pauseSpeech').disabled=!narration.supported||!active;$('#stopSpeech').disabled=!narration.supported||!active;$('#pauseSpeech').textContent=narration.phase==='paused'?'Resume':'Pause';$('#readLesson').textContent=active?'↺ Restart':'▶ Read aloud';if(message)$('#speechStatus').textContent=message}\nfunction stopReading(message='Reading stopped.'){narration.token++;clearTimeout(narration.nextTimer);narration.nextTimer=null;narration.phase='idle';narration.utterance=null;narration.pendingRestart=false;clearSpeechHighlight();if(speechEngine)try{speechEngine.cancel()}catch(e){}speechUI(message)}\nfunction voiceKey(v){return v.voiceURI||v.name+'|'+v.lang}\nfunction loadSpeechVoices(){if(!narration.supported)return;try{narration.voices=speechEngine.getVoices().slice().sort((a,b)=>Number(!/^en/i.test(a.lang))-Number(!/^en/i.test(b.lang))||Number(!a.localService)-Number(!b.localService)||a.name.localeCompare(b.name))}catch(e){narration.voices=[]}\n const select=$('#speechVoice');select.replaceChildren(new Option('Automatic voice',''));for(const v of narration.voices)select.add(new Option(`${v.name} · ${v.lang}${v.localService?' · device':' · online'}`,voiceKey(v)));select.value=narration.voices.some(v=>voiceKey(v)===state.narration.voice)?state.narration.voice:''\n}\nfunction chosenVoice(){return narration.voices.find(v=>voiceKey(v)===state.narration.voice)||narration.voices.find(v=>v.localService&&/^en[-_]IE/i.test(v.lang))||narration.voices.find(v=>v.localService&&/^en[-_]GB/i.test(v.lang))||narration.voices.find(v=>v.localService&&/^en/i.test(v.lang))||narration.voices.find(v=>/^en/i.test(v.lang))||narration.voices.find(v=>v.default)||narration.voices[0]}\nfunction finishReading(token){if(token!==narration.token)return;const shouldContinue=state.narration.autoNext&&!narration.selection&&!exam&&state.page\u003cDATA.pages.length-1;stopReading('Finished reading this '+(narration.selection?'selection.':'lesson.'));if(shouldContinue){show(state.page+1);const nextToken=narration.token;narration.nextTimer=setTimeout(()=>{if(narration.token===nextToken)startReading(false)},180)}}\nfunction speakCurrent(token){if(token!==narration.token||narration.phase!=='reading')return;if(narration.index>=narration.chunks.length){finishReading(token);return}const chunk=narration.chunks[narration.index];clearSpeechHighlight();if(chunk.node){narration.highlight=chunk.node;chunk.node.classList.add('tts-reading');chunk.node.style.scrollMarginTop=($('.speechbar').getBoundingClientRect().height+($('.top')?.getBoundingClientRect().height||0)+20)+'px';chunk.node.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}\n const u=new SpeechSynthesisUtterance(chunk.text);narration.utterance=u;const voice=chosenVoice();if(voice)u.voice=voice;u.lang=voice?.lang||'en-IE';u.rate=Math.max(.6,Math.min(1.8,Number(state.narration.rate)||1));u.volume=1;\n speechUI(`Reading ${narration.index+1} of ${narration.chunks.length}${narration.selection?' · selected text':''}.`);\n u.onend=()=>{if(token!==narration.token)return;narration.utterance=null;narration.index++;if(narration.phase==='reading')speakCurrent(token)};\n u.onerror=event=>{if(token!==narration.token)return;stopReading(event.error==='not-allowed'?'Speech was blocked. Open this file directly in your browser and press Read aloud again.':'Could not play this voice. Choose another voice or check your device’s speech settings.')};\n try{if(speechEngine.paused)speechEngine.resume();speechEngine.speak(u)}catch(e){stopReading('Speech could not start. Try another voice or browser.')}\n}\nfunction startReading(selected=false){if(!narration.supported){speechUI('Read-aloud is unavailable in this browser. Open the HTML file in Edge or Chrome.');return}const selection=selected?window.getSelection()?.toString().trim():'';if(selected&&!selection){speechUI('Select some lesson text first, then press Read selected text.');return}stopReading('Preparing to read.');loadSpeechVoices();narration.selection=selected;narration.chunks=selected?splitSpeech(speechText(selection)).map(text=>({node:null,text})):lessonSpeechChunks();narration.index=0;if(!narration.chunks.length){speechUI('No lesson text is available to read.');return}narration.phase='reading';speakCurrent(narration.token)}\nfunction pauseOrResumeReading(){if(narration.phase==='reading'){narration.phase='paused';try{speechEngine.pause()}catch(e){}speechUI('Paused. Press Resume to continue.')}else if(narration.phase==='paused'){narration.phase='reading';if(narration.pendingRestart||!narration.utterance){narration.pendingRestart=false;speakCurrent(narration.token)}else{try{speechEngine.resume()}catch(e){stopReading('Could not resume. Press Read aloud to restart.');return}speechUI(`Reading ${narration.index+1} of ${narration.chunks.length}.`)}}}\nfunction updateSpeechSettings(){const wasPaused=narration.phase==='paused';state.narration.rate=Number($('#speechRate').value);state.narration.voice=$('#speechVoice').value;state.narration.autoNext=$('#speechAutoNext').checked;$('#speechRateValue').textContent=fmt(state.narration.rate,1)+'×';save();if(narration.phase!=='idle'){narration.token++;narration.utterance=null;try{speechEngine.cancel()}catch(e){}if(wasPaused){narration.pendingRestart=true;speechUI('Paused. Updated voice and speed will be used on Resume.')}else speakCurrent(narration.token)}}\n$('#readLesson').onclick=()=>startReading(false);$('#readSelection').onclick=()=>startReading(true);$('#pauseSpeech').onclick=pauseOrResumeReading;$('#stopSpeech').onclick=()=>stopReading();$('#speechVoice').onchange=updateSpeechSettings;$('#speechRate').oninput=updateSpeechSettings;$('#speechAutoNext').onchange=()=>{state.narration.autoNext=$('#speechAutoNext').checked;save()};\n$('#speechRate').value=state.narration.rate;$('#speechRateValue').textContent=fmt(Number(state.narration.rate),1)+'×';$('#speechAutoNext').checked=!!state.narration.autoNext;\nif(narration.supported){loadSpeechVoices();speechEngine.addEventListener('voiceschanged',loadSpeechVoices)}else{$('#readLesson').disabled=true;$('#readSelection').disabled=true;$('#speechVoice').disabled=true;$('#speechRate').disabled=true;$('#speechAutoNext').disabled=true;speechUI('Read-aloud is unavailable in this browser. Open the HTML file in Edge or Chrome.')}\nwindow.addEventListener('pagehide',()=>stopReading());\nwindow.EESNarration={stop:()=>stopReading('Press Read aloud to hear the current lesson.'),chunks:lessonSpeechChunks,normalise:speechText,split:splitSpeech,state:narration};\n\u003c/script>\u003c/body>\u003c/html>\n"}</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const originals = JSON.parse($('original-labs').textContent);
const groups = [
  { name: 'Transistors and Diodes', sections: [] },
  { name: 'C Coding and Computer Engineering', sections: [] },
  { name: 'Electromagnetic Fields and AC', sections: [] },
  { name: 'CMOS and Flip-Flop Operation', sections: [] },
  { name: 'UAV Carrier PCB', sections: [] }
];
const colors = ['#2166ad', '#ad730b', '#07826c', '#ab4255', '#7561a4'];
const clamp = (x,lo,hi) => Math.max(lo,Math.min(hi,x));
const fixed = (x,n=2) => Number(Math.abs(x)<10**(-n)/2?0:x).toFixed(n);
const unit = (x,u,n=2) => fixed(x,n)+(u?' '+u:'');
const minMax = list => [Math.min(...list),Math.max(...list)];
const rng = (key,label,min,max,step,value,suffix='') => ({key,label,min,max,step,value,suffix});
const opt = (key,label,labels,value=labels[0]) => ({key,label,options:labels,value});
const time = (label='Time',max=10,value=0) => rng('t',label,0,max,max/200,value);
const series = (label,fn,color=colors[0]) => ({label,fn,color});
const norm = (n,fn) => Array.from({length:n},(_,i)=>fn(i/(n-1),i));
function add(plo,section,id,title,summary,controls,calculate,extra={}) {
  let group = groups[plo-1].sections.find(s=>s.name===section);
  if (!group) {
    group = {name:section,items:[]};
    groups[plo-1].sections.push(group);
  }
  group.items.push({id,title,summary,controls,calculate,...extra});
}
function el(tag,attrs={},...content) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));
  node.append(...content);
  return node;
}
function svg(body,label,view='0 0 680 270') {
  return '<svg viewBox="'+view+'" role="img" aria-label="'+label+'">'+body+'</svg>';
}
function txt(x,y,value,style='',size=15) {
  return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" class="'+style+'">'+value+'</text>';
}
function ln(x1,y1,x2,y2,color='#849ab3',width=2.4,dash='') {
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+width+'" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>';
}
function circ(x,y,r,fill) {
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'"/>';
}
function rect(x,y,w,h,fill,stroke='none') {
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+fill+'" stroke="'+stroke+'"/>';
}
function arrow(x1,y1,x2,y2,color=colors[0],width=3) {
  const a=Math.atan2(y2-y1,x2-x1), b=9;
  return ln(x1,y1,x2,y2,color,width)+ln(x2,y2,x2-b*Math.cos(a-.5),y2-b*Math.sin(a-.5),color,width)+ln(x2,y2,x2-b*Math.cos(a+.5),y2-b*Math.sin(a+.5),color,width);
}
function diagram(nodes,{labels=[],active=[],flow=0,t=0}={}) {
  const x=i=>27+i*(493/Math.max(1,nodes.length-1));
  let body='';
  nodes.slice(0,-1).forEach((_,i)=>{
    const on=active.includes(i), c=on?colors[2]:'#9caec0';
    body+=arrow(x(i)+134,116,x(i+1)-5,116,c,on?4:2);
    if(on&&flow) for(let j=0;j<3;j++){
      const phase=((t*flow*.2+j*.33)%1+1)%1;
      body+=circ(x(i)+135+(x(i+1)-x(i)-140)*phase,116,3,'#fff');
    }
  });
  nodes.forEach((n,i)=>{
    body+=rect(x(i),87,134,58,'#fff','#96aec8');
    body+=txt(x(i)+9,111,n[0],'',14)+txt(x(i)+9,133,n[1]??'','muted',13);
  });
  labels.forEach((label,i)=>{body+=txt(26,175+i*25,label,'muted',14);});
  return svg(body,'Schematic', '0 0 680 236');
}
function bars(entries,label) {
  const limit=Math.max(1,...entries.map(a=>Math.abs(a[1])));
  const body=entries.map(([name,v,u,c],i)=>{
    const y=24+44*i;
    return txt(20,y+16,name,'',14)+rect(207,y,338,19,'#dae6f2')+
      rect(207,y,338*Math.abs(v)/limit,19,c??colors[i%5])+txt(555,y+15,unit(v,u),'',13);
  }).join('');
  return svg(body,label,'0 0 680 '+Math.max(115,entries.length*44+19));
}
function plot(ss,span,cursor,xLabel='Time (s)',bounds) {
  const width=680,left=64,right=650,top=ss.length>3?49:28,bottom=207;
  const samples=ss.map(s=>norm(121,a=>s.fn(span*a)));
  let [lo,hi]=bounds??minMax(samples.flat().concat(0));
  if(hi-lo<.0001){lo-=1;hi+=1;}
  if(!bounds){const p=(hi-lo)*.075;lo-=p;hi+=p;}
  const X=a=>left+(right-left)*a/span,Y=v=>bottom-(bottom-top)*(v-lo)/(hi-lo);
  let body='';
  for(let i=0;i<=4;i++){
    const x=X(span*i/4),y=bottom-(bottom-top)*i/4;
    body+=ln(left,y,right,y,'#c5d5e5',1)+ln(x,top,x,bottom,'#cfdeec',1);
    body+=txt(8,y+5,fixed(lo+(hi-lo)*i/4,2),'muted',11)+txt(x-8,bottom+17,fixed(span*i/4,1),'muted',11);
  }
  body+=txt(280,bottom+39,xLabel,'muted',13);
  for(let i=0;i<ss.length;i++){
    const points=samples[i].map((v,j)=>X(span*j/120).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    body+='<polyline fill="none" stroke="'+ss[i].color+'" stroke-width="2.8" points="'+points+'"/>';
    const legendX=left+180*(i%3), legendY=17+Math.floor(i/3)*16;
    body+=ln(legendX,legendY-4,legendX+15,legendY-4,ss[i].color,3)+txt(legendX+19,legendY,ss[i].label,'',12);
  }
  if (cursor!==undefined) {
    const x=X(clamp(cursor,0,span));
    body+=ln(x,top,x,bottom,'#425c7a',1.5,'5 4')+ss.map(s=>circ(x,Y(s.fn(clamp(cursor,0,span))),4,s.color)).join('');
  }
  return svg(body,'Graph of '+ss.map(s=>s.label).join(', '),'0 0 '+width+' 253');
}
function traces(rows) {
  const w=680, x0=130,x1=653,y0=33,row=42, n=rows[0][1].length;
  const step=(x1-x0)/Math.max(10,n);
  let b='';
  for(let i=0;i<=n;i++) b+=ln(x0+i*step,15,x0+i*step,rows.length*row+16,'#c9d9e9',1);
  rows.forEach(([name,arr],i)=>{
    const y=y0+row*i;
    b+=txt(14,y+4,name,'',14);
    arr.forEach((v,j)=>{
      const Y=y-(v==='?'?.5:+v)*23, x=x0+j*step;
      if(j&&arr[j-1]!==v)b+=ln(x,y-(arr[j-1]==='?'?.5:+arr[j-1])*23,x,Y,colors[i%5],2.5);
      b+=ln(x,Y,x+step,Y,colors[i%5],2.5,v==='?'?'3 2':'');
    });
  });
  return svg(b,'Digital timing traces','0 0 '+w+' '+(rows.length*row+18));
}
function wireGraphic(t,f,scatter=0) {
  let b=rect(24,83,630,98,'#e0eaf3','#b6c9da');
  for(let i=0;i<45;i++){
    const p=((i*89-t*f*35+Math.sin(t*(2+scatter*.3)+i)*17)%616+616)%616;
    b+=circ(31+p,97+(i*23%68)+Math.cos(t*2.3+i)*6,3.5,colors[0]);
  }
  b+=txt(26,60,'Electron motion','',17);
  if(f) {
    const backwards=f<0;
    b+=arrow(backwards?590:88,206,backwards?88:590,206,colors[1])+txt(235,229,'Field and conventional current','',14);
    b+=arrow(backwards?88:590,43,backwards?590:88,43,colors[0])+txt(245,28,'Average electron drift','',14);
  } else b+=txt(210,218,'Random motion · no average drift','muted',14);
  return svg(b,'Moving carriers in a wire');
}
function table(headers,rows) {
  return el('div',{class:'scroll-table'},el('table',{class:'trace'},
    el('thead',{},el('tr',{},...headers.map(h=>el('th',{scope:'col'},h)))),
    el('tbody',{},...rows.map(row=>el('tr',{},...row.map(x=>el('td',{},String(x))))))));
}

const charge = 'Charge and junctions', bjt = 'NPN switching and amplification';
add(1,charge,'drift','1.1 · Electron drift and scattering',
  'Change the field and how often electrons scatter. Compare random motion with average drift.',
  [rng('field','Electric field',-5,5,.1,0,'relative'),rng('scatter','Scattering',0,8,1,2),time('Animation position',12)],
  s=>{const drift=s.field/(1+s.scatter*.27);return {visual:wireGraphic(s.t,drift,s.scatter),read:[['Electron drift',unit(-drift,'relative')],['Conventional current',unit(drift,'relative')]],tip:'Electrons drift opposite the electric field. More scattering reduces average drift at the same field.'};},
  {play:'Play electron motion',loop:true});

function dopingScene(state,p,delta) {
  const fixedC=p?colors[0]:colors[1], mobileC=p?colors[1]:colors[0];
  let b=rect(26,29,489,183,'#fff','#9fb8d2')+rect(538,29,116,183,'#e3edf6');
  b+=txt(42,53,p?'P-type sample':'N-type sample','',17)+txt(548,53,'Outside','',14);
  for(let i=0;i<state.n;i++){
    const x=56+(i%12)*37,y=81+Math.floor(i/12)*27;
    b+=circ(x,y,8,fixedC)+txt(x-4,y+4,p?'−':'+','',12);
  }
  for(let i=0;i<state.n-delta;i++){
    const x=74+(i%12)*37+(Math.sin(state.t+i)*4),y=82+Math.floor(i/12)*27;
    b+=circ(x,y,4.6,mobileC);
  }
  for(let i=0;i<delta;i++)b+=circ(550+(i%6)*16,75+Math.floor(i/6)*17,4.1,colors[0]);
  b+=txt(40,237,'Large dots: fixed ions   ·   Small dots: mobile '+(p?'holes':'electrons'),'muted',13);
  return svg(b,'Fixed dopant ions and mobile carriers');
}
add(1,charge,'doping','2.1 · Doping and charge balance',
  'Start with matching fixed and mobile charges, then move one electron at a time.',
  [opt('type','Sample',['N-type','P-type']),rng('n','Dopant count',12,48,1,24),time('Carrier position',10)],
  s=>{const p=s.type==='P-type',delta=Math.min(s.n,s.delta??0);
    return {visual:dopingScene(s,p,delta),read:[['Fixed ion charge',(p?'−':'+')+s.n+' e'],['Mobile carrier charge',(p?'+':'−')+(s.n-delta)+' e'],['Net sample charge',delta?(p?'−':'+')+delta+' e':'0 e']],
      tip:p?'Adding an electron fills a hole. The fixed acceptor charge stays in the sample.':'Removing an electron leaves one extra unit of positive charge. The donor ion stays in place.'};},
  {actions:[['Move one electron out / fill one hole',s=>s.delta=Math.min(s.n,(s.delta??0)+1)],['Restore neutrality',s=>s.delta=0]],play:'Play carrier motion',loop:true});

function junctionScene(p,n,width,t,leftToRight,rightToLeft,barrier) {
  let b=rect(30,55,310,141,'#f9e8e4')+rect(340,55,310,141,'#ddebf8');
  if(width>0){
    b+=rect(340-width/2,55,width,141,'#f9ebbb','#d4ae52');
    b+=txt(280,44,'Depletion region','muted',13);
    for(let i=0;i<4;i++){
      const x=340+width*(.12+.09*i),y=94+i*21;
      b+=txt(x,y,'+','',14)+txt(680-x-9,y,'−','',14);
    }
  }
  b+=txt(43,80,p,'',15)+txt(567,80,n,'',15);
  [[leftToRight,111,1],[rightToLeft,161,-1]].forEach(([count,y,d],j)=>{

function memoryLifetime(root) {
  const presets={Local:'local(10)\nread()\nreturnFromFunction()\nread()\nreuse(99)\nread()',Heap:'malloc(10)\nread()\nreturnFromFunction()\nread()\nfree()\nread()'};
  let position=0, mode='Local';
  const editor=el('textarea',{class:'command-text','aria-label':'Editable simulation commands'});
  const output=el('div',{'aria-live':'polite'}), log=el('div');
  const modes=el('div',{class:'choices'});
  const stepButton=el('button',{class:'prominent',type:'button'},'Step next');
  const actions=el('div',{class:'actions'},stepButton,el('button',{type:'button'},'Run from start'),el('button',{type:'button'},'Reset steps'));
  const commands=()=>editor.value.split(/\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('//'));
  function render() {
    const lines=commands(), rows=[];
    let kind='None',live=false,value='—',pointerLive=false;
    lines.slice(0,position).forEach(line=>{
      const m=line.match(/^(local|malloc|read|returnFromFunction|reuse|free)\((-?\d+)?\)$/);
      let status='Unknown command';
      if(m){
        const [,command,arg]=m;
        if((['local','malloc','reuse'].includes(command))!==Boolean(arg)){
          status=arg?'This command takes no value':'Enter a number in parentheses';
        }else if(command==='local'||command==='malloc'){
          kind=command==='local'?'Local':'Heap';value=arg;live=true;pointerLive=true;status='Created '+kind.toLowerCase()+' object';
        }else if(command==='returnFromFunction'){
          if(kind==='Local'){live=false;pointerLive=false;status='Local lifetime ended';}
          else status='Heap allocation survives the return';
        }else if(command==='reuse'){
          value=arg;live=true;pointerLive=false;kind='Reused storage';status='Storage now belongs to a separate object';
        }else if(command==='free'){
          if(kind==='Heap'&&pointerLive){live=false;pointerLive=false;status='Allocation freed';}
          else status='Invalid free';
        }else status=pointerLive?'Valid read → '+value:'Invalid read · no result predicted';
      }
      rows.push([line,status]);
    });
    output.replaceChildren(metrics([['Storage',kind],['Bytes in model',value],['Object alive',live?'Yes':'No'],['Read through pointer',pointerLive?'Valid':'Invalid']]));
    log.replaceChildren(table(['Command','Result'],rows.length?rows:[['—','Use Step next or Run from start']]));
    stepButton.disabled=position>=lines.length;
  }
  Object.entries(presets).forEach(([name,code])=>{
    const b=el('button',{type:'button','aria-pressed':String(name===mode)},name==='Local'?'Local variable':'malloc memory');
    b.onclick=()=>{mode=name;editor.value=code;position=0;[...modes.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();};
    modes.append(b);
  });
  editor.value=presets.Local;editor.oninput=()=>{position=0;render();};
  stepButton.onclick=()=>{position++;render();};
  actions.children[1].onclick=()=>{position=commands().length;render();};
  actions.children[2].onclick=()=>{position=0;render();};
  root.append(el('div',{class:'pad'},modes,el('p',{class:'explain'},'Available commands: local(n), malloc(n), read(), returnFromFunction(), reuse(n), free().'),editor,actions),
    el('div',{class:'visual'},output),el('div',{class:'pad'},log,el('p',{class:'explain'},'The old bytes can still appear unchanged after an object dies. A read through the dangling pointer is already invalid in C.')));
  render();
}
function mutexCounter(root) {
  const options=['No mutex','Same mutex'],choice=el('div',{class:'choices'}), actions=el('div',{class:'actions'});
  const visual=el('div',{class:'visual'}), log=el('div',{class:'pad','aria-live':'polite'});
  let mode=options[0], counter=10, owner='', states, rows;
  function draw() {
    const stepNames=['Read','Add','Write','Done'];
    visual.innerHTML=diagram([['Thread A',stepNames[states.A.step]],['Counter',String(counter)],['Thread B',stepNames[states.B.step]]],{active:owner==='A'?[0]:owner==='B'?[1]:[],labels:['Mutex owner: '+(owner?'Thread '+owner:'none'),'Expected after both writes: 12']});
    log.replaceChildren(table(['Thread','Action','Shared counter'],rows.length?rows:[['—','Start at 10',10]]),
      el('p',{class:'explain'},'This models ordinary read/add/write interleaving. In real C, unsynchronised conflicting accesses to a shared variable cause a data race and undefined behaviour.'));
    actions.children[0].disabled=states.A.step>=3;actions.children[1].disabled=states.B.step>=3;
    [...choice.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(options[i]===mode)));
  }
  function reset(){counter=10;owner='';states={A:{step:0,local:0},B:{step:0,local:0}};rows=[];draw();}
  function step(who,update=true) {
    const w=states[who], shared=mode===options[1];
    if(w.step===3)return;
    if(shared&&owner&&owner!==who){rows.push([who,'Waits for the same mutex',counter]);if(update)draw();return;}
    if(w.step===0){if(shared)owner=who;w.local=counter;rows.push([who,(shared?'Lock → ':'')+'Read '+w.local,counter]);}
    if(w.step===1){w.local++;rows.push([who,'Add 1 → '+w.local,counter]);}
    if(w.step===2){counter=w.local;if(shared)owner='';rows.push([who,'Write '+counter+(shared?' → unlock':''),counter]);}
    w.step++;if(update)draw();
  }
  options.forEach(m=>{const b=el('button',{type:'button'},m);b.onclick=()=>{mode=m;reset();};choice.append(b);});
  [['Step A',()=>step('A')],['Step B',()=>step('B')],['Run example',()=>{
    reset();
    const order=mode===options[0]?['A','B','A','B','A','B']:['A','B','A','A','B','B','B'];
    order.forEach(w=>step(w,false));draw();
  }],['Reset',reset]].forEach(([label,run],i)=>{const b=el('button',{type:'button',class:i===2?'prominent':''},label);b.onclick=run;actions.append(b);});
  root.append(el('div',{class:'pad'},choice,actions),visual,log);
  reset();
}

const proj=(x,y,z,az,pitch=20)=>{const a=rad(az),p=rad(pitch);return [340+(x*Math.cos(a)-z*Math.sin(a))*3.4,132+(y*Math.cos(p)+(x*Math.sin(a)+z*Math.cos(a))*Math.sin(p))*3.4];};
function path3(points,az,stroke,w=2) {
  const coords=points.map(pt=>proj(...pt,az).map(x=>x.toFixed(1)).join(',')).join(' ');

}

function idealTransformer(s){
  const vs=s.vp/s.n, i=s.rl?vs/s.rl:s.is, f=s.f??50, phi=s.vp/(4.44*f*500);

}

function motorScene(s,force,angle=0,spatial=true) {
  const az=spatial?s.az??34:0;

  for(let y of [-19,-7,7,19]){const a=proj(-62,y,0,az,0),b=proj(62,y,0,az,0);
    if(s.field==='Reversed')g+=arrow(...b,...a,colors[0],1.5);else g+=arrow(...a,...b,colors[0],1.5);
  }

  if(force){const x=proj(0,0,0,az),d=force>0?-1:1;g+=arrow(...x,x[0],x[1]+d*87,colors[3],4);}

function gridMotion(s){
  const dt=.05,demand=100+s.step,points=[[50,100]],mode=s.control??'Fixed input';
  let f=50,p=100,sec=0;
  for(let j=1;j<=800;j++){
    const target=j*dt<2?100:demand;
    if(mode==='Primary + secondary'&&j*dt>=10)sec=clamp(sec+1.4*(50-f)*dt,0,35);
    const command=mode==='Fixed input'?(j*dt>=s.match?demand:100):100+8*(50-f)+sec;
    p+=dt*(clamp(command,0,s.max??135)-p)/.9;
    f+=dt*(p-target-(mode==='Fixed input'?0:.7*(f-50)))/s.h;
    points.push([f,p]);
  }
  const at=(t,k)=>points[Math.round(clamp(t,0,40)/dt)][k];
  return {frequency:t=>at(t,0),power:t=>at(t,1),demand:t=>t<2?100:demand};
}
function gridDynamics(s) {
  const g=gridMotion(s);
  return {visual:plot([series('Frequency (Hz)',g.frequency),series('Reference (Hz)',()=>50,colors[1])],40,s.t)+
    plot([series('Mechanical input (MW)',g.power,colors[2]),series('Demand (MW)',g.demand,colors[3])],40,s.t),
    read:[['Grid frequency',unit(g.frequency(s.t),'Hz',3)],['Mechanical input',unit(g.power(s.t),'MW')],['Demand',unit(g.demand(s.t),'MW')],['Power imbalance',unit(g.power(s.t)-g.demand(s.t),'MW')]],tip:'The step arrives at 2 s. If demand exceeds mechanical input, stored rotor energy supplies the difference and frequency falls.'};
}

function latch(root,mode){

  const actions=el('div',{class:'actions'}), scene=el('div',{class:'visual'}), output=el('div',{class:'pad','aria-live':'polite'});

  const record=()=>h.push(sr?[s,r,q,qb]:both?[d,en,clock,qd,qff]:[d,en,en&d,en&(1-d),qd]);
  function render(){
    scene.innerHTML=traces(colnames.map((n,i)=>[n,h.slice(-12).map(row=>row[i])]));
    output.replaceChildren(metrics(colnames.map((n,i)=>[n,h[h.length-1][i]==='?'?'Unknown':String(h[h.length-1][i])])),
      el('p',{class:'explain'},sr?'For a NOR latch, S = R = 1 forces Q and Q̅ low. Releasing both together leaves the winning state uncertain.':
        both?'The latch follows D while enabled. The flip-flop copies D at a rising clock edge, then holds that value.':'The gated SR inputs are S = EN · D and R = EN · (1 − D). With EN low, both inputs are released and the latch holds.'));
  }

    const forbidden=s===1&&r===1;

  }
  function updateD(nd,ne,nc){
    if(ne)qd=nd;
    if(nc&&!clock)qff=nd;
    d=nd;en=ne;clock=nc;
  }
  const list=sr?[['Set',()=>setSR(1,0)],['Reset latch',()=>setSR(0,1)],['Both HIGH',()=>setSR(1,1)],['Release',()=>setSR(0,0)]]:
    [['Toggle D',()=>updateD(1-d,en,clock)],['Toggle EN',()=>updateD(d,1-en,clock)],
      ...(both?[['Toggle CLK',()=>updateD(d,en,1-clock)],['Pulse clock',()=>{if(clock){updateD(d,en,0);record();}updateD(d,en,1);record();updateD(d,en,0);}]]:[])];
  list.forEach(([label,action])=>{const b=el('button',{type:'button'},label);b.onclick=()=>{action();record();render();};actions.append(b);});
  const b=el('button',{type:'button'},'Clear trace');b.onclick=reset;actions.append(b);

}

function mountModel(root,item){
  const state=Object.fromEntries(item.controls.map(c=>[c.key,c.value]));
  const fields=el('div',{class:'controls'}), actionRow=el('div',{class:'actions'}), head=el('div',{class:'pad'},fields);
  const visual=el('div',{class:'visual'}), result=el('div',{class:'pad'}), sync=[];
  let animation=0,playing=false,playButton;
  const timeControl=item.controls.find(c=>c.key==='t');
  const label=(c,v)=>String(+Number(v).toFixed(2))+(c.suffix?(c.suffix==='°'?'':' ')+c.suffix:'');
  function draw(){
    const data=item.calculate(state);
    visual.innerHTML=data.visual;
    const details=[];
    if (data.formula) details.push(el('p',{class:'explain formula'},data.formula));
    if (data.tip) details.push(el('p',{class:'explain'},data.tip));
    result.replaceChildren(metrics(data.read),...details);
    sync.forEach(fn=>fn());
  }
  for (const c of item.controls) {
    let control;
    if(c.options){
      const btns=c.options.map(o=>{
        const b=el('button',{type:'button','aria-pressed':'false'},o);
        b.onclick=()=>{state[c.key]=o;draw();};
        return b;
      });
      sync.push(()=>btns.forEach((b,j)=>b.setAttribute('aria-pressed',String(c.options[j]===state[c.key]))));
      control=el('div',{class:'control'},el('span',{class:'label'},c.label),el('div',{class:'choices',role:'group','aria-label':c.label},...btns));
    } else {
      const id='field-'+c.key, input=el('input',{id,type:'range',min:c.min,max:c.max,step:c.step,value:c.value});
      const output=el('output',{for:id});
      input.oninput=()=>{if(c.key==='t')stop();state[c.key]=+input.value;draw();};
      sync.push(()=>{if(+input.value!==state[c.key])input.value=state[c.key];output.value=label(c,state[c.key]);});
      control=el('div',{class:'control'},el('label',{for:id},c.label,output),input);
    }
    fields.append(control);
  }
  function stop(){
    if(animation)cancelAnimationFrame(animation);
    animation=0;playing=false;
    if(playButton)playButton.textContent=item.play;
  }
  if (item.play && timeControl) {
    playButton=el('button',{type:'button',class:'prominent'},item.play);
    playButton.onclick=()=>{
      if(playing){stop();return;}
      if(state.t>=timeControl.max || !item.loop)state.t=timeControl.min;
      let last=performance.now(), lastDraw=last;
      const speed=(timeControl.max-timeControl.min)/(item.loop?8500:7000);
      playing=true;playButton.textContent='Pause';
      function tick(ts){
        state.t+=Math.max(0,Math.min(ts-last,120))*speed;
        last=ts;
        if(state.t>=timeControl.max){
          if(!item.loop){state.t=timeControl.max;stop();draw();return;}
          state.t=timeControl.min;
        }
        if(ts-lastDraw>=45){draw();lastDraw=ts;}
        animation=requestAnimationFrame(tick);
      }
      draw();animation=requestAnimationFrame(tick);
    };
    actionRow.append(playButton);
  }
  (item.actions??[]).forEach(([name,fn])=>{
    const b=el('button',{type:'button'},name);
    b.onclick=()=>{stop();fn(state);draw();};
    actionRow.append(b);
  });
  const reset=el('button',{type:'button'},'Reset');
  reset.onclick=()=>{
    stop();
    Object.keys(state).forEach(key=>delete state[key]);
    item.controls.forEach(c=>state[c.key]=c.value);draw();
  };
  actionRow.append(reset);head.append(actionRow);
  if(item.dragView){
    let lastX=null;
    visual.style.touchAction='pan-y';
    visual.addEventListener('pointerdown',e=>{
      if(e.target.closest('svg')!==visual.querySelector('svg'))return;
      lastX=e.clientX;visual.setPointerCapture(e.pointerId);
    });
    visual.addEventListener('pointermove',e=>{
      if(lastX===null)return;
      state.az=((state.az+(e.clientX-lastX)*1.1+540)%360)-180;
      lastX=e.clientX;draw();
    });
    const clear=()=>{lastX=null;};
    visual.addEventListener('pointerup',clear);
    visual.addEventListener('pointercancel',clear);
  }
  if(timeControl)visual.addEventListener('click',e=>{
    const graph=e.target.closest('svg[aria-label^="Graph of "]');
    if(!graph)return;
    const p=graph.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const g=p.matrixTransform(graph.getScreenCTM().inverse());
    if(g.x<64||g.x>650||g.y<28||g.y>207)return;
    stop();
    const ratio=(g.x-64)/(650-64);
    state.t=timeControl.min+(timeControl.max-timeControl.min)*ratio;
    draw();
  });
  root.append(head,visual,result);cleanup=stop;draw();
}

  const side=info.sections.map(s=>{
    const active=s.items.some(x=>x.id===item.id),d=el('details',{});
    d.open=active||info.sections.length<=2;
    d.append(el('summary',{},s.name),...s.items.map(x=>link(x,x.id===item.id,'sim-link')));
    return d;
  });
  $('sim-nav').replaceChildren(...side);
  document.title=item.title+' · Engineering Mastery with AI';
  if(item.original)mountOriginal(card,item);
  else if(item.custom)item.custom(card);
  else mountModel(card,item);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
render();

</script>
</body>
</html>
