lass=\"intro\">Restore four parts of the valley’s power station. Change the controls, test your prediction, then read why it worked—or why it failed.\u003c/p>\u003cdiv id=\"chapters\">\u003c/div>\u003cdiv class=\"level-list\" id=\"levels\">\u003c/div>\u003cdiv class=\"progress-label\">\u003cspan id=\"progress-text\">\u003c/span>\u003cspan id=\"progress-percent\">\u003c/span>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"progress-fill\" id=\"progress-fill\">\u003c/div>\u003c/div>\u003cp class=\"note\">No timer or locked rooms. First checks, hints and corrected answers are recorded separately.\u003c/p>\u003c/nav>\n\u003cmain>\u003csection class=\"mission\" aria-labelledby=\"mission-title\">\u003cdiv class=\"mission-head\">\u003cdiv class=\"mission-row\">\u003cdiv>\u003cdiv class=\"eyebrow\" id=\"mission-number\">\u003c/div>\u003ch2 id=\"mission-title\">\u003c/h2>\u003c/div>\u003cspan class=\"mode\" id=\"mission-mode\">\u003c/span>\u003c/div>\u003cp id=\"mission-lesson\">\u003c/p>\u003cdiv class=\"goal\">\u003cstrong>Your mission\u003c/strong>\u003cspan id=\"mission-goal\">\u003c/span>\u003c/div>\u003cdiv class=\"fixed\" id=\"fixed\">\u003c/div>\u003c/div>\n\u003cdiv class=\"bench\">\u003cdiv class=\"bench-top\">\u003cspan id=\"bench-label\">\u003c/span>\u003cspan id=\"bench-state\">\u003c/span>\u003cbutton class=\"small quiet hidden\" id=\"animate\" data-action=\"animate\">Run visual\u003c/button>\u003c/div>\u003ccanvas class=\"scene\" id=\"scene\" role=\"img\" aria-label=\"Interactive electrical system\">\u003c/canvas>\u003cdiv class=\"sr-only\" id=\"scene-description\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cdiv id=\"prediction-cover\" class=\"prediction-cover hidden\">Make your prediction, then check to reveal the measurements.\u003c/div>\u003cdiv class=\"controls\" id=\"controls\">\u003c/div>\u003cdiv class=\"reason\">\u003clabel for=\"reason\">Your reasoning \u003cspan style=\"font-weight:400\">(optional; saved before feedback)\u003c/span>\u003c/label>\u003ctextarea id=\"reason\" placeholder=\"What changes, what stays fixed, and why?\">\u003c/textarea>\u003cdiv class=\"reason-bottom\">\u003clabel for=\"confidence\">Confidence before checking\u003c/label>\u003cselect id=\"confidence\">\u003coption value=\"0\">Not rated\u003c/option>\u003coption value=\"1\">1 — Guessing\u003c/option>\u003coption value=\"2\">2 — Unsure\u003c/option>\u003coption value=\"3\">3 — Partly sure\u003c/option>\u003coption value=\"4\">4 — Fairly sure\u003c/option>\u003coption value=\"5\">5 — Confident\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"trail\">\u003cdiv class=\"trail-title\">Your latest moves\u003c/div>\u003cdiv class=\"trail-content\" id=\"trail\">\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cdiv class=\"actions-left\">\u003cbutton class=\"small quiet\" data-action=\"restart\">Restart room\u003c/button>\u003cbutton class=\"small quiet\" data-action=\"hint\">Hint\u003c/button>\u003c/div>\u003cdiv class=\"actions-right\">\u003cbutton class=\"primary\" data-action=\"check\">Check →\u003c/button>\u003cbutton class=\"quiet\" data-action=\"next\" id=\"next\">Next room\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"hint\" class=\"hint hidden\">\u003c/div>\u003cdiv id=\"feedback\" class=\"feedback hidden\" role=\"status\">\u003c/div>\u003c/section>\n\u003csection id=\"recap\" class=\"chapter-recap hidden\">\u003c/section>\u003c/main>\u003c/div>\u003cfooter>\u003cspan id=\"save-status\">Progress saves in this browser when storage is available.\u003c/span>\u003cbutton class=\"small quiet\" data-action=\"offline\">Save game offline\u003c/button>\u003c/footer>\u003c/div>\n\u003cdialog id=\"guide-dialog\" aria-labelledby=\"guide-title\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"guide-title\">Field guide · the complete route\u003c/h2>\u003cbutton class=\"small\" data-action=\"close-guide\">Close\u003c/button>\u003c/div>\u003cdiv class=\"dialog-body\" id=\"guide-body\">\u003c/div>\u003c/dialog>\n\u003cdialog id=\"record-dialog\" aria-labelledby=\"record-title\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"record-title\">Your learning record\u003c/h2>\u003cbutton class=\"small\" data-action=\"close-record\">Close\u003c/button>\u003c/div>\u003cdiv class=\"dialog-body\" id=\"record-body\">\u003c/div>\u003c/dialog>\n\u003cdialog id=\"report-dialog\" aria-labelledby=\"report-title\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"report-title\">Printable learning record\u003c/h2>\u003cdiv>\u003cbutton class=\"small\" data-action=\"print\">Print / save PDF\u003c/button> \u003cbutton class=\"small\" data-action=\"close-report\">Close\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"dialog-body\" id=\"report-body\">\u003c/div>\u003c/dialog>\u003cdiv class=\"sr-only\" aria-live=\"polite\" id=\"announcer\">\u003c/div>\u003cnoscript>\u003cp>Enable JavaScript to play. The game needs no external scripts or downloads.\u003c/p>\u003c/noscript>\n\u003cscript id=\"saved-progress\" type=\"application/json\">null\u003c/script>\u003cscript id=\"game-levels\">'use strict';\nconst Course = (()=>{\n const choice=(key,label,options)=>({key,label,type:'choice',options:options.map(x=>Array.isArray(x)?{value:x[0],label:x[1]}:{value:x,label:String(x)})});\n const select=(key,label,options)=>({...choice(key,label,options),type:'select'});\n const range=(key,label,min,max,step,unit='')=>({key,label,type:'range',min,max,step,unit});\n const near=(a,b,t=.02)=>Math.abs(a-b)\u003c=t;\n const fmt=(x,d=2)=>new Intl.NumberFormat('en',{maximumFractionDigits:d}).format(x);\n const chapters=[\n  {id:3,name:'Coil Cavern',subtitle:'Induction, energy & AC',summary:'A changing flux creates EMF. An inductor stores magnetic energy and resists changes in current. RMS describes heating; phase determines how apparent power divides into real and reactive power.'},\n  {id:4,name:'Transformer Forge',subtitle:'Voltage, current & flux',summary:'A transformer exchanges energy through changing flux. Turns set voltage ratios; the load determines current demand. Fixed-current and fixed-voltage experiments have different saturation rules.'},\n  {id:5,name:'Machine Works',subtitle:'Motors & generators',summary:'Magnetic force creates torque. Back EMF links speed to current. Induction motors need slip; synchronous motors carry load through a rotor angle while retaining synchronous speed.'},\n  {id:6,name:'Grid Valley',subtitle:'Three-phase & stability',summary:'High voltage and good power factor reduce upstream current. Active power balance controls frequency; excitation controls voltage and reactive behaviour. Inertia provides a temporary energy buffer.'}\n ];\n const levels=[\n {id:'3.1',chapter:3,title:'The magnet that stopped',kind:'induction',mode:'predict',lesson:'A magnet has entered an open wire coil. It is now held completely still. The magnetic flux remains large.',goal:'Predict the voltage after the magnet stops.',fixed:'Stationary coil; stationary magnet; ideal high-resistance voltmeter; no other changing field.',initial:{answer:''},controls:[choice('answer','What will the meter do?',[['zero','Return to zero'],['keep','Keep its earlier voltage'],['reverse','Reverse while held still']])],check:p=>p.answer==='zero',solution:{answer:'zero'},hint:'Voltage depends on the rate of flux change, not just how much flux is present.',rule:'Faraday: ε = −dλ/dt. If all turns link the same flux, λ = NΦ and ε = −N dΦ/dt. A steady flux gives zero EMF. Reversing the change reverses polarity. Voltage can exist across an open coil while current is zero. Lenz’s law: any induced current produces a field opposing the change that caused it.',explain:()=>'\u003cp>The meter returns to \u003cb>0 V\u003c/b>. The magnet still produces a field, but the coil’s flux linkage has stopped changing. Moving the magnet out reverses the flux change and reverses the induced voltage.\u003c/p>\u003cp>Like a Minecraft observer reacting to a block change: a steady condition causes no further response. This is an analogy, not an exact redstone model.\u003c/p>'},\n {id:'3.2.1',chapter:3,title:'Charge the magnetic store',kind:'rl',mode:'build',lesson:'Connect a DC supply to a resistor and a linear inductor. The coil initially has no current. Finite voltage changes current gradually.',goal:'Choose the correct starting behaviour, then let current reach at least 90% of its final value.',fixed:'12 V DC; total resistance 6 Ω; constant inductance 0.6 H; initial current 0 A.',initial:{v:12,r:6,l:.6,u:0,answer:''},controls:[choice('answer','Immediately after connection, current…',[['rises','Starts at zero and rises'],['jumps','Jumps straight to 2 A'],['stays','Stays at zero forever']]),range('u','Time after connection',0,5,.1,'τ')],check:(p,m)=>p.answer==='rises'&&m.i>=.9*m.final,solution:{answer:'rises',u:3},hint:'At first the inductor has the supply voltage across it. After about 3 time constants the current is 95% of its final value.',rule:'Passive terminal voltage: vL = L di/dt. With finite voltage, inductor current is continuous. For a DC step from zero, i(t) = (V/R)(1 − e^(−t/τ)), τ = L/R. At DC steady state an ideal inductor has zero voltage and the series resistance sets I = V/R. A real coil also has winding resistance.',explain:(p,m)=>`\u003cp>Here τ = L/R = \u003cb>${fmt(m.tau)} s\u003c/b>, and the final current is \u003cb>${fmt(m.final)} A\u003c/b>. At ${fmt(p.u,1)}τ the current is ${fmt(m.i)} A and the coil voltage is ${fmt(m.vl)} V.\u003c/p>\u003cp>The current starts at zero. As it rises, the resistor takes more voltage, leaving less across the inductor. An ideal inductor behaves like a short connection only after the DC transient settles.\u003c/p>`},\n {id:'3.2.2',chapter:3,title:'Give the field a way home',kind:'discharge',mode:'build',lesson:'The source has been disconnected from a coil carrying 2 A. Its magnetic field contains stored energy. Choose a discharge path.',goal:'Provide a closed resistor path, predict the current direction, and let stored energy fall below 10% of its starting value.',fixed:'Initial current 2 A; L = 0.6 H; discharge resistance 6 Ω; no supply power after disconnection.',initial:{path:'open',answer:'',u:0,l:.6,r:6,i0:2},controls:[choice('path','Discharge path',[['open','Break the loop'],['resistor','Close through resistor']]),choice('answer','Current initially…',[['same','Continues in its old direction'],['reverse','Immediately reverses'],['zero','Immediately vanishes']]),range('u','Time after disconnection',0,5,.1,'τ')],check:(p,m)=>p.path==='resistor'&&p.answer==='same'&&m.energy\u003c=.1*m.initialEnergy,solution:{path:'resistor',answer:'same',u:2},hint:'The inductor reverses its voltage to sustain the existing current. Its stored field energy can become resistor heat.',rule:'For a closed RL discharge path: i = I0 e^(−t/τ), τ = L/R. A linear inductor stores W = ½LI². Its terminal voltage reverses during decay, while the existing current direction initially continues. Opening a real energised coil without a return path can produce a large voltage and arcing; an ideal open-circuit model has no finite-voltage way to force an instantaneous current jump.',explain:(p,m)=>p.path==='open'?'\u003cp>\u003cb>The open path is the problem.\u003c/b> Current cannot safely jump from 2 A to zero. A real coil can develop a large voltage that drives an arc or charges stray capacitance. Select a resistor return path.\u003c/p>':`\u003cp>The starting field energy is ½ × 0.6 × 2² = \u003cb>1.2 J\u003c/b>. After ${fmt(p.u,1)}τ, current is ${fmt(m.i)} A and energy is ${fmt(m.energy,3)} J.\u003c/p>\u003cp>The supply is gone. The \u003cb>magnetic field supplies the energy\u003c/b>, which becomes heat in the resistor. The coil voltage reverses; the current initially keeps its direction. Doubling current would quadruple stored energy for this constant L, and quadruple wire heating if wire resistance stayed fixed.\u003c/p>`},\n {id:'3.2.3',chapter:3,title:'Four joules, two amps',kind:'energy',mode:'build',lesson:'You need a magnetic energy store, but the wire is limited to 2 A. Choose its inductance and operating current.',goal:'Store 4 J while keeping current at or below 2 A.',fixed:'Ideal linear inductor; constant L; no saturation in this model.',initial:{l:.5,i:1},controls:[select('l','Inductance',[[.5,'0.5 H'],[1,'1 H'],[2,'2 H']]),range('i','Current',0,4,.5,'A')],check:(p,m)=>near(m.energy,4)&&p.i\u003c=2,solution:{l:2,i:2},hint:'Energy scales directly with L but with the square of current.',rule:'For constant linear inductance, W = ½LI². Double L at fixed I: double energy. Double I at fixed L: four times the energy. Ideal L stores/releases energy; the coil’s resistance dissipates I²R heat. Saturating inductors require a nonlinear energy calculation, not blindly ½LI² with a fixed L.',explain:(p,m)=>`\u003cp>Your store holds \u003cb>${fmt(m.energy)} J\u003c/b>: ½ × ${p.l} × ${p.i}². A working design is \u003cb>2 H at 2 A\u003c/b>, giving 4 J.\u003c/p>\u003cp>Using more current is costly: doubling it quadruples both the stored energy and the heating of a fixed winding resistance. Here a larger inductance reaches the target within the current limit.\u003c/p>`},\n {id:'3.3',chapter:3,title:'The AC furnace',kind:'acheat',mode:'build',lesson:'A 12 V DC supply heats a 6 Ω resistor. Replace it with a sine-wave AC supply that gives the same average heating.',goal:'Choose the AC peak voltage that matches the DC heater’s 24 W.',fixed:'Fixed 6 Ω resistor; sine-wave AC; ideal source; compare average heating.',initial:{peak:12,r:6},controls:[select('peak','AC peak voltage',[[12,'12 V peak'],[12*Math.SQRT2,'17.0 V peak'],[24,'24 V peak']])],check:(p,m)=>near(m.p,24),solution:{peak:12*Math.SQRT2},hint:'For a sine wave, RMS is peak divided by √2. RMS—not the signed average voltage—sets resistor heating.',rule:'RMS = square root of the mean of the square. A sine wave has Vrms = Vpeak/√2 and Irms = Ipeak/√2. These √2 relations are waveform-specific. In a fixed resistor, average P = Vrms²/R = Irms²R. A sine wave can have zero mean voltage while heating continuously because v²/R is nonnegative.',explain:(p,m)=>`\u003cp>Your AC source has \u003cb>${fmt(m.vrms)} V RMS\u003c/b> and supplies \u003cb>${fmt(m.p)} W\u003c/b> of average heat. Matching 12 V DC requires 12 V RMS, or \u003cb>12√2 ≈ 17.0 V peak\u003c/b>.\u003c/p>\u003cp>Both voltage and resistor current reverse together. Their product stays nonnegative. Zero average voltage does not mean zero power.\u003c/p>`},\n {id:'3.4.1',chapter:3,title:'The frequency gate',kind:'ac',mode:'build',lesson:'The station needs less than 0.5 A from a 10 V RMS supply without increasing resistance. Choose the reactive component and frequency.',goal:'Make current less than 0.5 A and make it lag the supply voltage by more than 60°.',fixed:'R = 10 Ω; L = 31.83 mH or C = 318.3 μF; sinusoidal steady state; source 10 V RMS.',initial:{v:10,r:10,l:10/(2*Math.PI*50),c:1/(2*Math.PI*50*10),load:'rl',f:25},controls:[choice('load','Series component',[['rl','Inductor'],['rc','Capacitor'],['r','Wire only']]),select('f','Frequency',[[25,'25 Hz'],[50,'50 Hz'],[100,'100 Hz']])],check:(p,m)=>m.irms\u003c.5&&m.phi>60,solution:{load:'rl',f:100},hint:'Inductive reactance grows with frequency. Capacitive reactance shrinks with frequency.',rule:'XL = 2πfL; XC = 1/(2πfC). Series impedance Z = R + j(XL − XC); |Z| = √[R² + (XL − XC)²]. Irms = Vrms/|Z|. In a series RL load the current lags total supply voltage by atan(XL/R); it is not necessarily 90°. Phasors describe sinusoidal steady-state magnitudes and phase, not moving lumps of charge.',explain:(p,m)=>`\u003cp>At ${p.f} Hz, net reactance is \u003cb>${fmt(m.x)} Ω\u003c/b>, current is \u003cb>${fmt(m.irms,3)} A RMS\u003c/b>, and current ${m.phi>=0?'lags':'leads'} voltage by ${fmt(Math.abs(m.phi),1)}°.\u003c/p>\u003cp>The working route is the \u003cb>inductor at 100 Hz\u003c/b>: XL = 20 Ω, |Z| ≈ 22.36 Ω and I ≈ 0.447 A. A capacitor behaves oppositely with frequency: its reactance decreases as frequency increases.\u003c/p>`},\n {id:'3.4.2',chapter:3,title:'Which arrow arrives first?',kind:'ac',mode:'predict',lesson:'A resistor and capacitor are in series. Their resistance and capacitive reactance have equal magnitudes.',goal:'Predict how current is phased relative to the total supply voltage.',fixed:'R = 10 Ω; XC = 10 Ω; no inductor; sine-wave steady state. Arrows use RMS magnitudes.',initial:{v:20,r:10,l:0,c:1/(2*Math.PI*50*10),load:'rc',f:50,answer:''},controls:[choice('answer','Current relative to supply voltage',[['lead45','Leads by 45°'],['lag45','Lags by 45°'],['same','In phase'],['lead90','Leads by 90°']])],check:p=>p.answer==='lead45',solution:{answer:'lead45'},hint:'A pure capacitor gives 90° of current lead. Adding series resistance makes the angle smaller.',rule:'For a pure resistor, voltage and current are in phase. For a pure inductor, current lags its voltage by 90°. For a pure capacitor, current leads its voltage by 90°. A series RC load has impedance angle φ = −atan(XC/R); current therefore leads total supply voltage by |φ|. Phasor labels must distinguish RMS, peak and normalised arrows.',explain:()=>'\u003cp>Current \u003cb>leads by 45°\u003c/b>, because φ = atan(−10/10) = −45°. The capacitor makes current lead; the resistor reduces the angle from the pure-capacitor value of 90°.\u003c/p>\u003cp>The leading arrow is ahead in the direction of rotation. This is timing within the AC cycle, not current being stronger or faster through the wire.\u003c/p>'},\n {id:'3.5.1',chapter:3,title:'The power ledger',kind:'power',mode:'predict',lesson:'A load takes 100 V RMS and 10 A RMS. Its current lags voltage by 60°. Decide what the power meter and reactive-power meter read.',goal:'Identify average real power P and reactive power Q.',fixed:'Sinusoidal steady state; lagging inductive current; RMS quantities.',initial:{v:100,i:10,phi:60,pAnswer:'',qAnswer:''},controls:[select('pAnswer','Real power P',[['','Choose…'],[1000,'1000 W'],[500,'500 W'],[0,'0 W']]),select('qAnswer','Reactive power Q',[['','Choose…'],[500,'500 var'],[866,'866 var'],[1000,'1000 var']])],check:p=>Number(p.pAnswer)===500&&Number(p.qAnswer)===866,solution:{pAnswer:500,qAnswer:866},hint:'Apparent power is VI. Real power includes cos φ; reactive power includes sin φ.',rule:'Using RMS values in sinusoidal steady state: P = VI cosφ in W; Q = VI sinφ in var; S = VI in VA. S² = P² + Q² and power factor = P/S = cosφ. P and Q are perpendicular components, so S is not P + Q. An ideal reactive component returns its stored energy over a cycle, but its current can still cause real upstream I²R loss.',explain:()=>'\u003cp>\u003cb>P = 500 W\u003c/b>, \u003cb>Q ≈ +866 var\u003c/b>, and \u003cb>S = 1000 VA\u003c/b>. The load really consumes 500 joules each second on average. The reactive component exchanges energy back and forth.\u003c/p>\u003cp>A source and cable must carry the full 10 A, so reactive demand still matters for ratings and wire heating.\u003c/p>'},\n {id:'3.5.2',chapter:3,title:'Stop hauling reactive energy',kind:'comp',mode:'build',lesson:'An inductive load needs 500 W and +866 var at 100 V RMS. Add a capacitor bank near it to reduce current drawn upstream.',goal:'Reduce source current to at most 5.01 A while preserving the 500 W useful load.',fixed:'Load P and Q fixed; source voltage fixed; ideal capacitor; source and capacitor losses neglected.',initial:{p:500,ql:500*Math.sqrt(3),v:100,qc:0},controls:[select('qc','Capacitor bank magnitude',[[0,'0 var'],[250,'250 var'],[500,'500 var'],[500*Math.sqrt(3),'866 var'],[1000,'1000 var']])],check:(p,m)=>m.i\u003c=5.01,solution:{qc:500*Math.sqrt(3)},hint:'The capacitor supplies negative reactive power. Cancel +866 var with −866 var.',rule:'At fixed real P and voltage, source current is √(P² + Qnet²)/V for this single-phase model. Qnet = Qload − |Qcapacitor|. Correcting power factor reduces upstream current and cable loss; it does not remove the useful load’s real energy requirement or its own reactive exchange. Overcompensation can create net capacitive Q.',explain:(p,m)=>`\u003cp>Net reactive demand is \u003cb>${fmt(m.q)} var\u003c/b> and source current is \u003cb>${fmt(m.i,3)} A\u003c/b>. With 866 var of capacitive compensation, Qnet is zero and I = 500/100 = \u003cb>5 A\u003c/b>.\u003c/p>\u003cp>The useful load still consumes \u003cb>500 W\u003c/b>. The nearby capacitor handles the reactive exchange, so the upstream cable carries less current. You have reduced unnecessary transport, not created free energy.\u003c/p>`},\n\n {id:'4.1',chapter:4,title:'The DC transformer trap',kind:'xfmr',mode:'predict',lesson:'A 24 V DC source has been connected to a two-winding transformer for a long time. The switch-on transient has ended.',goal:'Predict the continuous secondary voltage and the primary heating risk.',fixed:'Steady DC; primary winding resistance 2 Ω; no current limiter; real core can saturate.',initial:{vp:24,np:200,ns:100,drive:'dc',rw:2,answer:''},controls:[choice('answer','After the transient…',[['zero-hot','Secondary 0 V; primary can overheat'],['twelve','Secondary stays at 12 V'],['zero-safe','Secondary 0 V; primary takes no current']])],check:p=>p.answer==='zero-hot',solution:{answer:'zero-hot'},hint:'A turns ratio does not turn steady flux into a changing flux.',rule:'A transformer needs changing linked flux for continuous secondary EMF. Steady DC produces no continuous secondary voltage. After the electrical transient, primary current can become limited mainly by winding resistance, causing excessive heat; DC switching can still produce brief secondary transients. A real AC transformer has nonzero magnetising current and core loss even with no secondary load.',explain:()=>'\u003cp>The steady secondary voltage is \u003cb>0 V\u003c/b>. The ordinary AC turns-ratio voltage rule requires changing flux.\u003c/p>\u003cp>With this 2 Ω winding, the eventual DC current estimate is 24/2 = \u003cb>12 A\u003c/b>, with \u003cb>288 W\u003c/b> of winding heat. At the very first instant, inductance limits the rate of current rise; the dangerous large current develops afterwards.\u003c/p>'},\n {id:'4.2',chapter:4,title:'Forge the turns ratio',kind:'xfmr',mode:'build',lesson:'A transformer’s two windings link the same changing core flux. Choose the secondary turn count for the required voltage.',goal:'Produce 46 V RMS from 230 V RMS.',fixed:'Ideal transformer; primary 1000 turns; sinusoidal AC; flux below saturation.',initial:{vp:230,np:1000,ns:100,load:46},controls:[select('ns','Secondary turns',[[100,'100 turns'],[200,'200 turns'],[500,'500 turns']])],check:(p,m)=>near(m.vs,46),solution:{ns:200},hint:'Vs/Vp = Ns/Np. The desired voltage is one fifth of the primary voltage.',rule:'Ideal transformer voltage ratio: Vs/Vp = Ns/Np. More secondary turns give higher secondary voltage. Two isolated windings exchange energy through the magnetic field, while electric charge remains in its own circuit. Real leakage flux and winding resistance make the ideal ratio an approximation under load.',explain:(p,m)=>`\u003cp>Your secondary voltage is \u003cb>${fmt(m.vs)} V RMS\u003c/b>. With 200 secondary turns, Vs = 230 × 200/1000 = \u003cb>46 V\u003c/b>.\u003c/p>\u003cp>Each turn experiences the same changing flux, so twice as many linked turns gives twice the induced voltage.\u003c/p>`},\n {id:'4.3',chapter:4,title:'No free watts',kind:'xfmr',mode:'predict',lesson:'An ideal transformer steps 230 V down to 23 V. The secondary supplies 5 A to a resistor.',goal:'Predict the primary current.',fixed:'Ideal lossless transformer; resistive load; AC RMS values; ignore magnetising current.',initial:{vp:230,np:1000,ns:100,load:4.6,answer:''},controls:[choice('answer','Primary current',[['0.5','0.5 A'],['5','5 A'],['50','50 A']])],check:p=>p.answer==='0.5',solution:{answer:'0.5'},hint:'Secondary power is 23 × 5 = 115 W. The primary must supply the same real power.',rule:'Ideal transformer real input power equals output power. For ideal load-current components, Is/Ip = Np/Ns, the inverse voltage ratio. A step-up transformer cannot multiply both voltage and available current while conserving power. Real input also supplies losses and a magnetising current component.',explain:()=>'\u003cp>Primary current is \u003cb>0.5 A\u003c/b>: 115 W / 230 V. Secondary current is ten times larger because its voltage is ten times smaller.\u003c/p>\u003cp>Energy is conserved. The transformer changes the combination of voltage and current used to transfer that power.\u003c/p>'},\n {id:'4.4',chapter:4,title:'The primary hears the load',kind:'xfmr',mode:'build',lesson:'A 24 V transformer has a 2:1 primary-to-secondary turns ratio. Its secondary load is currently 12 Ω. The source holds primary voltage and frequency fixed.',goal:'Double output power from 12 W to 24 W by changing only the load resistance.',fixed:'Ideal transformer; primary voltage and turns fixed; secondary 12 V RMS.',initial:{vp:24,np:200,ns:100,load:12},controls:[select('load','Secondary load',[[3,'3 Ω'],[6,'6 Ω'],[12,'12 Ω'],[24,'24 Ω']])],check:(p,m)=>near(m.pout,24),solution:{load:6},hint:'With secondary voltage fixed, Pout = Vs²/Rload.',rule:'With the primary AC voltage held fixed, additional secondary demand produces additional primary current. It does not require electrons to cross between the isolated windings. In an ideal transformer, the load is reflected into the primary and the source supplies its required power.',explain:(p,m)=>`\u003cp>The load receives \u003cb>${fmt(m.pout)} W\u003c/b>, secondary current is ${fmt(m.is)} A, and primary current is ${fmt(m.ip)} A.\u003c/p>\u003cp>Changing the load from 12 Ω to \u003cb>6 Ω\u003c/b> doubles secondary current and power. Primary current doubles too, supplying the extra energy. The main core flux stays approximately fixed because primary voltage, frequency and turns are fixed. The extra primary load current largely balances the secondary’s opposing ampere-turns; it does not simply add unopposed magnetising NI.\u003c/p>`},\n {id:'4.5',chapter:4,title:'The resistance mirror',kind:'xfmr',mode:'predict',lesson:'An 8 Ω load is connected to a transformer with 1000 primary turns and 200 secondary turns.',goal:'Predict the ideal input resistance seen by the source.',fixed:'Ideal transformer; resistive secondary load; below saturation.',initial:{vp:120,np:1000,ns:200,load:8,answer:''},controls:[choice('answer','Reflected resistance',[['200','200 Ω'],['40','40 Ω'],['1.6','1.6 Ω']])],check:p=>p.answer==='200',solution:{answer:'200'},hint:'Impedance transforms with the square of the turns ratio.',rule:'For an ideal transformer, Zin = (Np/Ns)² Zload. The square follows because voltage and current transform in opposite ratios. If secondary resistance halves, reflected primary resistance also halves and primary load current doubles for fixed primary voltage. At fixed voltage, frequency and turns, main core flux stays approximately fixed; the added primary load ampere-turns largely balance the secondary ampere-turns.',explain:()=>'\u003cp>The input resistance is \u003cb>200 Ω\u003c/b>: (1000/200)² × 8 = 25 × 8.\u003c/p>\u003cp>Using only one factor of five would miss the current transformation. Both voltage and current ratios contribute.\u003c/p>'},\n {id:'4.6',chapter:4,title:'Saturation: check what is fixed',kind:'xfmr',mode:'build',lesson:'A voltage-fed transformer was moved to a lower frequency. The same voltage now drives too much peak core flux.',goal:'Keep peak flux density at or below 1.5 T by changing the primary turns.',fixed:'Primary 120 V RMS at 25 Hz; core area 4 cm²; sine-wave flux; voltage is held fixed, not current.',initial:{vp:120,np:1000,ns:200,load:24,f:25,area:.0004},controls:[select('np','Primary turns',[[500,'500 turns'],[1000,'1000 turns'],[2000,'2000 turns']])],check:(p,m)=>m.bpeak\u003c=1.5,solution:{np:2000},hint:'At fixed AC voltage and frequency, more primary turns reduce the flux required per turn.',rule:'For approximately sinusoidal flux, Vp,rms ≈ 4.44 f Np Φpeak; Bpeak = Φpeak/A. At fixed Vp and Np, halving f doubles peak flux. At fixed AC voltage and frequency, increasing Np REDUCES peak flux and can prevent saturation. This differs from a current-driven coil: fixed I with more N increases NI. Always identify what is held fixed.',explain:(p,m)=>`\u003cp>Your peak flux density is \u003cb>${fmt(m.bpeak)} T\u003c/b>. With 2000 turns, Bpeak = 120/(4.44 × 25 × 2000 × 0.0004) ≈ \u003cb>1.35 T\u003c/b>.\u003c/p>\u003cp>\u003cb>This is the important exception to our earlier fixed-current coil example.\u003c/b> Here the voltage source sets the required rate of flux change. More turns need less flux per turn to generate that voltage; current adjusts.\u003c/p>`},\n {id:'4.7',chapter:4,title:'Keep heat out of the forge',kind:'xloss',mode:'build',lesson:'A transformer delivers 100 W at 5 A. Improve its winding resistance and laminated core to reduce losses.',goal:'Reach at least 92% efficiency without changing the useful output power.',fixed:'Output 100 W; secondary current 5 A; total winding resistance referred to the secondary; fixed core-loss estimates.',initial:{rw:.5,core:'solid',pout:100,is:5},controls:[select('rw','Total winding resistance referred to secondary',[[.1,'0.1 Ω'],[.2,'0.2 Ω'],[.5,'0.5 Ω']]),choice('core','Core construction',[['solid','Solid core: 10 W core loss'],['laminated','Laminated: 3 W core loss']])],check:(p,m)=>m.eta>=92,solution:{rw:.1,core:'laminated'},hint:'Input power must supply useful output plus copper and core losses.',rule:'Copper loss is approximately I²R. Core losses include hysteresis and eddy currents; laminations reduce eddy-current paths but do not eliminate every loss. Pin = Pout + losses and η = Pout/Pin. Real no-load primary current and core loss are not exactly zero.',explain:(p,m)=>`\u003cp>Copper loss is \u003cb>${fmt(m.copper)} W\u003c/b>; core loss is \u003cb>${fmt(m.coreLoss)} W\u003c/b>. The source supplies ${fmt(m.pin)} W, giving \u003cb>${fmt(m.eta)}%\u003c/b> efficiency.\u003c/p>\u003cp>With 0.1 Ω and the laminated-core estimate, losses total 5.5 W and efficiency is about 94.8%. The useful load still receives 100 W.\u003c/p>`},\n {id:'4.8',chapter:4,title:'Dots and isolated islands',kind:'xfmr',mode:'predict',lesson:'Both windings have a dot at their upper terminal. The primary dotted terminal is instantaneously positive relative to its lower terminal.',goal:'Predict secondary polarity and whether the windings share a direct copper connection.',fixed:'Ordinary ideal two-winding transformer; dots indicate corresponding instantaneous polarity.',initial:{vp:120,np:200,ns:100,load:12,polarity:'',isolation:''},controls:[choice('polarity','Secondary dotted terminal',[['positive','Positive at the same instant'],['negative','Negative at that instant']]),choice('isolation','Direct electrical connection between windings?',[['no','No: galvanically isolated'],['yes','Yes: shared copper path']])],check:p=>p.polarity==='positive'&&p.isolation==='no',solution:{polarity:'positive',isolation:'no'},hint:'Matching dots indicate matching instantaneous polarity. A magnetic link does not require a copper link.',rule:'Dot markings identify corresponding instantaneous winding polarity under a consistent voltage reference. An ordinary two-winding transformer can provide galvanic isolation; an autotransformer shares a winding and generally does not. Isolation does not remove the secondary circuit’s own voltage hazard.',explain:()=>'\u003cp>The secondary dotted terminal is \u003cb>positive at the same instant\u003c/b>. The windings are \u003cb>galvanically isolated\u003c/b>: energy crosses through the changing magnetic field, while each circuit retains its own charge carriers.\u003c/p>\u003cp>An autotransformer is a different construction and generally does not provide this isolation.\u003c/p>'},\n {id:'4.9',chapter:4,title:'A loaded transformer sags',kind:'xreg',mode:'build',lesson:'The no-load secondary is 24 V, but the winding’s resistance causes a drop when the load draws current.',goal:'Deliver at least 22 V at a fixed load current of 4 A.',fixed:'No-load 24 V; constant-current load 4 A; simplified resistance drop; leakage reactance and core loss omitted.',initial:{v0:24,is:4,rw:2},controls:[select('rw','Series winding resistance referred to secondary',[[.25,'0.25 Ω'],[.5,'0.5 Ω'],[1,'1 Ω'],[2,'2 Ω']])],check:(p,m)=>m.vload>=22,solution:{rw:.5},hint:'Terminal voltage is approximately no-load voltage minus I × winding resistance.',rule:'Real secondary terminal voltage can drop under load because of winding resistance and leakage impedance. In this simple resistive model, Vload = V0 − IsReq and copper loss = Is²Req. The ideal turns ratio alone does not describe real load regulation.',explain:(p,m)=>`\u003cp>The load receives \u003cb>${fmt(m.vload)} V\u003c/b>. The winding drop is ${fmt(m.drop)} V and winding heat is ${fmt(m.copper)} W.\u003c/p>\u003cp>At 0.5 Ω, the drop is 4 × 0.5 = 2 V, leaving \u003cb>22 V\u003c/b>. Reducing the resistance further also works and reduces heat.\u003c/p>`},\n\n {id:'5.1',chapter:5,title:'Turn current into force',kind:'force',mode:'build',lesson:'A straight wire carries current through a uniform magnetic field. Its angle matters.',goal:'Produce the maximum 0.4 N force without increasing current or field strength.',fixed:'B = 0.5 T; I = 4 A; wire length 0.2 m; θ is the angle between the wire/current direction and B.',initial:{angle:0,b:.5,i:4,length:.2},controls:[select('angle','Wire angle to the field',[[0,'0° — parallel'],[30,'30°'],[90,'90° — perpendicular']])],check:(p,m)=>near(m.force,.4),solution:{angle:90},hint:'The magnetic force includes sin θ. It vanishes for parallel current and field.',rule:'For a straight conductor in a uniform field, F = BIl sinθ. Force is perpendicular to both current and field, with direction set by their vector relationship. Changing orientation can change force even when B, I and l remain fixed.',explain:(p,m)=>`\u003cp>Your force is \u003cb>${fmt(m.force)} N\u003c/b>. At 90°, sin θ = 1 and F = 0.5 × 4 × 0.2 = \u003cb>0.4 N\u003c/b>.\u003c/p>\u003cp>At 0°, the wire is parallel to the field and the magnetic force is zero. Strong current alone does not guarantee force.\u003c/p>`},\n {id:'5.2',chapter:5,title:'Aim the rotor for torque',kind:'torque',mode:'build',lesson:'Opposite forces on a current-carrying coil create a turning effect. Aim the coil to maximise torque.',goal:'Produce 0.8 N·m while keeping current at 1 A.',fixed:'100 turns; B = 0.4 T; coil area 0.02 m²; θ is between the coil’s NORMAL and B.',initial:{angle:30,n:100,b:.4,a:.02,i:1},controls:[select('angle','Coil normal angle to field',[[0,'0°'],[30,'30°'],[90,'90°']])],check:(p,m)=>near(m.torque,.8),solution:{angle:90},hint:'This angle uses the coil’s normal. Maximum torque occurs when that normal is perpendicular to B.',rule:'For a simple coil in a uniform field, τ = NIAB sinθ, with θ between the coil’s normal and B. This is a different geometric angle from the straight-wire force formula. Mechanical shaft power is P = τω, with ω in rad/s.',explain:(p,m)=>`\u003cp>Your torque is \u003cb>${fmt(m.torque)} N·m\u003c/b>. At 90°, τ = 100 × 1 × 0.02 × 0.4 = \u003cb>0.8 N·m\u003c/b>.\u003c/p>\u003cp>The forces form a couple: a pair that rotates the coil. At zero normal-to-field angle, the torque is zero even though individual conductor forces may exist.\u003c/p>`},\n {id:'5.3',chapter:5,title:'The stalled motor',kind:'dcMotor',mode:'predict',lesson:'A DC motor is held stationary. Its rotor cannot develop back EMF from rotation.',goal:'Predict its stalled current after the brief electrical transient has settled.',fixed:'24 V DC; winding resistance 1 Ω; rotor stationary; ignore current limiting. This is not the exact instant t = 0.',initial:{v:24,r:1,ke:.2,kt:.2,stalled:true,answer:''},controls:[choice('answer','Stalled current',[['24','24 A'],['4','4 A'],['0','0 A']])],check:p=>p.answer==='24',solution:{answer:'24'},hint:'With speed zero, back EMF is approximately zero, leaving nearly the full supply across the winding resistance.',rule:'A simple DC motor obeys V = Eb + IR after electrical transients; more generally V = Eb + IR + L di/dt. At rest Eb ≈ 0, so eventual stall current can be V/R and very large. Inductance still prevents an instantaneous current jump at switch-on. Winding heating is I²R.',explain:()=>'\u003cp>The stalled current estimate is \u003cb>24 A\u003c/b>: (24 − 0)/1. The corresponding winding heat would be \u003cb>576 W\u003c/b>.\u003c/p>\u003cp>Once rotating, the motor develops opposing back EMF, reducing current. At the exact switch-on instant, inductance limits how rapidly current rises; our question was about the stalled condition after that transient.\u003c/p>'},\n {id:'5.4',chapter:5,title:'More shaft load, more current',kind:'dcMotor',mode:'build',lesson:'A fixed-voltage DC motor drives a heavier machine. Explore its steady speed and current as load torque rises.',goal:'Supply a 1 N·m shaft load and correctly predict the current change from the original 0.4 N·m load.',fixed:'24 V; R = 1 Ω; ke = 0.2 V/(rad/s); kt = 0.2 N·m/A; fixed flux; mechanical losses omitted.',initial:{v:24,r:1,ke:.2,kt:.2,load:.4,answer:''},controls:[select('load','Load torque',[[.4,'0.4 N·m'],[.8,'0.8 N·m'],[1,'1 N·m'],[1.2,'1.2 N·m']]),choice('answer','As load rises, current…',[['rises','Rises'],['falls','Falls'],['same','Stays unchanged']])],check:p=>Number(p.load)===1&&p.answer==='rises',solution:{load:1,answer:'rises'},hint:'A heavier load initially slows the motor. Lower speed means less back EMF and more current.',rule:'For a simple fixed-flux DC motor: Eb = keω, τ = ktI, V ≈ Eb + IR. More load initially slows the rotor, reducing Eb; current and torque then rise toward a new operating point. At fixed voltage, speed is not generally independent of load. Electromagnetic conversion power EbI = τω under consistent SI constants.',explain:(p,m)=>`\u003cp>Your motor takes \u003cb>${fmt(m.i)} A\u003c/b> and runs at \u003cb>${fmt(m.omega)} rad/s\u003c/b>. At 1 N·m, I = 1/0.2 = \u003cb>5 A\u003c/b>, Eb = 24 − 5 = 19 V, and ω = 19/0.2 = \u003cb>95 rad/s\u003c/b>.\u003c/p>\u003cp>Compared with the lighter load, speed falls and current rises. The supply provides additional input power; winding losses also rise.\u003c/p>`},\n {id:'5.5',chapter:5,title:'A generator needs a stronger push',kind:'generator',mode:'build',lesson:'A generator turns at a target speed. Adding electrical load creates opposing electromagnetic torque.',goal:'Deliver at least 36 W to the load, and match shaft input to the required mechanical power without exceeding 50 W.',fixed:'Target ω = 100 rad/s; generated EMF 20 V; internal resistance 0.5 Ω; no other losses.',initial:{emf:20,omega:100,ri:.5,load:19.5,pm:20},controls:[select('load','Electrical load',[[3.5,'3.5 Ω'],[9.5,'9.5 Ω'],[19.5,'19.5 Ω']]),select('pm','Mechanical shaft input',[[20,'20 W'],[40,'40 W'],[100,'100 W']])],check:(p,m)=>m.pout>=36&&p.pm\u003c=50&&near(p.pm,m.required),solution:{load:9.5,pm:40},hint:'The shaft must supply load power plus internal I²R loss. Extra electrical output creates extra opposing torque.',rule:'A generator converts mechanical input to electrical output. Loading it creates electromagnetic torque opposing the driving motion, consistent with Lenz’s law. To maintain speed, mechanical input must increase to cover electrical output plus losses. At a given speed, Pmech = τdriveω. Permanent magnets establish flux; they are not an unlimited energy supply.',explain:(p,m)=>`\u003cp>At the target speed, current is \u003cb>${fmt(m.i)} A\u003c/b>, load output is \u003cb>${fmt(m.pout)} W\u003c/b>, and internal heat is ${fmt(m.heat)} W. Required shaft power is \u003cb>${fmt(m.required)} W\u003c/b>.\u003c/p>\u003cp>With 9.5 Ω, the load receives 38 W and 2 W becomes heat, so the shaft must supply \u003cb>40 W\u003c/b>. Less mechanical input makes the rotor slow; more produces acceleration unless regulated.\u003c/p>`},\n {id:'5.6',chapter:5,title:'Build the rotating field',kind:'rotation',mode:'build',lesson:'Three stator windings carry currents separated by 120°. Together they create a rotating magnetic field.',goal:'Make the field rotate at 1500 rpm from a 50 Hz supply.',fixed:'Balanced three-phase 50 Hz; pole count refers to the total number of magnetic poles.',initial:{f:50,poles:2},controls:[select('poles','Stator poles',[[2,'2 poles'],[4,'4 poles'],[6,'6 poles'],[8,'8 poles']])],check:(p,m)=>near(m.ns,1500),solution:{poles:4},hint:'Synchronous speed in rpm is 120 × frequency / pole count.',rule:'Balanced three-phase stator currents produce a rotating field. Synchronous speed ns = 120f/Npoles rpm. Increasing pole count at fixed frequency lowers field speed. Reversing phase sequence reverses the field’s rotation; the electrical frequency and mechanical rotational frequency are related but are not generally the same number.',explain:(p,m)=>`\u003cp>The field speed is \u003cb>${fmt(m.ns)} rpm\u003c/b>. Four poles give 120 × 50/4 = \u003cb>1500 rpm\u003c/b>.\u003c/p>\u003cp>The winding currents vary with time, so the combined field rotates even though the copper windings stay still.\u003c/p>`},\n {id:'5.7',chapter:5,title:'An induction motor needs slip',kind:'slip',mode:'build',lesson:'An induction motor’s rotor must move relative to the rotating stator field to have induced rotor current.',goal:'Choose normal motoring operation with 5% slip and a 2.5 Hz rotor electrical frequency.',fixed:'Stator field 1500 rpm at 50 Hz. Torque curve is an illustrative induction-motor characteristic.',initial:{ns:1500,f:50,nr:1500},controls:[select('nr','Rotor speed',[[1500,'1500 rpm'],[1470,'1470 rpm'],[1425,'1425 rpm'],[1550,'1550 rpm']])],check:(p,m)=>near(m.slip,.05,.0001)&&near(m.fr,2.5),solution:{nr:1425},hint:'Slip = (field speed − rotor speed)/field speed. Rotor electrical frequency is slip × stator frequency.',rule:'s = (ns − nr)/ns and rotor electrical frequency fr = |s|f for its magnitude. The sign of sf describes reversed relative rotation / phase sequence in generating operation. Normal induction motoring needs positive slip. At exact synchronous speed an ideal induction motor has no induced rotor torque. Above synchronous speed it can generate. More slip gives more torque only in part of the operating range; torque eventually passes a maximum.',explain:(p,m)=>`\u003cp>Slip is \u003cb>${fmt(m.slip*100)}%\u003c/b>, and rotor electrical frequency is \u003cb>${fmt(m.fr)} Hz\u003c/b>. At 1425 rpm: s = (1500 − 1425)/1500 = \u003cb>0.05\u003c/b>; fr = 0.05 × 50 = \u003cb>2.5 Hz\u003c/b>.\u003c/p>\u003cp>At 1500 rpm the ideal rotor sees no relative rotating field, so its induced torque vanishes. This is different from a synchronous motor.\u003c/p>`},\n {id:'5.8',chapter:5,title:'The synchronous angle',kind:'synchronous',mode:'build',lesson:'A synchronous motor carries greater load by changing its rotor angle relative to the rotating field.',goal:'Carry 8 N·m without losing synchronism, and predict steady speed correctly.',fixed:'50 Hz, four poles; synchronous speed 1500 rpm; illustrative τ = 10 sinδ N·m characteristic; δ is an electrical load angle.',initial:{load:2,tmax:10,ns:1500,answer:''},controls:[select('load','Load torque',[[2,'2 N·m'],[5,'5 N·m'],[8,'8 N·m'],[12,'12 N·m']]),choice('answer','While it remains synchronised, steady speed…',[['same','Remains at 1500 rpm'],['lower','Falls below 1500 rpm'],['higher','Rises above 1500 rpm']])],check:(p,m)=>Number(p.load)===8&&p.answer==='same'&&m.stable,solution:{load:8,answer:'same'},hint:'A synchronous rotor can produce torque through an angular offset without steady slip.',rule:'A synchronised motor’s steady speed equals ns. Increasing load increases its torque/load angle while speed remains synchronous within its capability. It does not need the steady slip of an induction motor. Excessive load can cause loss of synchronism. The sine torque-angle law here is a simplified illustration, not a complete machine model.',explain:(p,m)=>m.stable?`\u003cp>Speed remains \u003cb>1500 rpm\u003c/b>. At ${p.load} N·m, the model’s electrical load angle is \u003cb>${fmt(m.delta,1)}°\u003c/b>. For 8 N·m, sinδ = 0.8, so δ ≈ 53.1 electrical degrees (26.6 mechanical degrees for this four-pole machine).\u003c/p>\u003cp>The rotor falls further behind in \u003cb>angle\u003c/b>, not continually behind in speed. At 12 N·m, demand exceeds this model’s 10 N·m maximum and synchronism cannot be maintained.\u003c/p>`:'\u003cp>\u003cb>This demand exceeds the motor’s modelled torque capability.\u003c/b> There is no steady synchronous angle that provides 12 N·m when the maximum is 10 N·m. The motor can lose synchronism.\u003c/p>'},\n {id:'5.9',chapter:5,title:'Count shaft watts correctly',kind:'shaft',mode:'build',lesson:'A motor must deliver mechanical power through a rotating shaft. Torque and speed both matter.',goal:'Deliver exactly 1000 W at 10 N·m and identify the electrical input needed at 80% efficiency.',fixed:'Shaft torque 10 N·m; efficiency 0.8; angular speed is in rad/s.',initial:{torque:10,omega:50,eta:.8,pAnswer:''},controls:[select('omega','Shaft angular speed',[[50,'50 rad/s'],[100,'100 rad/s'],[150,'150 rad/s']]),select('pAnswer','Required electrical input',[['','Choose…'],[1000,'1000 W'],[1250,'1250 W'],[2000,'2000 W']])],check:(p,m)=>near(m.pout,1000)&&Number(p.pAnswer)===1250,solution:{omega:100,pAnswer:1250},hint:'Mechanical power is torque × angular speed. Electrical input is output divided by efficiency.',rule:'Pshaft = τω, with ω in rad/s. To convert rpm: ω = 2πn/60. For a motor η = Pshaft/Pelectrical, so input exceeds useful output when losses are present. Torque alone is not power; a stationary shaft can have torque but zero mechanical power.',explain:(p,m)=>`\u003cp>Shaft output is \u003cb>${fmt(m.pout)} W\u003c/b>. At 100 rad/s, 10 × 100 = \u003cb>1000 W\u003c/b>. Input must be 1000/0.8 = \u003cb>1250 W\u003c/b>, leaving 250 W of total losses.\u003c/p>\u003cp>Putting rpm directly into τω would give the wrong units and number.\u003c/p>`},\n\n {id:'6.1',chapter:6,title:'Send power across the valley',kind:'transmission',mode:'build',lesson:'The valley needs a fixed 100 kW. Raise its receiving voltage to reduce cable heating.',goal:'Keep cable heat at or below 1 kW while still delivering 100 kW.',fixed:'Single-phase unity-power-factor / DC equivalent; total cable resistance 1 Ω; receiving load power fixed.',initial:{p:100000,v:1000,r:1},controls:[select('v','Receiving voltage',[[1000,'1 kV'],[2000,'2 kV'],[4000,'4 kV']])],check:(p,m)=>m.loss\u003c=1000,solution:{v:4000},hint:'At fixed delivered power, I = P/V. Cable loss uses cable resistance and that current: I²R.',rule:'At fixed delivered real power and power factor, increasing receiving voltage reduces current. Cable heat is I²R; doubling voltage quarters loss if cable resistance is unchanged. Use the voltage across the matching component in V = IR. Source power equals delivered power plus losses; source voltage includes the cable drop.',explain:(p,m)=>`\u003cp>Your current is \u003cb>${fmt(m.i)} A\u003c/b> and cable heat is \u003cb>${fmt(m.loss)} W\u003c/b>. At 4 kV, I = 100000/4000 = \u003cb>25 A\u003c/b>, and loss = 25² × 1 = \u003cb>625 W\u003c/b>.\u003c/p>\u003cp>The source supplies 100625 W. Charge is conserved through the series circuit; some electrical energy becomes cable heat.\u003c/p>`},\n {id:'6.2',chapter:6,title:'Three phases, one steady supply',kind:'phases',mode:'predict',lesson:'Three identical resistive loads are connected in balanced star. Their sinusoidal phase quantities are separated by 120°.',goal:'Predict neutral current and the behaviour of total instantaneous real power.',fixed:'Balanced sinusoidal three-phase system; identical resistive phases; ideal neutral.',initial:{vll:400,rphase:20,connection:'star',neutral:'',powerAnswer:''},controls:[choice('neutral','Neutral current',[['zero','Zero net current'],['three','Three times phase current'],['one','Same as one phase']]),choice('powerAnswer','Total instantaneous real power',[['steady','Constant'],['pulses','Falls to zero each half-cycle']])],check:p=>p.neutral==='zero'&&p.powerAnswer==='steady',solution:{neutral:'zero',powerAnswer:'steady'},hint:'At each instant the three balanced phase currents add to zero. Their power ripples cancel too.',rule:'Balanced phase quantities are separated by 120 electrical degrees. The instantaneous sum of balanced star phase currents is zero, so ideal neutral current is zero. For balanced sinusoidal loads, the total instantaneous real power is constant even though each individual phase’s instantaneous power varies. Unbalance or harmonics can change neutral-current behaviour.',explain:(p,m)=>`\u003cp>The ideal balanced neutral current is \u003cb>0 A\u003c/b>. Individual phase currents are nonzero but sum to zero at every instant.\u003c/p>\u003cp>Total real power is steady at \u003cb>${fmt(m.p)} W\u003c/b> for this resistive load. Each phase’s rise and fall is offset by the other two.\u003c/p>`},\n {id:'6.3',chapter:6,title:'Star or delta?',kind:'phases',mode:'build',lesson:'Three 20 Ω windings can be connected in star or delta to a 400 V line-to-line supply.',goal:'Keep each winding at or below 240 V while delivering at least 7.5 kW total.',fixed:'Balanced resistive load; three identical 20 Ω windings; line-to-line supply fixed at 400 V.',initial:{vll:400,rphase:20,connection:'delta'},controls:[choice('connection','Winding connection',[['star','Star / Y'],['delta','Delta / Δ']])],check:(p,m)=>m.vphase\u003c=240&&m.p>=7500,solution:{connection:'star'},hint:'In star, winding voltage is line-to-line voltage divided by √3.',rule:'Balanced star: VLL = √3 Vphase and IL = Iphase. Balanced delta: VLL = Vphase and IL = √3 Iphase. Line voltage and phase voltage are different quantities; line current and phase current depend on connection. The same three resistors draw three times as much total power in delta as in star at the same VLL.',explain:(p,m)=>`\u003cp>Each winding sees \u003cb>${fmt(m.vphase)} V\u003c/b>, line current is ${fmt(m.il)} A, and total power is \u003cb>${fmt(m.p)} W\u003c/b>.\u003c/p>\u003cp>Star gives 400/√3 ≈ \u003cb>230.9 V\u003c/b> per winding and 8 kW total. Delta would put 400 V across every winding and draw 24 kW with these same resistances.\u003c/p>`},\n {id:'6.4',chapter:6,title:'Three wires carry the bill',kind:'threepower',mode:'build',lesson:'A balanced three-phase load takes 100 kW at 400 V line-to-line and power factor 0.8. Size the cable using the correct line current.',goal:'Choose the correct line-current estimate and keep total three-conductor heating below 2.5 kW.',fixed:'Receiving load P = 100 kW; receiving VLL = 400 V; load power factor 0.8; each phase conductor has the selected resistance.',initial:{p:100000,vll:400,pf:.8,rphase:.1,iAnswer:''},controls:[select('iAnswer','Line-current estimate',[['','Choose…'],[144.34,'144.3 A'],[180.42,'180.4 A'],[312.5,'312.5 A']]),select('rphase','Resistance of each conductor',[[.1,'0.10 Ω'],[.05,'0.05 Ω'],[.02,'0.02 Ω']])],check:(p,m)=>Number(p.iAnswer)===180.42&&m.loss\u003c=2500,solution:{iAnswer:180.42,rphase:.02},hint:'P = √3 VLL IL cosφ. Total cable heating is 3IL²Rphase.',rule:'Balanced sinusoidal three-phase power: P = √3 VLL IL cosφ; Q = √3 VLL IL sinφ; S = √3 VLL IL. Use line-to-line voltage with line current in these formulas. For three equal phase conductors, total copper loss is 3IL²Rphase, not merely IL²Rphase.',explain:(p,m)=>`\u003cp>Line current is \u003cb>${fmt(m.i)} A\u003c/b>: 100000/(√3 × 400 × 0.8). With your conductor resistance, total heat is \u003cb>${fmt(m.loss)} W\u003c/b>.\u003c/p>\u003cp>At 0.02 Ω per conductor, loss is about \u003cb>1953 W\u003c/b>. Using 144.3 A would wrongly assume unity power factor.\u003c/p>`},\n {id:'6.5',chapter:6,title:'Compensate near the motor',kind:'gridcomp',mode:'build',lesson:'A three-phase motor load consumes 100 kW at power factor 0.6. Place a capacitor bank beside it to reduce upstream current.',goal:'Reach net receiving-load power factor of at least 0.99 while preserving the 100 kW useful load.',fixed:'Receiving VLL = 400 V; real load power fixed; inductive Q = 133.33 kvar; ideal capacitor; conductor resistance 0.1 Ω per phase.',initial:{p:100000,vll:400,ql:100000*4/3,qc:0,rphase:.1},controls:[select('qc','Capacitor bank magnitude',[[0,'0 kvar'],[50000,'50 kvar'],[100000,'100 kvar'],[100000*4/3,'133.33 kvar']])],check:(p,m)=>m.pf>=.99,solution:{qc:100000*4/3},hint:'Cancel the motor’s inductive reactive demand locally. Useful real power remains 100 kW.',rule:'Power-factor correction offsets inductive Q with capacitive Q. For a fixed three-phase P and VLL, IL = √(P² + Qnet²)/(√3 VLL). Reducing upstream current reduces conductor heat and required VA. It does not automatically reduce the motor’s real mechanical-energy requirement, and the motor still has its own local reactive exchange.',explain:(p,m)=>`\u003cp>Net receiving-load power factor is \u003cb>${fmt(m.pf,3)}\u003c/b>, line current is \u003cb>${fmt(m.i)} A\u003c/b>, and cable heat is ${fmt(m.loss)} W.\u003c/p>\u003cp>Full compensation reduces line current from about 240.6 A to \u003cb>144.3 A\u003c/b>. The motor still receives 100 kW; the nearby capacitor changes where the reactive current is supplied. The source also supplies cable losses, so its exact power factor differs from the receiving-load factor shown here.\u003c/p>`},\n {id:'6.6',chapter:6,title:'Angles send watts; voltage moves vars',kind:'flow',mode:'build',lesson:'Two AC buses are connected by an ideal inductive line. They have the same frequency but can have different phase angles and voltage magnitudes.',goal:'Send active power from the generator bus to the receiving bus, with sending-end reactive power above +0.1 pu.',fixed:'Receiving voltage 1 pu; line reactance 0.4 pu; lossless simplified per-phase equivalent; both buses 50 Hz.',initial:{vs:1,delta:0,x:.4,vr:1},controls:[select('delta','Generator voltage angle relative to receiving bus',[[-15,'−15°'],[0,'0°'],[15,'+15°']]),select('vs','Generator voltage magnitude',[[.95,'0.95 pu'],[1,'1.00 pu'],[1.05,'1.05 pu']])],check:(p,m)=>m.p>0&&m.q>.1,solution:{delta:15,vs:1.05},hint:'A positive generator angle sends active power forward. Raising generator voltage tends to increase reactive output.',rule:'For this lossless inductive connection, P = VsVr sinδ/X and Qsending = (Vs² − VsVr cosδ)/X. Active power depends strongly on voltage-angle difference; reactive power depends strongly on magnitude difference. These effects are coupled, not perfectly independent. Phase angle is not frequency: two buses can share 50 Hz with a steady angle offset.',explain:(p,m)=>`\u003cp>Sending-end active power is \u003cb>${fmt(m.p,3)} pu\u003c/b> and reactive power is \u003cb>${fmt(m.q,3)} pu\u003c/b>. A working setting is δ = +15° and Vs = 1.05 pu.\u003c/p>\u003cp>Negative δ reverses active flow. Changing voltage magnitude affects reactive behaviour strongly, while also influencing active power through the full equations.\u003c/p>`},\n {id:'6.7',chapter:6,title:'Borrow energy from the rotor',kind:'frequency',mode:'build',lesson:'Electrical demand suddenly exceeds mechanical input by 20 MW. Rotating kinetic energy initially fills the gap.',goal:'Keep the magnitude of the INITIAL frequency fall at or below 1 Hz/s by choosing inertia.',fixed:'50 Hz; 100 MVA base; 20 MW power deficit; first second only; no governor action or losses in this energy model.',initial:{h:2,base:100,deficit:20,t:1,f0:50},controls:[select('h','Inertia constant H',[[2,'2 s'],[4,'4 s'],[8,'8 s']]),range('t','Time after load step',0,1,.1,'s')],check:(p,m)=>Math.abs(m.rocof)\u003c=1,solution:{h:8,t:1},hint:'More stored kinetic energy makes the initial speed and frequency change slower; it does not provide permanent input power.',rule:'Rotating energy is E = ½Jω², not “momentum energy.” At nominal frequency E0 = H Sbase. Initially df/dt = f0(Pmechanical − Pelectrical)/(2H Sbase). A generation deficit draws down rotor kinetic energy, reducing speed and frequency. Greater inertia slows the initial change but cannot correct a sustained power deficit.',explain:(p,m)=>`\u003cp>Initial frequency slope is \u003cb>${fmt(m.rocof)} Hz/s\u003c/b>. The short-time energy model gives ${fmt(m.f,3)} Hz after ${fmt(p.t,1)} s.\u003c/p>\u003cp>H = 8 s gives an initial fall of \u003cb>0.625 Hz/s\u003c/b>. The rotor supplies the missing energy temporarily. Unless input or demand changes, its energy continues to fall.\u003c/p>`},\n {id:'6.8',chapter:6,title:'Use the right controls',kind:'controls',mode:'build',lesson:'Demand is 100 MW, but mechanical input is only 80 MW. Bus voltage is also below target. Choose the two appropriate control actions.',goal:'Stop the power deficit and set the voltage reference to 1.00 pu.',fixed:'Electrical demand 100 MW; frequency is already below nominal. Power balance stops further falling; it does not instantly restore lost speed.',initial:{pm:80,pe:100,vref:.95},controls:[select('pm','Governor: mechanical input',[[80,'80 MW'],[90,'90 MW'],[100,'100 MW'],[110,'110 MW']]),select('vref','Excitation / AVR voltage reference',[[.95,'0.95 pu'],[1,'1.00 pu'],[1.05,'1.05 pu']])],check:p=>Number(p.pm)===100&&Number(p.vref)===1,solution:{pm:100,vref:1},hint:'Mechanical power balance controls acceleration and frequency. Excitation primarily controls voltage/reactive behaviour.',rule:'Governors adjust mechanical input in response to speed/frequency. Excitation and the AVR primarily control voltage and reactive-power behaviour. Matching real input and demand stops further kinetic-energy loss. Primary droop response can leave a frequency offset; secondary regulation restores nominal frequency. Inertia, governor control and voltage control have different jobs.',explain:(p,m)=>`\u003cp>Your real-power imbalance is \u003cb>${fmt(m.balance)} MW\u003c/b> and voltage reference is \u003cb>${fmt(p.vref,2)} pu\u003c/b>.\u003c/p>\u003cp>Set mechanical input to \u003cb>100 MW\u003c/b> to stop the deficit, and AVR reference to \u003cb>1.00 pu\u003c/b> for voltage. Frequency remains below nominal until extra energy restores the rotor’s speed; that is the final room.\u003c/p>`},\n {id:'6.9',chapter:6,title:'Restore 50 Hz, then balance',kind:'recovery',mode:'build',lesson:'The grid is balanced again, but frequency is still 49 Hz. Put back the lost kinetic energy, then return mechanical input to demand.',goal:'Restore frequency to within 0.02 Hz of 50 Hz, then leave final mechanical input at 100 MW.',fixed:'H = 4 s on 100 MVA base; initial frequency 49 Hz; demand 100 MW; lossless short-time energy model.',initial:{boost:100,duration:.8,final:120,h:4,base:100,initialF:49,targetF:50,pe:100},controls:[select('boost','Temporary mechanical input',[[100,'100 MW'],[110,'110 MW'],[120,'120 MW']]),select('duration','Boost duration',[[.4,'0.4 s'],[.8,'0.8 s'],[1.6,'1.6 s']]),select('final','Mechanical input afterwards',[[100,'100 MW'],[120,'120 MW']])],check:(p,m)=>near(m.f,50,.02)&&Number(p.final)===100,solution:{boost:120,duration:.8,final:100},hint:'A brief power surplus restores kinetic energy. Once speed is recovered, input should match demand again.',rule:'After frequency has fallen, matching power stops the fall but does not restore the missing kinetic energy. A temporary mechanical surplus can restore speed. Here ΔE = (Pboost − Pload)t, and frequency follows √E because E ∝ ω². After recovery, input must again match demand, or frequency will continue changing. This illustrates the job of further regulation after primary response.',explain:(p,m)=>`\u003cp>The boost adds \u003cb>${fmt(m.added)} MJ\u003c/b>, producing \u003cb>${fmt(m.f,3)} Hz\u003c/b>. Final power imbalance is ${fmt(m.finalBalance)} MW.\u003c/p>\u003cp>The rotor needs about \u003cb>15.84 MJ\u003c/b> to recover from 49 to 50 Hz in this model. A 20 MW surplus for 0.8 s adds 16 MJ, bringing frequency to about \u003cb>50.01 Hz\u003c/b>. Returning input to 100 MW then holds the recovered energy.\u003c/p>`}\n ];\n return {chapters,levels,near,fmt};\n})();\n\u003c/script>\u003cscript id=\"game-engine\">'use strict';\nconst EnergyGame=(()=>{\n const {chapters,levels,fmt}=Course,$=id=>document.getElementById(id),STORE='redstone-energy-lab-v1';\n const escape=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const clone=x=>JSON.parse(JSON.stringify(x));\n let saved={version:1,results:{},last:0,createdAt:new Date().toISOString()},storageOK=true;\n try{const raw=localStorage.getItem(STORE)||$('saved-progress').textContent;const parsed=JSON.parse(raw);if(parsed?.version===1&&parsed.results&&typeof parsed.results==='object')saved={...saved,...parsed};}catch(e){storageOK=false;}\n let index=Math.max(0,Math.min(levels.length-1,Number(saved.last)||0)),p={},feedback=null,hintOpen=false,seen=false,assisted=false,moves=[],animation=null,phase=0,generatedReport=null;\n const current=()=>levels[index];\n const done=id=>saved.results[id]?.status==='solved';\n const number=(x,fallback=0)=>Number.isFinite(Number(x))?Number(x):fallback;\n function model(l,params,at=phase){\n  const q=params,n=(k,d=0)=>number(q[k],d),kind=l.kind;\n  if(kind==='induction')return{emf:0,flux:.002,n:100};\n  if(kind==='rl'){const v=n('v'),r=n('r'),ll=n('l'),u=n('u'),i=v/r*(1-Math.exp(-u)),vl=v-r*i;return{i,vl,tau:ll/r,time:u*ll/r,final:v/r,energy:.5*ll*i*i,source:v*i,heat:i*i*r};}\n  if(kind==='discharge'){const i0=n('i0'),ll=n('l'),r=n('r'),i=i0*Math.exp(-n('u'));return{invalid:q.path!=='resistor',i,vl:-r*i,tau:ll/r,energy:.5*ll*i*i,initialEnergy:.5*ll*i0*i0,heat:i*i*r,time:n('u')*ll/r};}\n  if(kind==='energy')return{energy:.5*n('l')*n('i')**2,i:n('i'),l:n('l')};\n  if(kind==='acheat'){const vrms=n('peak')/Math.SQRT2,r=n('r'),theta=at*2*Math.PI,v=n('peak')*Math.sin(theta),i=v/r;return{vrms,irms:vrms/r,p:vrms*vrms/r,v,i,pNow:v*i,peak:n('peak')};}\n  if(kind==='ac'){const r=n('r'),f=n('f'),x=q.load==='rl'?2*Math.PI*f*n('l'):q.load==='rc'?-1/(2*Math.PI*f*n('c')):0,z=Math.hypot(r,x),phi=Math.atan2(x,r),irms=n('v')/z,theta=at*2*Math.PI;return{x,z,phi:phi*180/Math.PI,phiRad:phi,irms,vrms:n('v'),real:irms**2*r,reactive:irms**2*x,apparent:n('v')*irms,v:Math.SQRT2*n('v')*Math.sin(theta),i:Math.SQRT2*irms*Math.sin(theta-phi)};}\n  if(kind==='power'){const s=n('v')*n('i'),angle=n('phi')*Math.PI/180;return{p:s*Math.cos(angle),q:s*Math.sin(angle),s,pf:Math.cos(angle)};}\n  if(kind==='comp'||kind==='gridcomp'){const real=n('p'),qnet=n('ql')-n('qc'),s=Math.hypot(real,qnet),i=s/(kind==='gridcomp'?Math.sqrt(3)*n('vll'):n('v')),pf=real/s;return{p:real,q:qnet,s,i,pf,loss:kind==='gridcomp'?3*i*i*n('rphase'):0};}\n  if(kind==='xfmr'){const vp=n('vp'),np=n('np'),ns=n('ns'),dc=q.drive==='dc',vs=dc?0:vp*ns/np,is=dc?0:vs/n('load',24),ip=dc?vp/n('rw',2):vs*is/vp,pout=vs*is,pin=dc?vp*ip:pout,rin=(np/ns)**2*n('load',24),f=n('f',50),bpeak=vp/(4.44*f*np*n('area',.001));return{vp,np,ns,vs,is,ip,pout,pin,rin,bpeak,dc,ratio:ns/np};}\n  if(kind==='xloss'){const copper=n('is')**2*n('rw'),coreLoss=q.core==='laminated'?3:10,pin=n('pout')+copper+coreLoss;return{copper,coreLoss,pin,pout:n('pout'),eta:n('pout')/pin*100};}\n  if(kind==='xreg'){const drop=n('is')*n('rw'),vload=n('v0')-drop,copper=n('is')**2*n('rw');return{drop,vload,copper,pout:vload*n('is'),pin:n('v0')*n('is')};}\n  if(kind==='force')return{force:n('b')*n('i')*n('length')*Math.sin(n('angle')*Math.PI/180)};\n  if(kind==='torque')return{torque:n('n')*n('i')*n('a')*n('b')*Math.sin(n('angle')*Math.PI/180)};\n  if(kind==='dcMotor'){const i=q.stalled?n('v')/n('r'):n('load')/n('kt'),eb=q.stalled?0:n('v')-i*n('r'),omega=eb/n('ke'),torque=n('kt')*i;return{i,eb,omega,torque,heat:i*i*n('r'),pin:n('v')*i,pout:torque*omega,rpm:omega*30/Math.PI};}\n  if(kind==='generator'){const i=n('emf')/(n('ri')+n('load')),vload=i*n('load'),pout=vload*i,heat=i*i*n('ri'),required=n('emf')*i;return{i,vload,pout,heat,required,torque:required/n('omega'),balance:n('pm')-required};}\n  if(kind==='rotation')return{ns:120*n('f')/n('poles'),f:n('f'),poles:n('poles')};\n  if(kind==='slip'){const slip=(n('ns')-n('nr'))/n('ns'),ratio=slip/.2,torque=20*ratio/(1+ratio*ratio);return{slip,fr:Math.abs(slip)*n('f'),signedFr:slip*n('f'),torque,ns:n('ns'),nr:n('nr')};}\n  if(kind==='synchronous'){const stable=n('load')\u003c=n('tmax'),delta=stable?Math.asin(n('load')/n('tmax'))*180/Math.PI:null;return{stable,delta,ns:n('ns'),torque:n('load')};}\n  if(kind==='shaft'){const pout=n('torque')*n('omega'),pin=pout/n('eta');return{pout,pin,loss:pin-pout,rpm:n('omega')*30/Math.PI,omega:n('omega')};}\n  if(kind==='transmission'){const i=n('p')/n('v'),loss=i*i*n('r'),drop=i*n('r');return{i,loss,drop,pout:n('p'),pin:n('p')+loss,vs:n('v')+drop,vload:n('v')};}\n  if(kind==='phases'){const star=q.connection==='star',vphase=star?n('vll')/Math.sqrt(3):n('vll'),iphase=vphase/n('rphase'),il=star?iphase:Math.sqrt(3)*iphase,power=3*vphase*iphase,theta=at*2*Math.PI,phaseCurrents=[0,-2*Math.PI/3,2*Math.PI/3].map(a=>Math.SQRT2*iphase*Math.sin(theta+a));return{vphase,iphase,il,p:power,phaseCurrents,neutral:phaseCurrents.reduce((a,b)=>a+b,0),star};}\n  if(kind==='threepower'){const s=n('p')/n('pf'),i=s/(Math.sqrt(3)*n('vll')),qvar=n('p')*Math.tan(Math.acos(n('pf')));return{i,s,q:qvar,p:n('p'),loss:3*i*i*n('rphase')};}\n  if(kind==='flow'){const delta=n('delta')*Math.PI/180,power=n('vs')*n('vr')*Math.sin(delta)/n('x'),qvar=(n('vs')**2-n('vs')*n('vr')*Math.cos(delta))/n('x');return{p:power,q:qvar,delta:n('delta'),vs:n('vs')};}\n  if(kind==='frequency'){const initialEnergy=n('h')*n('base'),energy=initialEnergy-n('deficit')*n('t'),f=n('f0')*Math.sqrt(Math.max(0,energy/initialEnergy)),rocof=-n('f0')*n('deficit')/(2*n('h')*n('base'));return{initialEnergy,energy,f,rocof,used:n('deficit')*n('t')};}\n  if(kind==='controls')return{balance:n('pm')-n('pe'),vref:n('vref')};\n  if(kind==='recovery'){const nominalEnergy=n('h')*n('base'),initialEnergy=nominalEnergy*(n('initialF')/n('targetF'))**2,added=(n('boost')-n('pe'))*n('duration'),f=n('targetF')*Math.sqrt((initialEnergy+added)/nominalEnergy);return{nominalEnergy,initialEnergy,added,f,finalBalance:n('final')-n('pe'),needed:nominalEnergy-initialEnergy};}\n  return{};\n }\n function measurements(l,m){\n  const q=p,u=(v,unit,d=2)=>Number.isFinite(v)?fmt(v,d)+' '+unit:'—';\n  switch(l.kind){\n   case'induction':return[['Flux per turn',u(m.flux*1000,'mWb')],['Induced voltage','0 V'],['Open-coil current','0 A']];\n   case'rl':return[['Current',u(m.i,'A')],['Coil voltage',u(m.vl,'V')],['Field energy',u(m.energy,'J',3)]];\n   case'discharge':return m.invalid?[['Current jump','Not physically valid'],['Open path','Voltage spike risk'],['Starting energy',u(m.initialEnergy,'J')]]:[['Current',u(m.i,'A')],['Coil voltage',u(m.vl,'V')],['Field energy',u(m.energy,'J',3)]];\n   case'energy':return[['Stored energy',u(m.energy,'J')],['Current',u(m.i,'A')],['Inductance',u(m.l,'H')]];\n   case'acheat':return[['AC RMS voltage',u(m.vrms,'V')],['Average heater power',u(m.p,'W')],['DC comparison','24 W']];\n   case'ac':return[['Current RMS',u(m.irms,'A',3)],['Reactance',u(m.x,'Ω')],['Current phase',(m.phi>0?'Lags ':m.phi\u003c0?'Leads ':'In phase ')+fmt(Math.abs(m.phi),1)+'°']];\n   case'power':return[['Real P',u(m.p,'W')],['Reactive Q',u(m.q,'var')],['Apparent S',u(m.s,'VA')]];\n   case'comp':return[['Net reactive Q',u(m.q,'var')],['Source current',u(m.i,'A',3)],['Useful real power',u(m.p,'W')]];\n   case'xfmr':if(l.id==='4.5')return[['Input resistance',u(m.rin,'Ω')],['Primary current',u(m.ip,'A')],['Output power',u(m.pout,'W')]];if(l.id==='4.6')return[['Peak flux density',u(m.bpeak,'T')],['Frequency',u(number(q.f),'Hz')],['Primary turns',fmt(number(q.np),0)]];return[['Secondary voltage',u(m.vs,'V')],['Secondary current',u(m.is,'A')],['Primary current',u(m.ip,'A')]];\n   case'xloss':return[['Copper heat',u(m.copper,'W')],['Core loss',u(m.coreLoss,'W')],['Efficiency',u(m.eta,'%')]];\n   case'xreg':return[['Loaded output',u(m.vload,'V')],['Winding drop',u(m.drop,'V')],['Winding heat',u(m.copper,'W')]];\n   case'force':return[['Magnetic force',u(m.force,'N')],['Current','4 A'],['Field','0.5 T']];\n   case'torque':return[['Torque',u(m.torque,'N·m')],['Coil current','1 A'],['Field','0.4 T']];\n   case'dcMotor':return[['Current',u(m.i,'A')],['Back EMF',u(m.eb,'V')],['Speed',u(m.omega,'rad/s')]];\n   case'generator':return[['Load output',u(m.pout,'W')],['Required shaft input',u(m.required,'W')],['Shaft surplus / deficit',u(m.balance,'W')]];\n   case'rotation':return[['Field speed',u(m.ns,'rpm')],['Supply frequency',u(m.f,'Hz')],['Poles',fmt(m.poles,0)]];\n   case'slip':return[['Slip',u(m.slip*100,'%')],['Rotor frequency magnitude',u(m.fr,'Hz')],['Model torque',u(m.torque,'N·m')]];\n   case'synchronous':return[['Synchronism',m.stable?'Maintained':'Lost'],['Steady speed',m.stable?u(m.ns,'rpm'):'No synchronous state'],['Load angle',m.stable?u(m.delta,'°'):'Beyond capability']];\n   case'shaft':return[['Shaft output',u(m.pout,'W')],['Electrical input',u(m.pin,'W')],['Losses',u(m.loss,'W')]];\n   case'transmission':return[['Cable current',u(m.i,'A')],['Cable heat',u(m.loss,'W')],['Source power',u(m.pin/1000,'kW',3)]];\n   case'phases':return[['Winding voltage',u(m.vphase,'V')],['Line current',u(m.il,'A')],['Total real power',u(m.p/1000,'kW')]];\n   case'threepower':return[['Line current',u(m.i,'A')],['Cable heat',u(m.loss/1000,'kW',3)],['Apparent power',u(m.s/1000,'kVA')]];\n   case'gridcomp':return[['Net receiving-load power factor',fmt(m.pf,3)],['Line current',u(m.i,'A')],['Cable heat',u(m.loss/1000,'kW')]];\n   case'flow':return[['Active power sent',u(m.p,'pu',3)],['Sending reactive Q',u(m.q,'pu',3)],['Bus frequency','50 Hz on both']];\n   case'frequency':return[['Initial frequency slope',u(m.rocof,'Hz/s',3)],['Frequency now',u(m.f,'Hz',3)],['Kinetic energy used',u(m.used,'MJ')]];\n   case'controls':return[['Real-power balance',u(m.balance,'MW')],['Voltage reference',u(m.vref,'pu')],['Frequency recovery','Still needed']];\n   case'recovery':return[['Recovered frequency',u(m.f,'Hz',3)],['Energy restored',u(m.added,'MJ')],['Final power imbalance',u(m.finalBalance,'MW')]];\n   default:return[];\n  }\n }\n function persist(){saved.last=index;try{localStorage.setItem(STORE,JSON.stringify(saved));storageOK=true;}catch(e){storageOK=false;}$('save-status').textContent=storageOK?'Progress saves in this browser. Export your record to keep a separate copy.':'Storage is unavailable here. Export your record before closing.';}\n function result(){return saved.results[current().id]||{attempts:[],status:'untried',help:false};}\n function saveDraft(){const l=current(),r=result();saved.results[l.id]={...r,draft:clone(p),reason:$('reason').value,confidence:$('confidence').value,help:r.help||assisted};persist();}\n function helpUsed(){assisted=true;const r=result();r.help=true;saved.results[current().id]=r;persist();}\n function stopAnimation(){if(animation!==null)cancelAnimationFrame(animation);animation=null;}\n function load(i){stopAnimation();speechStop();if($('reason')&&current()&&Object.keys(p).length)saveDraft();index=Math.max(0,Math.min(levels.length-1,i));const l=current(),r=result();p=clone(r.draft||l.initial);feedback=null;hintOpen=false;seen=(r.attempts?.length||0)>0||r.status==='reviewed'||r.status==='solved';assisted=!!r.help||seen;moves=[];phase=0;$('reason').value=r.reason||'';$('confidence').value=r.confidence||'0';render();persist();}\n function renderNav(){\n  $('chapters').innerHTML=chapters.map(c=>{const list=levels.filter(l=>l.chapter===c.id),count=list.filter(l=>done(l.id)).length;return`\u003cbutton class=\"chapter-button ${current().chapter===c.id?'active':''}\" data-chapter=\"${c.id}\" ${current().chapter===c.id?'aria-current=\"true\"':''}>\u003cspan class=\"chapter-number\">${c.id}\u003c/span>\u003cspan class=\"chapter-text\">\u003cstrong>${escape(c.name)}\u003c/strong>${escape(c.subtitle)}\u003c/span>\u003cspan class=\"chapt 'phases'){\n   const x=small?70:110,y=119,r=48;circle(x,y,r,null,C.line);const colors=[C.blue,C.copper,C.violet];for(let k=0;k\u003c3;k++){const a=phase*2*Math.PI-k*2*Math.PI/3;arrow(x,y,r*Math.cos(a),-r*Math.sin(a),colors[k]);text(['A','B','C'][k],x+(r+15)*Math.cos(a),y-(r+15)*Math.sin(a),12,colors[k]);}\n   const xx=small?w-83:w*.7,yy=120,rr=48,pts=[[xx,yy-rr],[xx-rr*.866,yy+rr*.5],[xx+rr*.866,yy+rr*.5]];\n   if(q.connection==='star'){for(const point of pts)line([point,[xx,yy]],C.green,3);circle(xx,yy,4,C.ink,null);line([[xx,yy],[xx+65,yy]],C.muted,1.5);text('N',Math.min(w-12,xx+70),yy-12,11,C.muted);}\n   else line([...pts,pts[0]],C.green,3);\n   text(q.connection==='star'?'Star / Y':'Delta / Δ',xx,yy+83,12,C.green);text('120° between phases',cx,24,12,C.muted);\n   if(reveal){line([[pad,h-45],[w-pad,h-45]],C.green,3);text('Balanced total real power is constant',cx,h-19,12,C.green);}else text('Predict neutral current and total power',cx,h-28,12,C.muted);\n  }else if(l.kind==='flow'){\n   const x1=pad+53,x2=w-pad-53,y=130,r=42;circle(x1,y,r,C.pale,C.green);circle(x2,y,r,C.pale,C.green);const a=Number(q.delta)*Math.PI/180;arrow(x1,y,32*Math.cos(a),-32*Math.sin(a),C.blue);arrow(x2,y,32,0,C.blue);line([[x1+r,y],[x2-r,y]],C.ink,2);if(Math.abs(m.p)>.001)arrow(cx-(m.p>0?22:-22),y,m.p>0?44:-44,0,C.copper,3);text('Generator bus',x1,53,12);text('Receiving bus',x2,53,12);text('Vs '+q.vs+' pu',x1,205,12);text('Vr 1 pu',x2,205,12);text('Same 50 Hz · Different phase angle allowed',cx,h-27,11,C.muted);\n  }else if(['frequency','recovery'].includes(l.kind)){\n   const gx=small?38:75,gy=64,gw=w-gx-pad,gh=h-118,min=l.kind==='frequency'?46.5:48.7,max=l.kind==='frequency'?50.2:51.3;\n   line([[gx,gy],[gx,gy+gh],[gx+gw,gy+gh]],C.line,1.3);const yFor=v=>gy+gh-(v-min)/(max-min)*gh;line([[gx,yFor(50)],[gx+gw,yFor(50)]],C.green,1,[4,4]);text('50 Hz',gx+gw-3,yFor(50)-10,11,C.green,'right');\n   const pts=[];for(let k=0;k\u003c=80;k++){const t=k/80;let f;if(l.kind==='frequency')f=q.f0*Math.sqrt(1-q.deficit*t/(q.h*q.base));else f=q.targetF*Math.sqrt((m.initialEnergy+(q.boost-q.pe)*q.duration*t)/m.nominalEnergy);pts.push([gx+t*gw,yFor(f)]);}line(pts,C.copper,2.5);text('Frequency (Hz)',gx,23,12,C.muted,'left');text(l.kind==='frequency'?'First second after load step':'During the chosen power boost',cx,h-20,12,C.muted);\n  }else{\n   const x1=pad+8,x2=w-pad-71,y=105;block(x1,y,62,70,10,C.pale,'Gen');block(x2,y,62,70,10,'#ead3ac','Load');line([[x1+62,y+22],[x2,y+22]],C.ink,2);line([[x1+62,y+44],[x2,y+44]],C.ink,2);arrow(cx-23,y+22,46,0,C.copper,2);\n   if(l.kind==='controls'){text('Governor → mechanical power',cx,35,12,C.green);text('Excitation / AVR → voltage',cx,h-29,12,C.blue);}\n   else{text('Useful load power stays fixed',cx,35,12,C.green);text(reveal?'Cable heat: '+fmt((m.loss||0)/1000,3)+' kW':'Set up the supply',cx,h-30,13,C.red);}\n   if(l.kind==='transmission')text('I = Pload / Vload',cx,212,12,C.muted);\n   else if(l.kind==='threepower'||l.kind==='gridcomp')text('Balanced three-phase supply',cx,212,12,C.muted);\n  }\n  ctx.restore();const desc=(reveal?measurements(l,m).map(([a,b])=>a+': '+b).join('. '):'Measurements hidden until your first check.')+' '+l.fixed;canvas.setAttribute('aria-label',l.title+'. '+desc);$('scene-description').textContent=desc;\n }\n function runVisual(){stopAnimation();if(current().mode==='predict'&&!seen)return;feedback=null;renderFeedback();const started=performance.now(),kind=current().kind,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(now){phase=Math.min(1,(now-started)/3000);if(['rl','discharge'].includes(kind)){p.u=phase*5;const input=document.querySelector('[data-param=\"u\"]');if(input){input.value=p.u;$('out-u').textContent=fmt(p.u,1)+' τ';}}renderMetrics();if(phase\u003c1&&!reduce)animation=requestAnimationFrame(frame);else{animation=null;saveDraft();}}if(reduce){phase=1;if(['rl','discharge'].includes(kind))p.u=5;renderMetrics();saveDraft();}else animation=requestAnimationFrame(frame);}\n new ResizeObserver(resize).observe(canvas);load(index);resize();\n return{model,measurements,load,get index(){return index;},get params(){return p;},get saved(){return saved;},get levels(){return levels;},get feedback(){return feedback;},check,solution,render};\n})();\n\u003c/script>\u003c/body>\u003c/html>\n","memory":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"description\" content=\"Twelve hands-on circuit puzzles about SR latches, D latches, flip-flops and timing. Works offline.\">\n\u003ctitle>Redstone Memory Lab — Parts 4–6\u003c/title>\n\u003cstyle>\n:root{--paper:#f4f3eb;--card:#fffef8;--ink:#25382d;--muted:#667568;--line:#d8ddd0;--green:#286447;--pale:#e6eedf;--red:#c54d37;--redpale:#fbe7df;--off:#84908a;--gold:#d28b27;--goldpale:#fff0cd;--shadow:0 5px 0 #25382d0c;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;color:var(--ink);background:var(--paper)}\n*{box-sizing:border-box}body{margin:0;background-image:linear-gradient(#d8ddd038 1px,transparent 1px),linear-gradient(90deg,#d8ddd038 1px,transparent 1px);background-size:24px 24px}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:11px 15px;font-weight:650;min-height:44px}button:hover:not(:disabled){border-color:var(--green);background:var(--pale)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover:not(:disabled){background:#1e5038;color:white}.ghost{background:transparent}.small{font-size:12px;min-height:36px;padding:8px 10px}.shell{max-width:1180px;margin:auto;padding:30px 30px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.cube{width:42px;height:42px;background:var(--green);box-shadow:inset 0 7px #72a064,inset -8px 0 #19462e;display:grid;place-items:center;color:#fff5d9;font-size:26px;font-weight:900}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;line-height:1.15;margin:4px 0}h2{font-size:27px;line-height:1.16;margin:8px 0 12px;letter-spacing:-.7px}h3{font-size:15px;margin:0 0 9px}p{line-height:1.55;margin:8px 0}.top-progress{text-align:right;font-size:13px;color:var(--muted);min-width:145px}.bar{height:5px;background:var(--line);border-radius:9px;margin-top:9px;overflow:hidden}.bar span{display:block;background:var(--green);height:100%;transition:width .25s}.layout{display:grid;grid-template-columns:236px 1fr;gap:24px;align-items:start}.sidebar{position:sticky;top:20px}.intro{font-size:13px;color:var(--muted);margin:0 0 19px}.chapter{margin-bottom:19px}.chapter-label{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;margin-bottom:8px}.chapter-label span{display:grid;place-items:center;width:25px;height:25px;background:var(--pale);border:1px solid var(--line);border-radius:5px}.level-button{display:flex;align-items:center;width:100%;text-align:left;border-color:transparent;background:transparent;gap:8px;padding:9px 10px;font-size:12px;font-weight:550;min-height:38px}.level-button .dot{width:17px;flex-shrink:0;color:var(--muted);font-size:12px}.level-button.selected{background:var(--green);color:#fff}.level-button.selected .dot{color:#fff}.level-button.done .dot{color:var(--green)}.level-button.done.selected .dot{color:#fff}.note{font-size:11px;color:var(--muted);line-height:1.6}.mission{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}.mission-head{padding:25px 28px 20px;border-bottom:1px solid var(--line)}.mission-title-row{display:flex
